<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wafra store presentation</title><style>
@font-face{font-family:Geist;src:url('../../../../public/fonts/Geist-Regular.ttf');font-weight:400}@font-face{font-family:Geist;src:url('../../../../public/fonts/Geist-Medium.ttf');font-weight:500}@font-face{font-family:Geist;src:url('../../../../public/fonts/Geist-SemiBold.ttf');font-weight:600}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#f5f1e7;font-family:Geist,sans-serif}.stage{width:1080px;height:1920px;position:relative;overflow:hidden;--bg:#f4f0e7;--fg:#191b17;--muted:#62645e;background:var(--bg);color:var(--fg)}.ink{--bg:#14251e;--fg:#fcf8ef;--muted:#bbcbc2}.indigo{--bg:#252c55;--fg:#fcf8ef;--muted:#c6cce4}.ochre{--bg:#e3b75e;--fg:#24201a;--muted:#65522f}.slate{--bg:#285665;--fg:#fcf8ef;--muted:#c0d0d3}.brand{position:absolute;top:66px;left:72px;display:flex;align-items:center;gap:18px;font-size:36px;font-weight:600;letter-spacing:-1px}.brand img{width:62px;height:62px}.category{position:absolute;top:89px;right:74px;color:var(--muted);font-size:22px;letter-spacing:.6px}.heading{position:absolute;left:72px;top:175px;margin:0;font-size:86px;line-height:1.04;letter-spacing:-3.4px;font-weight:600;max-width:945px}.sub{position:absolute;left:76px;top:387px;width:900px;font-size:31px;line-height:1.35;color:var(--muted);margin:0;letter-spacing:-.4px}.device{position:absolute;top:510px;left:110px;width:860px;height:1370px;overflow:hidden;border:2px solid rgba(0,0,0,.14);border-radius:34px;box-shadow:0 22px 45px rgba(0,0,0,.14);background:#f5f1e7}.device img{position:absolute;left:0;top:-47.78px;width:860px;height:1528.89px}.footer{position:absolute;left:74px;right:74px;bottom:19px;display:flex;justify-content:space-between;font-size:19px;color:var(--muted);letter-spacing:.2px}.focus{position:absolute;left:72px;top:690px;width:936px;overflow:hidden;border-radius:30px;box-shadow:0 18px 44px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.12);background:#f5f1e7}.focus img{position:absolute;max-width:none}.focus-label{position:absolute;top:585px;left:76px;font-size:24px;font-weight:500;color:var(--muted)}.note{position:absolute;left:76px;right:76px;bottom:165px;font-size:34px;line-height:1.4;letter-spacing:-.5px;max-width:820px}.privacy .focus{left:72px;width:936px;top:640px;height:225px}.privacy .focus.second{top:980px;height:185px}.privacy .focus img{width:991.06px;left:-26.02px;top:-954.35px}.privacy .focus.second img{top:-1303.04px}.privacy .fact{position:absolute;left:76px;top:1210px;font-size:42px;line-height:1.8;letter-spacing:-1px}.fact span{display:block}.fact span:before{content:'✓';color:#1f6b52;margin-right:22px;font-weight:600}.feature{width:1024px;height:500px;background:#14251e;color:#fcf8ef}.feature .brand{left:54px;top:44px;font-size:34px;gap:14px}.feature .brand img{width:54px;height:54px}.feature .heading{left:54px;top:144px;max-width:620px;font-size:55px;line-height:1.1;letter-spacing:-2px}.feature .sub{left:56px;top:294px;width:580px;font-size:23px;line-height:1.4;color:#c6d1ca}.feature .pill{position:absolute;left:56px;top:390px;font-size:17px;letter-spacing:.4px;border-top:1px solid #547665;padding-top:18px;width:540px;color:#b9cfbf}.feature .device{top:37px;left:723px;width:252px;height:448px;border-radius:18px;box-shadow:0 18px 30px #0004;border:2px solid #668776}.feature .device img{width:252px;height:448px;top:0}
</style></head><body><main class="stage" id="stage"></main><script>
(async()=>{const q=new URLSearchParams(location.search),f=q.get('frame')||'01-home',stage=document.querySelector('#stage');const img=(file)=>'../native-source/'+file;const logo='../../../../public/wafra-icon.svg';
if(f==='feature'){document.documentElement.style.cssText='width:1024px;height:500px';document.body.style.cssText='width:1024px;height:500px';stage.className='stage feature';stage.innerHTML=`<div class="brand"><img src="${logo}">Wafra</div><h1 class="heading">Know where it goes.<br>Plan what comes next.</h1><p class="sub">A clear view of spending, budgets and bills.<br>No bank login needed.</p><div class="pill">PRIVATE EXPENSE TRACKING</div><div class="device"><img src="${img('01-home.png')}"></div>`;}
else{const frames=await(await fetch('./frames.json')).json(),p=frames.find(x=>x.id===f);if(!p)throw Error('Unknown frame');stage.className='stage '+p.theme+(p.kind==='privacy'?' privacy':'');stage.innerHTML=`<div class="brand"><img src="${logo}">Wafra</div><div class="category">PERSONAL FINANCE</div><h1 class="heading">${p.headline.join('<br>')}</h1><p class="sub">${p.sub}</p><div class="footer"><span>Actual app screens · Sample data</span><span>${String(frames.indexOf(p)+1).padStart(2,'0')} / 08</span></div>`;
if(p.kind==='full')stage.innerHTML+=`<div class="device"><img src="${img(p.source)}"></div>`;
else if(p.kind==='focus'){let[x,y,w,h]=p.focus,s=936/w;stage.innerHTML+=`<div class="focus-label">IN THE APP</div><div class="focus" style="height:${h*s}px"><img src="${img(p.source)}" style="width:${1080*s}px;left:${-x*s}px;top:${-y*s}px"></div><p class="note">${p.id.startsWith('02')?'You choose the access. Support varies by bank and message format.':p.id.startsWith('04')?'Upcoming dates. Clear amounts. One place to check.':'A little context makes a budget easier to follow.'}</p>`;}
else{stage.innerHTML+=`<div class="focus"><img src="${img(p.source)}"></div><div class="focus second"><img src="${img(p.source)}"></div><div class="fact"><span>Optional app lock</span><span>No bank login</span><span>Exports you control</span></div>`;}}
await document.fonts.ready;await Promise.all([...document.images].map(x=>x.decode()));document.body.dataset.ready='true';})().catch(e=>{document.body.dataset.error=e.message;throw e});
</script></body></html>

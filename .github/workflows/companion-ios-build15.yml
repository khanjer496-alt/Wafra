name: Temporary Companion iOS build 15

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/companion-ios-build15.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-ios-build-15
  cancel-in-progress: false

jobs:
  build-submit-public:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: UV7YN4GQ66
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      GH_TOKEN: ${{ github.token }}
      ASC_APP_ID: '6814258840'
      SOURCE_REVIEW_APP_ID: '6799171482'
      SOURCE_TAG: companion-ios-bridge-74f1804c59f9
      SOURCE_ASSET: companion-source-74f1804c59f9.tgz
      SOURCE_ARCHIVE_SHA256: be93c664871df0bbd47a8067279d5c64b6f888aa4bead290a27b82c2ea0f6d83
      SOURCE_BASE_SHA: 74f1804c59f9198206ce34421c570aab7628f009
      RELEASE_FIX_SHA: 3bb886f43f11726108f388e1d74064730531b75b
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 22.4.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Select newest stable Xcode
        shell: bash
        run: |
          set -euo pipefail
          BEST=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          test -n "$BEST"
          sudo xcode-select -s "$BEST/Contents/Developer"
          xcodebuild -version

      - name: Require release credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in EXPO_TOKEN EXPO_ASC_API_KEY_P8 EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID; do
            test -n "${!name:-}" || { echo "Missing repository secret: $name"; exit 1; }
          done
          eas whoami

      - name: Download verified Companion source handoff
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/companion-source"
          mkdir -p "$ROOT" "$RUNNER_TEMP/companion-evidence" "$RUNNER_TEMP/companion-public"
          gh release download "$SOURCE_TAG" --repo khanjer496-alt/Wafra --pattern "$SOURCE_ASSET" --dir "$ROOT"
          ARCHIVE="$ROOT/$SOURCE_ASSET"
          test -f "$ARCHIVE"
          ACTUAL_SHA=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
          test "$ACTUAL_SHA" = "$SOURCE_ARCHIVE_SHA256"
          tar -xzf "$ARCHIVE" -C "$ROOT"
          test -f "$ROOT/mobile/app.json"
          echo "APP_DIR=$ROOT/mobile" >> "$GITHUB_ENV"

      - name: Apply verified ITMS-90129 display-name fix
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          node <<'NODE'
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          if (!['Companion', 'Companion Focus Pet'].includes(app.expo?.name)) {
            throw new Error(`Unexpected existing Expo name: ${app.expo?.name}`);
          }
          if (app.expo?.ios?.bundleIdentifier !== 'app.companion.productivity') {
            throw new Error('Unexpected iOS bundle identifier');
          }
          if (app.expo?.extra?.eas?.projectId !== '3cb8e0e0-3b5b-46de-a6e6-d006a3ad50a4') {
            throw new Error('Unexpected EAS project ID');
          }
          app.expo.name = 'Companion Focus Pet';
          fs.writeFileSync('app.json', `${JSON.stringify(app, null, 2)}\n`);
          NODE
          test "$(node -p "require('./app.json').expo.name")" = 'Companion Focus Pet'
          test "$(node -p "require('./app.json').expo.version")" = '1.1.0'
          test "$(node -p "require('./app.json').expo.ios.bundleIdentifier")" = 'app.companion.productivity'

      - name: Install local iOS build toolchain
        shell: bash
        run: |
          set -euo pipefail
          gem install fastlane -v 2.238.0 --no-document
          gem install cocoapods -v 1.16.2 --no-document
          cd "$APP_DIR"
          npm ci
          fastlane --version
          pod --version

      - name: Prepare App Store Connect API key
        shell: bash
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          if printf '%s' "$EXPO_ASC_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$EXPO_ASC_API_KEY_P8" > "$KEY"
          else
            printf '%s' "$EXPO_ASC_API_KEY_P8" | tr -d '[:space:]' | base64 -d > "$KEY"
          fi
          chmod 600 "$KEY"
          grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "EXPO_ASC_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Initialize exact temporary Git source
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          git init -q
          git config user.name 'Companion iOS release bridge'
          git config user.email 'companion-ios-bridge@users.noreply.github.com'
          git add -A
          git commit -qm "Companion ${SOURCE_BASE_SHA} with ${RELEASE_FIX_SHA} display-name fix"

      - name: Build signed Companion IPA locally
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          eas build --platform ios --profile preview --local --non-interactive --freeze-credentials --output "$RUNNER_TEMP/Companion-local.ipa"

      - name: Verify signed IPA identity and display name
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq "$RUNNER_TEMP/Companion-local.ipa"
          CHECK="$RUNNER_TEMP/companion-ipa-check"
          mkdir -p "$CHECK"
          ditto -x -k "$RUNNER_TEMP/Companion-local.ipa" "$CHECK"
          APP=$(find "$CHECK/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP" && test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/companion-profile.plist"
          export APP
          python3 <<'PY'
          import hashlib, json, os, pathlib, plistlib, shutil
          app = pathlib.Path(os.environ['APP'])
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          profile = plistlib.loads((temp / 'companion-profile.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'app.companion.productivity'
          assert info['CFBundleShortVersionString'] == '1.1.0'
          assert info.get('CFBundleDisplayName') == 'Companion Focus Pet'
          assert 'UV7YN4GQ66' in profile['TeamIdentifier']
          assert 'ProvisionedDevices' not in profile
          assert not profile.get('ProvisionsAllDevices', False)
          version = info['CFBundleShortVersionString']
          number = str(info['CFBundleVersion'])
          target = temp / 'companion-evidence' / f'Companion-{version}-{number}.ipa'
          shutil.copyfile(temp / 'Companion-local.ipa', target)
          report = {
            'sourceBaseCommit': os.environ['SOURCE_BASE_SHA'],
            'releaseFixCommit': os.environ['RELEASE_FIX_SHA'],
            'version': version,
            'buildNumber': number,
            'bundleIdentifier': info['CFBundleIdentifier'],
            'bundleDisplayName': info.get('CFBundleDisplayName'),
            'sha256': hashlib.file_digest(target.open('rb'), 'sha256').hexdigest(),
            'bytes': target.stat().st_size,
            'storeSigningVerified': True,
          }
          (temp / 'companion-evidence' / 'verification.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f"build_number={number}\nversion={version}\nipa_path={target}\n")
          print(json.dumps(report, indent=2))
          PY
          test "${{ steps.ipa.outputs.build_number }}" != '14'

      - uses: actions/upload-artifact@v4
        with:
          name: companion-ios-corrected-${{ steps.ipa.outputs.build_number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/companion-evidence/
          retention-days: 14

      - name: Upload corrected IPA to App Store Connect
        env:
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          cp "$EXPO_ASC_API_KEY_PATH" "$KEY_DIR/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$EXPO_ASC_KEY_ID" --apiIssuer "$EXPO_ASC_ISSUER_ID"

      - name: Process and publish Companion Public Beta
        env:
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD_NUMBER: ${{ steps.ipa.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createPrivateKey, sign } from 'node:crypto';

          const APP = process.env.ASC_APP_ID;
          const SOURCE_REVIEW_APP = process.env.SOURCE_REVIEW_APP_ID;
          const VERSION = process.env.VERSION;
          const NUMBER = process.env.BUILD_NUMBER;
          const raw = process.env.EXPO_ASC_API_KEY_P8 || '';
          const keyId = process.env.EXPO_ASC_KEY_ID || '';
          const issuerId = process.env.EXPO_ASC_ISSUER_ID || '';
          const pem = raw.includes('BEGIN PRIVATE KEY') ? raw : Buffer.from(raw.replace(/\s/g, ''), 'base64').toString('utf8');
          const privateKey = createPrivateKey(pem);
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const token = () => {
            const now = Math.floor(Date.now() / 1000);
            const unsigned = `${b64({ alg: 'ES256', kid: keyId, typ: 'JWT' })}.${b64({ iss: issuerId, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' })}`;
            return `${unsigned}.${sign('sha256', Buffer.from(unsigned), { key: privateKey, dsaEncoding: 'ieee-p1363' }).toString('base64url')}`;
          };
          async function api(path, { method = 'GET', body } = {}) {
            const response = await fetch(`https://api.appstoreconnect.apple.com/v1/${path}`, {
              method,
              headers: { Authorization: `Bearer ${token()}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
              signal: AbortSignal.timeout(30000),
            });
            const text = await response.text();
            if (!response.ok) {
              const error = new Error(`${method} ${path.split('?')[0]} returned ${response.status}`);
              error.status = response.status;
              try { error.appleErrors = (JSON.parse(text).errors || []).map(item => ({ code: item.code, title: item.title, detail: item.detail })); }
              catch { error.appleErrors = []; }
              throw error;
            }
            return text ? JSON.parse(text) : null;
          }
          const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
          const app = (await api(`apps/${APP}`)).data;
          if (app.attributes.bundleId !== 'app.companion.productivity') throw new Error('ASC app ID does not belong to Companion');

          let selected = null;
          for (let attempt = 0; attempt < 91; attempt += 1) {
            const response = await api(`builds?filter[app]=${APP}&filter[version]=${encodeURIComponent(NUMBER)}&include=preReleaseVersion,buildBetaDetail&limit=100`);
            const included = new Map((response.included || []).map(item => [`${item.type}:${item.id}`, item]));
            const matches = (response.data || []).filter(build => {
              const ref = build.relationships?.preReleaseVersion?.data;
              return ref && included.get(`${ref.type}:${ref.id}`)?.attributes?.version === VERSION;
            });
            if (matches.length > 1) throw new Error('Multiple builds match the corrected version and build number');
            if (matches.length === 1) {
              const build = matches[0];
              const detailRef = build.relationships?.buildBetaDetail?.data;
              selected = { build, detail: detailRef ? included.get(`${detailRef.type}:${detailRef.id}`) : null };
              console.log(JSON.stringify({ attempt, processingState: build.attributes.processingState }));
              if (build.attributes.processingState === 'VALID') break;
              if (['INVALID', 'FAILED'].includes(build.attributes.processingState)) throw new Error(`Apple marked build ${NUMBER} ${build.attributes.processingState}`);
            }
            await wait(20000);
          }
          if (!selected || selected.build.attributes.processingState !== 'VALID') throw new Error(`Build ${NUMBER} did not become VALID`);
          const buildId = selected.build.id;

          if (selected.build.attributes.usesNonExemptEncryption === null) {
            await api(`builds/${buildId}`, { method: 'PATCH', body: { data: { type: 'builds', id: buildId, attributes: { usesNonExemptEncryption: false } } } });
          }

          try {
            await api(`apps/${APP}/betaAppReviewDetail`);
          } catch (existingError) {
            if (existingError.status !== 404) throw existingError;
            const source = (await api(`apps/${SOURCE_REVIEW_APP}/betaAppReviewDetail`)).data.attributes;
            const attributes = {
              contactFirstName: source.contactFirstName,
              contactLastName: source.contactLastName,
              contactPhone: source.contactPhone,
              contactEmail: source.contactEmail,
              demoAccountRequired: false,
              notes: 'No sign-in is required. Please test the areas listed in What to Test.',
            };
            if (!attributes.contactFirstName || !attributes.contactLastName || !attributes.contactPhone || !attributes.contactEmail) throw new Error('Existing beta review contact is incomplete');
            await api('betaAppReviewDetails', { method: 'POST', body: { data: { type: 'betaAppReviewDetails', attributes, relationships: { app: { data: { type: 'apps', id: APP } } } } } });
          }

          const appLocalizations = (await api(`apps/${APP}/betaAppLocalizations?limit=100`)).data || [];
          const appEn = appLocalizations.find(item => item.attributes.locale === 'en-US');
          const appAttributes = {
            description: 'Companion helps users plan tasks and focus sessions with an interactive pet companion.',
            feedbackEmail: 'khanjer496@gmail.com',
          };
          if (appEn) {
            await api(`betaAppLocalizations/${appEn.id}`, { method: 'PATCH', body: { data: { type: 'betaAppLocalizations', id: appEn.id, attributes: appAttributes } } });
          } else {
            await api('betaAppLocalizations', { method: 'POST', body: { data: { type: 'betaAppLocalizations', attributes: { locale: 'en-US', ...appAttributes }, relationships: { app: { data: { type: 'apps', id: APP } } } } } });
          }

          const whatToTest = 'Please test onboarding, task creation and completion, focus sessions, Home interactions, pet reactions and audio, notifications, responsiveness, backup and restore, and report any crashes or visual regressions.';
          const buildLocalizations = (await api(`builds/${buildId}/betaBuildLocalizations?limit=100`)).data || [];
          const buildEn = buildLocalizations.find(item => item.attributes.locale === 'en-US');
          if (buildEn) {
            await api(`betaBuildLocalizations/${buildEn.id}`, { method: 'PATCH', body: { data: { type: 'betaBuildLocalizations', id: buildEn.id, attributes: { whatsNew: whatToTest } } } });
          } else {
            await api('betaBuildLocalizations', { method: 'POST', body: { data: { type: 'betaBuildLocalizations', attributes: { locale: 'en-US', whatsNew: whatToTest }, relationships: { build: { data: { type: 'builds', id: buildId } } } } } });
          }

          let groups = (await api(`apps/${APP}/betaGroups?limit=100`)).data || [];
          let group = groups.find(item => !item.attributes.isInternalGroup && item.attributes.name === 'Companion Public Beta');
          if (!group) {
            group = (await api('betaGroups', { method: 'POST', body: { data: { type: 'betaGroups', attributes: { name: 'Companion Public Beta', isInternalGroup: false }, relationships: { app: { data: { type: 'apps', id: APP } } } } } })).data;
          }
          const members = (await api(`betaGroups/${group.id}/relationships/builds?limit=200`)).data || [];
          if (!members.some(item => item.id === buildId)) {
            await api(`betaGroups/${group.id}/relationships/builds`, { method: 'POST', body: { data: [{ type: 'builds', id: buildId }] } });
          }
          group = (await api(`betaGroups/${group.id}`)).data;
          if (!group.attributes.publicLinkEnabled) {
            group = (await api(`betaGroups/${group.id}`, { method: 'PATCH', body: { data: { type: 'betaGroups', id: group.id, attributes: { publicLinkEnabled: true } } } })).data;
          }

          let current = await api(`builds/${buildId}?include=buildBetaDetail`);
          let detail = (current.included || []).find(item => item.type === 'buildBetaDetails') || null;
          if (detail && !detail.attributes.autoNotifyEnabled) {
            await api(`buildBetaDetails/${detail.id}`, { method: 'PATCH', body: { data: { type: 'buildBetaDetails', id: detail.id, attributes: { autoNotifyEnabled: true } } } });
          }

          let externalState = detail?.attributes?.externalBuildState || null;
          for (let attempt = 0; attempt < 13 && !['READY_FOR_BETA_SUBMISSION', 'WAITING_FOR_BETA_REVIEW', 'IN_BETA_REVIEW', 'APPROVED', 'IN_BETA_TESTING', 'READY_FOR_BETA_TESTING'].includes(externalState); attempt += 1) {
            await wait(10000);
            current = await api(`builds/${buildId}?include=buildBetaDetail`);
            detail = (current.included || []).find(item => item.type === 'buildBetaDetails') || null;
            externalState = detail?.attributes?.externalBuildState || null;
          }

          let betaReviewSubmissionId = null;
          if (externalState === 'READY_FOR_BETA_SUBMISSION') {
            const submission = await api('betaAppReviewSubmissions', { method: 'POST', body: { data: { type: 'betaAppReviewSubmissions', relationships: { build: { data: { type: 'builds', id: buildId } } } } } });
            betaReviewSubmissionId = submission.data.id;
          }

          for (let attempt = 0; attempt < 31; attempt += 1) {
            group = (await api(`betaGroups/${group.id}`)).data;
            current = await api(`builds/${buildId}?include=buildBetaDetail`);
            detail = (current.included || []).find(item => item.type === 'buildBetaDetails') || null;
            externalState = detail?.attributes?.externalBuildState || null;
            if (['WAITING_FOR_BETA_REVIEW', 'IN_BETA_REVIEW', 'APPROVED', 'IN_BETA_TESTING', 'READY_FOR_BETA_TESTING'].includes(externalState)) break;
            await wait(10000);
          }

          const report = {
            appId: APP,
            appName: app.attributes.name,
            version: VERSION,
            buildNumber: NUMBER,
            buildId,
            processingState: current.data.attributes.processingState,
            externalBuildState: externalState,
            betaReviewSubmissionId,
            groupId: group.id,
            groupName: group.attributes.name,
            publicLinkEnabled: group.attributes.publicLinkEnabled,
            publicLink: group.attributes.publicLink || null,
            whatToTest,
          };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/companion-public/result.json`, `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-ios-public-${{ github.run_id }}
          path: ${{ runner.temp }}/companion-public/result.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Remove temporary App Store Connect key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/AuthKey_"*.p8

name: Temporary cancel obsolete Companion release run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/companion-ios-cancel-stale.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel rejected build 14 repair poller
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/khanjer496-alt/Wafra/actions/runs/35625637252/cancel

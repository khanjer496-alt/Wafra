# TEMPORARY, NEVER MERGED. Read-only boundary diagnostic or independently selected Restore case.
name: app-lock-sim
# Purchase-only rerun: App Lock has separate passing evidence in run 43532093493.
on:
  # Review pushes on the working branch do not run anything. This one-shot
  # branch may be pushed only after CEO authorization at an approved SHA.
  push:
    branches: [test/storekit-boundary-approved]
  workflow_dispatch:
    inputs:
      purchase_case:
        type: choice
        description: One independent case (never a combined release verdict)
        default: diagnostic
        options: [diagnostic, empty, owned]

permissions:
  contents: read

concurrency:
  group: storekit-boundary-${{ github.ref }}
  # Preserve the active build/cache; the next harness revision waits its turn.
  cancel-in-progress: false

jobs:
  sim:
    runs-on: macos-15
    timeout-minutes: ${{ (inputs.purchase_case == 'empty' || inputs.purchase_case == 'owned') && 25 || 15 }}
    env:
      PURCHASE_CASE: ${{ inputs.purchase_case || 'diagnostic' }}
      APP_CACHE_KEY: app-lock-sim-app-v3-${{ hashFiles('src/**', 'modules/**', 'assets/**', 'plugins/**', 'app.json', 'package-lock.json', 'babel.config.js', 'metro.config.js', 'eas.json') }}
      HARNESS_GIT_SHA: ${{ github.sha }}
      # founder / auto-Pro OFF, like the production profile
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
      EXPO_PUBLIC_WAFRA_FOUNDER_UNLOCK: "0"
      EXPO_PUBLIC_WAFRA_AUTO_FOUNDER_PRO: "0"
      EXPO_PUBLIC_WAFRA_PARSER_RESEARCH: "0"
      EXPO_PUBLIC_WAFRA_SMS_CORPUS_EXPORT: "0"
      WAFRA_SMS_CORPUS_EXPORT: "0"
      EXPO_PUBLIC_WAFRA_RELAY_URL: ${{ vars.WAFRA_RELAY_URL || 'https://wafra-relay.khanjer496.workers.dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2 or newer
        run: |
          set -euo pipefail
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$BEST/Contents/Developer"
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "selected Xcode $VER from $BEST"
          [ "${VER%%.*}" -ge 26 ] || { echo "::error::need Xcode 26+, have $VER"; exit 1; }

      # The built .app is cached on the SOURCE that affects it, so re-running the test
      # script (this directory) does not rebuild for 20 minutes.
      - name: Restore cached Release simulator build
        id: appcache
        uses: actions/cache/restore@v4
        with:
          path: build/app
          key: ${{ env.APP_CACHE_KEY }}

      - name: Require existing app cache (never rebuild for this diagnostic)
        run: |
          test '${{ steps.appcache.outputs.cache-hit }}' = true || {
            echo '::error::app cache unavailable; diagnostic stopped without rebuilding'; exit 1;
          }

      - name: Boot one disposable simulator
        id: sim
        run: |
          set -euo pipefail
          DEVICE="iPhone 16 Pro Max"
          UDID=$(xcrun simctl create storekit-boundary "$DEVICE")
          [ -n "$UDID" ] || { xcrun simctl list devices available; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep -F "$UDID"
          xcrun simctl spawn "$UDID" sw_vers || true

      - name: Show the app's entitlements (evidence)
        run: |
          mkdir -p shots
          codesign -dvv --entitlements - "$(ls -d build/app/*.app | head -1)" 2>&1 | tee shots/app-entitlements.txt | head -40

      - name: Install the app
        run: |
          set -euo pipefail
          APP=$(ls -d build/app/*.app | head -1)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          xcrun simctl install '${{ steps.sim.outputs.udid }}' "$APP"

      - name: Purchase flow (StoreKit test session, no Apple account)
        id: purchase
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -o pipefail
          .github/app-lock-sim/purchase/run-purchase.sh '${{ steps.sim.outputs.udid }}' shots "$PWD/build/app" 2>&1 | tee shots/purchase-run.log

      - name: Apply public text allowlist after output closes
        id: public_export
        if: always()
        run: python3 -I .github/app-lock-sim/purchase/public-export.py --publish shots

      - name: Strip terminal escapes from the artifact text files
        if: always()
        run: |
          find shots -type f \( -name '*.log' -o -name '*.tsv' -o -name '*.txt' -o -name '*.json' \) -exec perl -pi -e 's/\e\[[0-9;?]*[A-Za-z]//g' {} + || true

      - name: Result table
        if: ${{ always() && steps.public_export.outcome == 'success' }}
        run: |
          {
            echo; echo "## Purchase flow (StoreKit test session)"
            echo "| Step | Result | Detail |"; echo "|---|---|---|"
            [ -f shots/purchase-results.tsv ] && awk -F'\t' '{printf "| %s | %s | %s |\n",$1,$2,$3}' shots/purchase-results.tsv
            [ -f shots/purchase-setup.txt ] && echo "| setup | $(cat shots/purchase-setup.txt) | |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test -s shots/purchase-results.tsv
          grep -q '^test rc=0$' shots/purchase-run.log
          case "$PURCHASE_CASE" in
            diagnostic) ROW=DIAG ;;
            empty) ROW=P3c ;;
            owned) ROW=P3b ;;
            *) exit 2 ;;
          esac
          awk -F'\t' -v row="$ROW" '$1 == row { n++; if ($2 != "PASS") bad=1 } END { exit (n != 1 || bad) }' shots/purchase-results.tsv
          echo "Only $ROW was selected. Neither diagnostic success nor one Restore case clears the combined build-195 gate."

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.public_export.outcome == 'success' }}
        with:
          name: app-lock-sim-screenshots
          path: shots/
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn

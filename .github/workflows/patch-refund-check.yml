name: Refund patch check

# CI-only side-branch check for a parser patch destined for PR181. Regenerates
# the native bundle from the checked-out source, runs the focused refund tests,
# and (only when the commit message contains [full]) the whole repair suite the
# way android-repair.yml does. Ships nothing; changes no runtime code.
on:
  workflow_dispatch:
  push:
    branches:
      - 'patch/refund-amount-binding-**'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix server ci
      - name: Regenerate the native bundle from the checked-out source
        run: |
          node scripts/generate-ios-background-parser.cjs
          node scripts/generate-ios-background-parser.cjs --check
      - name: Focused refund and issuer-confirmation tests
        run: |
          set -o pipefail
          node --test --test-name-pattern='issuer confirmation|refund acknowledgement|refund request stays refused|Arabic refund|merchant named with AND|refund credit rule' scripts/test/repair/review-round2-safety.test.cjs | tee focused.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-patch-focused-${{ github.sha }}
          path: focused.txt
          retention-days: 7

  full-repair:
    if: contains(github.event.head_commit.message, '[full]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate the native bundle, then compile the shipping modules
        run: |
          node scripts/generate-ios-background-parser.cjs
          npm --prefix server ci
          bash scripts/test/build.sh
      - name: Behavioural regressions (the whole repair suite)
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 scripts/test/repair/*.test.cjs | tee repair-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-patch-repair-${{ github.sha }}
          path: repair-tests.txt
          retention-days: 7

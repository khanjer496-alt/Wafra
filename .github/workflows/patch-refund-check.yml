name: Refund patch check

# CI-only side-branch check for a parser patch destined for PR181. Regenerates
# the native bundle from the checked-out source, runs the focused refund tests,
# and (only when the commit message contains [full]) the whole repair suite the
# way android-repair.yml does. Ships nothing; changes no runtime code.
on:
  workflow_dispatch:
  push:
    branches:
      - 'patch/refund-**'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix server ci
      - name: Regenerate the native bundle from the checked-out source
        run: |
          node scripts/generate-ios-background-parser.cjs
          node scripts/generate-ios-background-parser.cjs --check
      - name: Focused refund and issuer-confirmation tests
        run: |
          set -o pipefail
          node --test --test-name-pattern='issuer confirmation|refund acknowledgement|refund request stays refused|Arabic refund|merchant named with AND|refund credit rule|refund hardening|link-word footer|real URL stays refused' scripts/test/repair/review-round2-safety.test.cjs | tee focused.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-patch-focused-${{ github.sha }}
          path: focused.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: refund-final-resources-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            modules/wafra-live-capture/ios/Resources/WafraBackgroundParser.js
            modules/wafra-live-capture/ios/Resources/WafraBackgroundParser.meta.json
            src/lib/ios-background-parser-source.generated.ts

  full-repair:
    if: contains(github.event.head_commit.message, '[full]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate the native bundle, then compile the shipping modules
        run: |
          node scripts/generate-ios-background-parser.cjs
          npm --prefix server ci
          bash scripts/test/build.sh
      - name: Behavioural regressions (the whole repair suite)
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 scripts/test/repair/*.test.cjs | tee repair-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-patch-repair-${{ github.sha }}
          path: repair-tests.txt
          retention-days: 7

  check-suite:
    if: contains(github.event.head_commit.message, '[full]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ensure Android API used by native billing tests
        run: |
          test -n "${ANDROID_HOME:-}"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ]; then
            sdkmanager --install "platforms;android-36"
          fi
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Generate and check the shipping iOS background parser
        run: |
          node scripts/generate-ios-background-parser.cjs
          node scripts/generate-ios-background-parser.cjs --check
      - name: Typecheck
        run: npm run typecheck
      - name: Generate native iOS contract fixtures
        run: npx expo prebuild --platform ios --no-install
      - name: Test (the same step as the CI check job)
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refund-patch-npm-test-${{ github.sha }}
          path: npm-test.txt
          retention-days: 7

name: Direct-submit verified iOS build 120

on:
  push:
    branches: [main]
    paths: ['.github/workflows/ios-build120-direct-submit.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: wafra-ios-build120-direct-submit
  cancel-in-progress: false

jobs:
  submit-and-publish:
    if: contains(github.event.head_commit.message, '[submit-ios-120]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
      EXPECTED_SOURCE_SHA: 5a4356838d64eb1354c1176d1eb36d8b5fdc8576
      EXPECTED_IPA_SHA256: 798bbe6b718ea0eaf94b5682af5633340c7cf665bf6e227f7e696246b6ef600c
      WAFRA_BETA_VERSION: '1.0.0'
      WAFRA_BETA_BUILD_NUMBER: '120'
      WAFRA_BETA_SOURCE_SHA: 5a4356838d64eb1354c1176d1eb36d8b5fdc8576
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.EXPO_APPLE_TEAM_TYPE }}

    steps:
      - uses: actions/checkout@v4

      - name: Download already-verified build 120 artifact
        uses: actions/download-artifact@v4
        with:
          name: wafra-ios-local-120
          path: verified-build
          repository: khanjer496-alt/Wafra
          run-id: 34720956102
          github-token: ${{ github.token }}

      - name: Refuse anything except the exact verified binary
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f verified-build/verification.json
          IPA=$(find verified-build -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$IPA" && test -f "$IPA"
          node <<'NODE'
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('verified-build/verification.json','utf8'));
          const expected = process.env.EXPECTED_SOURCE_SHA;
          if (v.sourceCommit !== expected || v.buildHost !== 'github-macos' || v.profile !== 'history-beta' ||
              v.version !== '1.0.0' || String(v.buildNumber) !== '120' || v.bundleIdentifier !== 'app.wafra.ios' ||
              v.sha256 !== process.env.EXPECTED_IPA_SHA256 || v.storeSigningVerified !== true) {
            throw new Error('Artifact verification metadata does not match the approved build 120 release');
          }
          NODE
          ACTUAL=$(sha256sum "$IPA" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_IPA_SHA256"
          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"
          echo "Verified exact signed build 120 from $EXPECTED_SOURCE_SHA ($ACTUAL)."

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Prepare App Store Connect API key for EAS submit
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}"
          test -n "${EXPO_ASC_API_KEY_P8:-}"
          test -n "${EXPO_ASC_KEY_ID:-}"
          test -n "${EXPO_ASC_ISSUER_ID:-}"
          KEY="$RUNNER_TEMP/wafra-build120-asc.p8"
          umask 077
          if printf '%s' "$EXPO_ASC_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$EXPO_ASC_API_KEY_P8" > "$KEY"
          else
            printf '%s' "$EXPO_ASC_API_KEY_P8" | tr -d '[:space:]' | base64 -d > "$KEY"
          fi
          grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "EXPO_ASC_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Install pinned EAS CLI
        run: npm install -g eas-cli@22.4.0

      - name: Upload exact verified IPA to App Store Connect
        env:
          IPA_PATH: ${{ steps.artifact.outputs.ipa_path }}
        run: eas submit --platform ios --profile history-beta --path "$IPA_PATH" --non-interactive

      - name: Attach build 120 to existing public TestFlight group
        run: node scripts/release/ios-public-beta-publish.mjs --publish

      - name: Preserve public-beta evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build120-public-beta-${{ github.run_id }}
          path: ios-release-evidence/public-beta.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary Apple API key
        if: always()
        run: rm -f "$RUNNER_TEMP/wafra-build120-asc.p8"

name: Temporary Companion submit verified IPA from Linux

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  submit-public:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_NO_TELEMETRY: '1'
      APP_ID: '6814258840'
      VERSION: '1.1.0'
      BUILD_NUMBER: '14'
      EXPECTED_SHA256: '57ac4025d2796d6d68fad69ac4bc0f421cb625eb775fbaa92a5e209d0ae973f2'
      SOURCE_SHA: '74f1804c59f9198206ce34421c570aab7628f009'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - uses: expo/expo-github-action@v8
        with:
          eas-version: 22.4.0
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Download exact verified Companion IPA from private release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/companion-signed"
          gh release download companion-ios-signed-14-74f1804 --repo khanjer496-alt/Wafra --pattern 'Companion-1.1.0-14.ipa' --pattern 'verification.json' --dir "$RUNNER_TEMP/companion-signed"
          test -f "$RUNNER_TEMP/companion-signed/Companion-1.1.0-14.ipa"
          test -f "$RUNNER_TEMP/companion-signed/verification.json"

      - name: Download exact Companion source config
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/companion-source"
          mkdir -p "$ROOT"
          gh release download companion-ios-bridge-74f1804c59f9 \
            --repo khanjer496-alt/Wafra \
            --pattern 'companion-source-74f1804c59f9.tgz' \
            --dir "$ROOT"
          tar -xzf "$ROOT/companion-source-74f1804c59f9.tgz" -C "$ROOT"
          test -f "$ROOT/mobile/app.json" && test -f "$ROOT/mobile/eas.json"
          echo "APP_DIR=$ROOT/mobile" >> "$GITHUB_ENV"

      - name: Install Companion runtime dependencies for Expo config resolution
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Verify exact IPA and source identity
        id: ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/companion-signed/Companion-1.1.0-14.ipa"
          VERIFY="$RUNNER_TEMP/companion-signed/verification.json"
          test -f "$IPA" && test -f "$VERIFY"
          ACTUAL=$(sha256sum "$IPA" | awk '{print $1}')
          test "$ACTUAL" = "$EXPECTED_SHA256"
          node - "$VERIFY" <<'NODE'
          const fs=require('fs'); const v=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(v.sourceCommit!==process.env.SOURCE_SHA) throw new Error('wrong source commit');
          if(v.version!=='1.1.0'||v.buildNumber!=='14'||v.bundleIdentifier!=='app.companion.productivity'||v.storeSigningVerified!==true) throw new Error('wrong IPA identity');
          NODE
          test "$(node -p "require(process.env.APP_DIR+'/app.json').expo.extra.eas.projectId")" = '3cb8e0e0-3b5b-46de-a6e6-d006a3ad50a4'
          test "$(node -p "require(process.env.APP_DIR+'/app.json').expo.ios.bundleIdentifier")" = 'app.companion.productivity'
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key and noninteractive submit profile
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN" && test -n "$EXPO_ASC_API_KEY_P8" && test -n "$EXPO_ASC_KEY_ID" && test -n "$EXPO_ASC_ISSUER_ID"
          KEY="$RUNNER_TEMP/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          if printf '%s' "$EXPO_ASC_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$EXPO_ASC_API_KEY_P8" > "$KEY"
          else
            printf '%s' "$EXPO_ASC_API_KEY_P8" | tr -d '[:space:]' | base64 -d > "$KEY"
          fi
          chmod 600 "$KEY"; grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "EXPO_ASC_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          cd "$APP_DIR"
          node - <<'NODE'
          const fs=require('fs'); const p='eas.json'; const e=JSON.parse(fs.readFileSync(p,'utf8'));
          e.submit ??= {}; e.submit.preview ??= {}; e.submit.preview.ios ??= {};
          Object.assign(e.submit.preview.ios, {
            appleTeamId:'UV7YN4GQ66',
            ascAppId:'6814258840',
            ascApiKeyPath:process.env.EXPO_ASC_API_KEY_PATH,
            ascApiKeyId:process.env.EXPO_ASC_KEY_ID,
            ascApiKeyIssuerId:process.env.EXPO_ASC_ISSUER_ID
          });
          fs.writeFileSync(p,JSON.stringify(e,null,2)+'\n');
          NODE
          git init -q
          git config user.name 'Companion submit bridge'
          git config user.email 'companion-submit@users.noreply.github.com'
          git add -A && git commit -qm 'Exact Companion submit source'

      - name: Submit verified existing IPA through EAS Submit
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          eas submit --platform ios --profile preview --path "$IPA" --non-interactive --wait --verbose \
            | tee "$RUNNER_TEMP/eas-submit.log"

      - name: Wait for Apple processing and configure public TestFlight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/companion-public"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createPrivateKey,sign} from 'node:crypto';
          const APP=process.env.APP_ID, VERSION=process.env.VERSION, NUMBER=process.env.BUILD_NUMBER;
          const raw=process.env.EXPO_ASC_API_KEY_P8||'', kid=process.env.EXPO_ASC_KEY_ID||'', iss=process.env.EXPO_ASC_ISSUER_ID||'';
          const pem=raw.includes('BEGIN PRIVATE KEY')?raw:Buffer.from(raw.replace(/\s/g,''),'base64').toString('utf8');
          const key=createPrivateKey(pem), b64=d=>Buffer.from(JSON.stringify(d)).toString('base64url');
          const jwt=()=>{const n=Math.floor(Date.now()/1000);const s=`${b64({alg:'ES256',kid,typ:'JWT'})}.${b64({iss,iat:n,exp:n+600,aud:'appstoreconnect-v1'})}`;return `${s}.${sign('sha256',Buffer.from(s),{key,dsaEncoding:'ieee-p1363'}).toString('base64url')}`};
          async function api(path,{method='GET',body}={}){const r=await fetch(`https://api.appstoreconnect.apple.com/v1/${path}`,{method,headers:{Authorization:`Bearer ${jwt()}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});const t=await r.text();if(!r.ok){const e=new Error(`${method} ${path.split('?')[0]}: ${r.status}`);e.body=t;throw e;}return t?JSON.parse(t):null;}
          const wait=ms=>new Promise(r=>setTimeout(r,ms)); let found=null;
          for(let i=0;i<161;i++){
            const r=await api(`builds?filter[app]=${APP}&filter[version]=${encodeURIComponent(NUMBER)}&include=preReleaseVersion,buildBetaDetail&limit=100`);
            const inc=new Map((r.included||[]).map(x=>[`${x.type}:${x.id}`,x]));
            const matches=r.data.filter(x=>{const ref=x.relationships?.preReleaseVersion?.data;return ref&&inc.get(`${ref.type}:${ref.id}`)?.attributes.version===VERSION});
            if(matches.length>1) throw new Error('ambiguous build');
            if(matches.length){const b=matches[0],ref=b.relationships?.buildBetaDetail?.data;found={build:b,detail:ref?inc.get(`${ref.type}:${ref.id}`):null};console.log(JSON.stringify({attempt:i,processing:b.attributes.processingState,external:found.detail?.attributes?.externalBuildState||null}));if(b.attributes.processingState==='VALID')break;if(['INVALID','FAILED'].includes(b.attributes.processingState))throw new Error('Apple processing failed');}
            await wait(15000);
          }
          if(!found||found.build.attributes.processingState!=='VALID') throw new Error('build did not become VALID');
          const id=found.build.id;
          if(found.build.attributes.usesNonExemptEncryption===null) await api(`builds/${id}`,{method:'PATCH',body:{data:{type:'builds',id,attributes:{usesNonExemptEncryption:false}}}});
          const notes='Companion beta. Please test onboarding, tasks, focus sessions, Home interactions, pet reactions/audio, responsiveness, notifications, backup/restore, and report any crashes or visual regressions.';
          const loc=await api(`builds/${id}/betaBuildLocalizations?limit=100`); const en=loc.data.find(x=>x.attributes.locale==='en-US');
          if(en) await api(`betaBuildLocalizations/${en.id}`,{method:'PATCH',body:{data:{type:'betaBuildLocalizations',id:en.id,attributes:{whatsNew:notes}}}});
          else await api('betaBuildLocalizations',{method:'POST',body:{data:{type:'betaBuildLocalizations',attributes:{locale:'en-US',whatsNew:notes},relationships:{build:{data:{type:'builds',id}}}}}});
          let groups=(await api(`apps/${APP}/betaGroups?limit=100`)).data.filter(x=>!x.attributes.isInternalGroup);
          let group=groups.find(x=>x.attributes.publicLinkEnabled)||groups.find(x=>x.attributes.name==='Companion Public Beta')||groups[0];
          if(!group) group=(await api('betaGroups',{method:'POST',body:{data:{type:'betaGroups',attributes:{name:'Companion Public Beta',isInternalGroup:false},relationships:{app:{data:{type:'apps',id:APP}}}}}})).data;
          if(!group.attributes.publicLinkEnabled) group=(await api(`betaGroups/${group.id}`,{method:'PATCH',body:{data:{type:'betaGroups',id:group.id,attributes:{publicLinkEnabled:true}}}})).data;
          const members=await api(`betaGroups/${group.id}/relationships/builds?limit=200`); if(!members.data.some(x=>x.id===id)) await api(`betaGroups/${group.id}/relationships/builds`,{method:'POST',body:{data:[{type:'builds',id}]}});
          let current=await api(`builds/${id}?include=buildBetaDetail`); let detail=(current.included||[]).find(x=>x.type==='buildBetaDetails')||null;
          if(detail&&!detail.attributes.autoNotifyEnabled) await api(`buildBetaDetails/${detail.id}`,{method:'PATCH',body:{data:{type:'buildBetaDetails',id:detail.id,attributes:{autoNotifyEnabled:true}}}});
          let reviewAction='none', reviewError=null; const external=detail?.attributes?.externalBuildState||null;
          if(external==='READY_FOR_BETA_SUBMISSION'){
            try{await api('betaAppReviewSubmissions',{method:'POST',body:{data:{type:'betaAppReviewSubmissions',relationships:{build:{data:{type:'builds',id}}}}}});reviewAction='submitted-for-beta-review';}
            catch(e){reviewAction='beta-review-blocked';reviewError={message:e.message,body:e.body||null};}
          } else if(external==='READY_FOR_BETA_TESTING') {
            try{await api('buildBetaNotifications',{method:'POST',body:{data:{type:'buildBetaNotifications',relationships:{build:{data:{type:'builds',id}}}}}});reviewAction='notified-testers';}catch{}
          }
          group=(await api(`betaGroups/${group.id}`)).data; current=await api(`builds/${id}?include=buildBetaDetail`); detail=(current.included||[]).find(x=>x.type==='buildBetaDetails')||null;
          const report={appId:APP,version:VERSION,buildNumber:NUMBER,buildId:id,processingState:current.data.attributes.processingState,externalBuildState:detail?.attributes?.externalBuildState||null,groupId:group.id,groupName:group.attributes.name,publicLinkEnabled:group.attributes.publicLinkEnabled,publicLink:group.attributes.publicLink||null,reviewAction,reviewError};
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/companion-public/result.json`,JSON.stringify(report,null,2)+'\n'); console.log(JSON.stringify(report,null,2));
          NODE

      - name: Preserve submission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-linux-submit-public-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eas-submit.log
            ${{ runner.temp }}/companion-public/result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove API key
        if: always()
        shell: bash
        run: rm -f "${EXPO_ASC_API_KEY_PATH:-}"

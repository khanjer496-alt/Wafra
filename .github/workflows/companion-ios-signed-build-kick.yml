name: Kick Companion signed build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/companion-ios-signed-build-kick.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the repaired Companion signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run companion-ios-signed-build.yml --repo khanjer496-alt/Wafra --ref main

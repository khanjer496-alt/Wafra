name: Native iOS store capture (artifacts only)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'CEO/QA frozen full40 SHA, including this reviewed workflow; must equal selected workflow ref SHA'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ios-store-capture-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Require exact frozen SHA and production flags
        run: python3 scripts/store-capture/capture.py prepare --out artifacts/ios-store-capture
      - name: Select Xcode26.2 or newer
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              dev = app + '/Contents/Developer'
              version = subprocess.check_output(['xcodebuild', '-version'], env={**os.environ, 'DEVELOPER_DIR': dev}, text=True)
              number = tuple(map(int, re.search(r'Xcode (\d+(?:\.\d+)*)', version).group(1).split('.')))
              if number >= (26, 2): candidates.append((number, dev))
          if not candidates: raise SystemExit('Xcode26.2+ is required; no fallback')
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('DEVELOPER_DIR=' + max(candidates)[1] + '\n')
          PY
      - name: Use a consistent disposable-runner calendar
        run: sudo systemsetup -settimezone Etc/UTC
      - name: Install exact locked dependencies
        run: npm ci
      - name: Create and validate synthetic ordinary backups
        run: |
          node scripts/store-capture/backup.cjs artifacts/ios-store-capture/fixtures "$(date -u +%F)"
          npm --prefix server ci
          bash scripts/test/build.sh
          node scripts/store-capture/check-backups.cjs artifacts/ios-store-capture/fixtures
      - name: Generate native Release project
        run: |
          npx expo prebuild --platform ios --no-install
          python3 scripts/store-capture/capture.py configure-native --out artifacts/ios-store-capture
          npx pod-install
      - name: Build unsigned simulator Release with embedded JS
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Wafra.xcworkspace -scheme Wafra \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/store-capture \
            CODE_SIGNING_ALLOWED=NO build > artifacts/ios-store-capture/xcodebuild.log 2>&1
      - name: Install pinned Maestro with release checksum
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          echo '54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  '"$RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/store-maestro"
          echo "$RUNNER_TEMP/store-maestro/maestro/bin" >> "$GITHUB_PATH"
      - name: Restore and capture four exact native size-language passes
        run: |
          python3 scripts/store-capture/capture.py capture \
            --app build/store-capture/Build/Products/Release-iphonesimulator/Wafra.app \
            --out artifacts/ios-store-capture
      - name: Preserve complete or failed capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-store-capture-${{ github.sha }}-${{ github.run_id }}
          path: artifacts/ios-store-capture/
          if-no-files-found: error
          retention-days: 7

name: Inspect Wafra beta 117 export compliance
on:
  push:
    branches: [release/ios-shortcuts-review-20260907]
    paths: ['.github/workflows/ios-beta52-distribute.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Inspect recent build encryption state
        env:
          EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
        run: |
          node <<'NODE'
          const {createPrivateKey,sign}=require('node:crypto');
          const raw=process.env.EXPO_ASC_API_KEY_P8||''; const kid=process.env.EXPO_ASC_KEY_ID; const iss=process.env.EXPO_ASC_ISSUER_ID;
          const key=createPrivateKey(raw.includes('BEGIN PRIVATE KEY')?raw:Buffer.from(raw.replace(/\s/g,''),'base64').toString('utf8'));
          const b64=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const now=Math.floor(Date.now()/1000); const unsigned=`${b64({alg:'ES256',kid,typ:'JWT'})}.${b64({iss,iat:now,exp:now+600,aud:'appstoreconnect-v1'})}`;
          const jwt=`${unsigned}.${sign('sha256',Buffer.from(unsigned),{key,dsaEncoding:'ieee-p1363'}).toString('base64url')}`;
          async function get(path){const r=await fetch('https://api.appstoreconnect.apple.com/v1/'+path,{headers:{Authorization:`Bearer ${jwt}`}}); if(!r.ok) throw new Error(path+' '+r.status+' '+await r.text()); return r.json();}
          (async()=>{
            const b=await get('builds?filter[app]=6799171482&sort=-uploadedDate&limit=20&include=appEncryptionDeclaration,buildBetaDetail');
            const inc=new Map((b.included||[]).map(x=>[x.type+':'+x.id,x]));
            const rows=b.data.map(x=>({id:x.id,build:x.attributes.version,uploadedDate:x.attributes.uploadedDate,processingState:x.attributes.processingState,usesNonExemptEncryption:x.attributes.usesNonExemptEncryption??null,decl:(()=>{const r=x.relationships?.appEncryptionDeclaration?.data; if(!r)return null; const d=inc.get(r.type+':'+r.id); return {id:r.id,attrs:d?.attributes||null};})(),beta:(()=>{const r=x.relationships?.buildBetaDetail?.data; return r?inc.get(r.type+':'+r.id)?.attributes:null;})()}));
            const g=await get('betaGroups/c0ee30af-8b26-408c-8ebf-aaa5530fcac7/builds?limit=100');
            console.log(JSON.stringify({recentBuilds:rows,publicGroupBuildIds:g.data.map(x=>x.id)},null,2));
          })().catch(e=>{console.error(String(e));process.exit(1)});
          NODE

name: Dispatch exact-source CI once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-exact-ci-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run CI on the exact iOS source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref ci/final-ios-5fbe5083
      - name: Remove temporary CI branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/ci/final-ios-5fbe5083" || true
      - name: Remove this temporary workflow from main
        run: |
          rm -f .github/workflows/dispatch-exact-ci-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          git commit -m 'ci: remove exact-source CI dispatcher'
          git push origin HEAD:main

name: App Store screenshot simulator capture 197 (capture-only)

# Capture-only verification of PR #292 (c75d4ba9). Installs the Release
# simulator .app made by appstore-shots-sim-build-197.yml, restores the
# synthetic USD sample backup through the app's own restore flow, and takes raw
# 1206x2622 screenshots on an iPhone 16 Pro simulator: default text, two
# Larger Text sizes and Arabic.
# Nothing is signed, submitted or uploaded to App Store Connect.
on:
  push:
    branches: [capture/appstore-sim-build-195]
    paths:
      - '.github/workflows/appstore-shots-sim-capture-197.yml'
      - '.maestro/appstore-197/**'

permissions:
  contents: read
  actions: read

env:
  BUILD_RUN_ID: '45841868014'

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wafra-197-sim-release
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: build

      - name: Unpack and verify the Release simulator app
        run: |
          cat build/provenance.txt
          grep -q 'sourceCommit=c75d4ba9a81dffb09d2214fed6aabd69afdcbf6e' build/provenance.txt
          shasum -a 256 build/Wafra-sim-Release.app.zip
          ditto -x -k build/Wafra-sim-Release.app.zip app
          shasum -a 256 app/Wafra.app/main.jsbundle

      - name: Select stable Xcode
        run: |
          BEST=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$BEST/Contents/Developer"
          xcodebuild -version

      - name: Boot iPhone 16 Pro and stage the sample backup
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[]|select(.platform=="iOS" and .isAvailable)]|sort_by(.version)|last|.identifier')
          UDID=$(xcrun simctl create appstore-shots "iPhone 16 Pro" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale en_US
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array en-US
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          FILES=$(xcrun simctl get_app_container "$UDID" com.apple.DocumentsApp groups | awk -F'\t' '/FileProvider.LocalStorage/{print $2}')
          mkdir -p "$FILES/File Provider Storage"
          cp .maestro/appstore-197/wafra-sample-backup-usd.json "$FILES/File Provider Storage/"
          xcrun simctl install "$UDID" app/Wafra.app
          xcrun simctl list devices | grep "$UDID"

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture
        run: |
          set -uo pipefail
          U='${{ steps.sim.outputs.udid }}'
          mkdir -p shots
          maestro --device "$U" test --test-output-dir shots/a .maestro/appstore-197/a-light.yaml || echo "::warning::default pass failed"
          for SIZE in extra-extra-extra-large accessibility-medium; do
            xcrun simctl ui "$U" content_size "$SIZE"; sleep 3
            maestro --device "$U" test -e SIZE="$SIZE" --test-output-dir "shots/b-$SIZE" .maestro/appstore-197/b-size.yaml || echo "::warning::$SIZE pass failed"
          done
          xcrun simctl ui "$U" content_size large; sleep 2
          xcrun simctl terminate "$U" app.wafra.ios || true
          xcrun simctl spawn "$U" defaults write -g AppleLanguages -array ar en-US
          xcrun simctl spawn "$U" defaults write -g AppleLocale ar_US
          maestro --device "$U" test --test-output-dir shots/c .maestro/appstore-197/c-ar.yaml || echo "::warning::arabic pass failed"
          xcrun simctl io "$U" screenshot shots/99-final.png || true
          mkdir -p raw
          find shots -path '*takeScreenshot*' -name '*.png' -exec cp -f {} raw/ \;
          {
            echo "runtime=${{ steps.sim.outputs.runtime }}"
            echo "device=iPhone 16 Pro (simulator)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "runnerImage=$ImageOS $ImageVersion"
            echo "maestro=$(maestro --version 2>/dev/null | tail -1)"
            echo "runId=$GITHUB_RUN_ID"
          } | tee raw/capture-environment.txt
          shasum -a 256 raw/*.png | tee raw/SHA256SUMS
          ls raw | grep -c '^v-' | xargs -I{} echo "captured {} verification shots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafra-197-verify-raw
          path: |
            raw/
            shots/
          retention-days: 14

name: Selected service ownership diagnostic
on:
  push:
    branches: [patch/port190-pr7-service-ownership-red]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: node .github/patch-probe/service-ownership-probe.cjs
      - run: node --test --test-concurrency=1 scripts/test/repair/principal-assertion-boundaries.test.cjs > boundaries.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-ownership-red
          path: |
            service-ownership-results.json
            boundaries.txt

name: Focused trace observer and receipt diagnostics
on:
  push:
    branches: [patch/probe-pr7-r9-observer]
permissions:
  contents: read
jobs:
  observer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Generate and check source-bound resources
        run: |
          node scripts/generate-ios-background-parser.cjs > observer-generation.txt 2>&1
          node scripts/generate-ios-background-parser.cjs --check >> observer-generation.txt 2>&1
      - name: Prepare existing native contract fixtures
        run: npx expo prebuild --platform ios --no-install
      - name: Collect receipt evidence without changing expectations
        if: ${{ !cancelled() }}
        run: node .github/patch-probe/receipt-money-probe.cjs
      - name: Verify the observer with an absolute preload path
        if: ${{ !cancelled() }}
        env:
          WAFRA_PARSE_TRACE_DIR: ${{ runner.temp }}/observer-proof
          NODE_OPTIONS: --require ${{ github.workspace }}/.github/patch-probe/parse-trace.cjs
        run: node --test --test-concurrency=1 scripts/test/repair/ios-background-parser-generator.test.cjs scripts/test/repair/ios-background-alert-parser.test.cjs scripts/test/repair/history-platform-parity.test.cjs > observer-proof.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observer-receipt-diagnostic-${{ github.sha }}
          path: |
            observer-generation.txt
            observer-proof.txt
            receipt-money-probe.json
          retention-days: 7

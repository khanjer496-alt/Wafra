name: Exact source invariant confirmation
on:
  push:
    branches: [patch/port190-pr7-invariant-confirm-r24]
permissions:
  contents: read
jobs:
  invariant:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind unchanged full-source parent
        run: |
          test "$(git rev-parse HEAD^)" = c960d8b8532597b05e386534a361d4f1284214ad
          git diff --exit-code HEAD^ HEAD -- src modules scripts/test
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Generate and compile identical source
        run: |
          node scripts/generate-ios-background-parser.cjs > generation-check.txt 2>&1
          node scripts/generate-ios-background-parser.cjs --check >> generation-check.txt 2>&1
          bash scripts/test/build.sh > compile.txt 2>&1
      - name: Same invariants with original input and unchanged hang guard
        run: node scripts/test/invariants.test.js > invariants.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invariant-confirm-${{ github.sha }}
          path: |
            generation-check.txt
            compile.txt
            invariants.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: invariant-resources-${{ github.sha }}
          path: |
            modules/wafra-live-capture/ios/Resources/WafraBackgroundParser.js
            modules/wafra-live-capture/ios/Resources/WafraBackgroundParser.meta.json
            src/lib/ios-background-parser-source.generated.ts
          retention-days: 7

name: Reversed annual fee correction controls
on:
  push:
    branches: [patch/port190-pr7-reversed-fee-green]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: node scripts/generate-ios-background-parser.cjs
      - run: node .github/patch-probe/reversed-fee-probe.cjs
      - run: node scripts/test/repair/same-fee-reversal.test.cjs > same-fee-controls.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversed-fee-green
          path: |
            reversed-fee-results.json
            same-fee-controls.txt

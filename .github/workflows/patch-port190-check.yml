name: Parser receipt closure iteration
on:
  push:
    branches: [patch/port190-pr7-receipt-admission-r13]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Exact source generation and compile
        run: |
          node scripts/generate-ios-background-parser.cjs > generation.txt 2>&1
          node scripts/generate-ios-background-parser.cjs --check >> generation.txt 2>&1
          bash scripts/test/build.sh > compile.txt 2>&1
          node node_modules/typescript/bin/tsc --noEmit > typecheck.txt 2>&1
      - name: Completion and native field assertions
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/selected-predicate-ownership.test.cjs > predicate.txt 2>&1
      - name: Three-path original and boundary fixtures
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/credit-settlement-closure.test.cjs > closure.txt 2>&1
      - name: All existing parser controls
        if: ${{ !cancelled() }}
        run: node scripts/test/parser.test.js > parser.txt 2>&1
      - name: Existing native history controls
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/ios-background-alert-parser.test.cjs scripts/test/repair/history-platform-parity.test.cjs > native.txt 2>&1
      - name: Actual incomplete and supplementary history controls
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/credit-review-retention.test.cjs > retention.txt 2>&1
      - name: Existing bank-corpus controls
        if: ${{ !cancelled() }}
        run: node scripts/test/bank-corpus.test.js > bank-corpus.txt 2>&1
      - name: Complete existing QA repayment and statement admission regressions
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/qa001-card-repayments.test.cjs scripts/test/repair/qa001-near-variants.test.cjs scripts/test/repair/statement-ledger-audit.test.cjs > qa-admission.txt 2>&1
      - name: Actual Kotlin banner and parser parity
        if: ${{ !cancelled() }}
        run: node scripts/test/instant-alert.test.js > instant-alert.txt 2>&1
      - name: Remaining predecessor traced application failures
        if: ${{ !cancelled() }}
        run: |
          set +e
          node scripts/test/android-review-capture.test.js > android-capture.txt 2>&1
          A=$?
          node scripts/test/best-effort-autopost.test.js > best-effort.txt 2>&1
          B=$?
          node scripts/test/fx.test.js > fx.txt 2>&1
          C=$?
          node scripts/test/universal-launch-coverage.test.js > coverage.txt 2>&1
          D=$?
          node scripts/test/verification-challenge.test.js > challenges.txt 2>&1
          E=$?
          printf '{"androidCapture":%s,"bestEffort":%s,"fx":%s,"coverage":%s,"challenges":%s}\n' "$A" "$B" "$C" "$D" "$E" > additional-exits.json
          test "$A" = 0 && test "$B" = 0 && test "$C" = 0 && test "$D" = 0 && test "$E" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-iteration-${{ github.sha }}
          path: |
            generation.txt
            compile.txt
            typecheck.txt
            predicate.txt
            closure.txt
            parser.txt
            native.txt
            retention.txt
            bank-corpus.txt
            instant-alert.txt
            qa-admission.txt
            android-capture.txt
            best-effort.txt
            fx.txt
            coverage.txt
            challenges.txt
            additional-exits.json
          retention-days: 7

name: Reversed annual fee bounded diagnostic
on:
  push:
    branches: [patch/port190-pr7-reversed-fee-d0aa]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: node .github/patch-probe/reversed-fee-probe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reversed-fee-d0aa
          path: reversed-fee-results.json

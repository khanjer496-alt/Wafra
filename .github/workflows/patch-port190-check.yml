name: Exact source proposition descriptor punctuation
on:
  push:
    branches: [patch/port190-pr7-proposition-descriptor-probe-r23]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind unchanged source to current full side
        run: |
          test "$(git rev-parse HEAD^)" = 22a3d9197fce89c84d1622ae01a5c9667ec23c58
          git diff --exit-code HEAD^ HEAD -- src modules scripts/test
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Generate candidate resources and execute actual consumers
        run: |
          node scripts/generate-ios-background-parser.cjs > generation-check.txt 2>&1
          node scripts/generate-ios-background-parser.cjs --check >> generation-check.txt 2>&1
          node .github/patch-probe/descriptor-probe.cjs > probe-summary.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proposition-descriptor-${{ github.sha }}
          path: |
            out/
            generation-check.txt
            probe-summary.txt
          retention-days: 7

name: Pending selected movement distinct transaction regression
on:
  push:
    branches: [patch/port190-pr7-pending-distinct-diagnostic]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: node diagnostic.cjs > diagnostic.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-distinct-diagnostic
          path: |
            diagnostic.txt

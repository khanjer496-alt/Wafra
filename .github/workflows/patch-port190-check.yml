name: Parser exact-source repair completion
on:
  push:
    branches: [patch/port190-pr7-repair-completion-r22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1]
    env:
      WAFRA_TRACE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Locked dependencies and exact-source resources
        run: |
          npm ci
          npm --prefix server ci
          mkdir -p out
          node scripts/generate-ios-background-parser.cjs > out/generation.txt 2>&1
          node scripts/generate-ios-background-parser.cjs --check >> out/generation.txt 2>&1
          bash scripts/test/build.sh > out/compile.txt 2>&1
          git fetch --depth=1 origin 34e7425e4f041f2e1d3e2582d693de331b12f5a1
          node .github/patch-probe/restore-shipping-ci-inputs.cjs
      - name: Prepare unchanged native contract fixtures
        run: |
          node .github/patch-probe/run-traced-suite.cjs out/preflight.jsonl native-fixtures node_modules/expo/bin/cli prebuild --platform ios --no-install
          node -e 'const fs=require("fs"),r=fs.readFileSync("out/preflight.jsonl","utf8").trim().split("\n").map(JSON.parse);if(r.length!==1||r.some(x=>!x.passed||x.signal||x.error))throw Error("native contract fixture setup failed")'
      - name: Complete disjoint repair partition under unchanged limits
        run: node .github/patch-probe/run-repair-partition.cjs ${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-completion-${{ matrix.partition }}-${{ github.sha }}
          path: out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: repair-completion-resources-${{ matrix.partition }}-${{ github.sha }}
          path: |
            modules/wafra-live-capture/ios/Resources/WafraBackgroundParser.js
            modules/wafra-live-capture/ios/Resources/WafraBackgroundParser.meta.json
            src/lib/ios-background-parser-source.generated.ts
          retention-days: 7

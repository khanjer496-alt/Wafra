name: Parser receipt closure iteration
on:
  push:
    branches: [patch/port190-pr7-closed-receipt-r10p]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Exact source generation and compile
        run: |
          node scripts/generate-ios-background-parser.cjs > generation.txt 2>&1
          node scripts/generate-ios-background-parser.cjs --check >> generation.txt 2>&1
          bash scripts/test/build.sh > compile.txt 2>&1
          node node_modules/typescript/bin/tsc --noEmit > typecheck.txt 2>&1
      - name: Completion and native field assertions
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/selected-predicate-ownership.test.cjs > predicate.txt 2>&1
      - name: Three-path original and boundary fixtures
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/credit-settlement-closure.test.cjs > closure.txt 2>&1
      - name: All existing parser controls
        if: ${{ !cancelled() }}
        run: node scripts/test/parser.test.js > parser.txt 2>&1
      - name: Existing native history controls
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/ios-background-alert-parser.test.cjs scripts/test/repair/history-platform-parity.test.cjs > native.txt 2>&1
      - name: Actual incomplete and supplementary history controls
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/credit-review-retention.test.cjs > retention.txt 2>&1
      - name: Existing bank-corpus controls
        if: ${{ !cancelled() }}
        run: node scripts/test/bank-corpus.test.js > bank-corpus.txt 2>&1
      - name: Existing semantic accounting matrix
        if: ${{ !cancelled() }}
        run: node scripts/test/bank-alert-semantics-matrix.test.js > semantic-matrix.txt 2>&1
      - name: Existing semantic interpreter
        if: ${{ !cancelled() }}
        run: node scripts/test/bank-alert-interpreter.test.js > semantic-interpreter.txt 2>&1
      - name: Existing global adversarial controls
        if: ${{ !cancelled() }}
        run: node scripts/test/global-alert-adversarial.test.js > adversarial.txt 2>&1
      - name: Existing receipt scope controls
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/universal-test/rc1-launch-safety.test.cjs scripts/universal-test/launch-safety.test.cjs > scope.txt 2>&1
      - name: Full ratcheted matrix
        if: ${{ !cancelled() }}
        run: REFUND_MATRIX_REPORT=matrix-report.json node --test --test-concurrency=1 scripts/test/repair/refund-matrix.test.cjs > matrix.txt 2>&1
      - name: No gap growth versus published source
        if: ${{ !cancelled() }}
        run: |
          git fetch --depth=1 origin 4a6abbfa0bfa978e4a7b8a43cbd6268682ca5d34
          node scripts/test/repair/refund-gaps-no-growth.cjs 4a6abbfa0bfa978e4a7b8a43cbd6268682ca5d34 > no-growth.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-iteration-${{ github.sha }}
          path: |
            generation.txt
            compile.txt
            typecheck.txt
            predicate.txt
            closure.txt
            parser.txt
            native.txt
            retention.txt
            bank-corpus.txt
            semantic-matrix.txt
            semantic-interpreter.txt
            adversarial.txt
            scope.txt
            matrix.txt
            matrix-report.json
            no-growth.txt
          retention-days: 7

name: Parse trace (side branch)

# CI-only side-branch check, never merged. Runs the parser-facing suites with a tracer
# (.github/patch-probe/parse-trace.cjs) that records every exported parseSms / interpretBankAlert call as
# body + sender -> result shapes, so two heads can be compared row by row. Ships nothing.
on:
  workflow_dispatch:
  push:
    branches:
      - 'patch/trace-**'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix server ci
      - name: Regenerate the native bundle, then compile the shipping modules
        run: |
          node scripts/generate-ios-background-parser.cjs
          mkdir -p out
          bash scripts/test/build.sh > out/compile-result.txt 2>&1
      - name: Trace exact source and preserve individual suite conclusions
        env:
          WAFRA_PARSE_TRACE_DIR: ${{ runner.temp }}/trace
          WAFRA_TRACE_ROOT: ${{ github.workspace }}
        run: |
          set +e
          export NODE_OPTIONS="--require $PWD/.github/patch-probe/parse-trace.cjs"
          cd scripts/test
          : > "$RUNNER_TEMP/exits.txt"
          : > "$RUNNER_TEMP/suite-results.jsonl"
          node "$WAFRA_TRACE_ROOT/.github/patch-probe/run-traced-suite.cjs" "$RUNNER_TEMP/suite-results.jsonl" repair --test --test-concurrency=2 repair/*.test.cjs >> "$RUNNER_TEMP/exits.txt"
          for t in ../universal-test/run.cjs ../universal-evidence/nonposting-regressions.test.cjs ../universal-evidence/money-regressions.test.cjs ../universal-evidence/evaluator.test.cjs ../universal-evidence-round2/run.cjs; do
            node "$WAFRA_TRACE_ROOT/.github/patch-probe/run-traced-suite.cjs" "$RUNNER_TEMP/suite-results.jsonl" "$t" "$t" >> "$RUNNER_TEMP/exits.txt"
          done
          for t in *.test.js; do
            node "$WAFRA_TRACE_ROOT/.github/patch-probe/run-traced-suite.cjs" "$RUNNER_TEMP/suite-results.jsonl" "$t" "$t" >> "$RUNNER_TEMP/exits.txt"
          done
          exit 0
      - name: Merge the trace
        run: |
          mkdir -p out
          cp "$RUNNER_TEMP/exits.txt" out/exits.txt
          cp "$RUNNER_TEMP/suite-results.jsonl" out/suite-results.jsonl
          node .github/patch-probe/merge-trace.cjs "$RUNNER_TEMP/trace" out/trace.jsonl | tee out/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parse-trace-${{ github.sha }}
          path: out/
          retention-days: 7

  original-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Prove exact source parent
        run: |
          test "$(git rev-parse HEAD^)" = 967315725b7e7ad7cb53b4a07d41d34d99335d04
          git diff --exit-code HEAD^ HEAD -- src modules scripts/test
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Check committed parser resources
        run: |
          node scripts/generate-ios-background-parser.cjs --check > generation-check.txt 2>&1
          git diff --exit-code -- src modules scripts/test
      - name: Run both original reviewer harnesses
        run: |
          mkdir -p /tmp/wafra-ts59 .github/reviewer-gate/scratch
          ln -s "$PWD/node_modules" /tmp/wafra-ts59/node_modules
          ln -s "$PWD" ".github/reviewer-gate/scratch/$GITHUB_SHA"
          node -e "require('fs').writeFileSync('reviewer-harness-cases.json',JSON.stringify([...require('./scripts/test/repair/credit-settlement-sweep.json'),...require('./scripts/test/repair/credit-settlement-review-probes.json')]))"
          REV="$GITHUB_SHA" node .github/reviewer-gate/legacy-probe.cjs reviewer-harness-cases.json legacy-harness-results.json > legacy-harness-summary.txt
          REV="$GITHUB_SHA" node .github/reviewer-gate/r4-original-probe.cjs reviewer-harness-cases.json reviewer-harness-results.json > reviewer-harness-rows.txt
          python3 .github/reviewer-gate/reviewer-compare.py > reviewer-harness-check.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-reviewer-harness-${{ github.sha }}
          path: |
            generation-check.txt
            reviewer-harness-cases.json
            legacy-harness-results.json
            reviewer-harness-results.json
            reviewer-harness-summary.json
            reviewer-harness-check.txt
          retention-days: 7

name: Bounded original descriptor polarity verification
on:
  push:
    branches: [patch/port190-pr7-proposition-descriptor-fix-r24]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Bind candidate to its exact feature parent
        run: |
          test "$(git rev-parse HEAD^)" = a9e12bf698ee4031e3ec758570c608d96c83b2d7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Generate candidate resources and execute actual consumers
        run: |
          node scripts/generate-ios-background-parser.cjs > generation-check.txt 2>&1
          node scripts/generate-ios-background-parser.cjs --check >> generation-check.txt 2>&1
          node --test --test-concurrency=1 --test-name-pattern='^owned-descriptor:' scripts/test/repair/credit-settlement-closure.test.cjs scripts/test/repair/credit-review-retention.test.cjs > descriptor-tests.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: descriptor-polarity-check-${{ github.sha }}
          path: |
            generation-check.txt
            descriptor-tests.txt
          retention-days: 7

name: Parser descriptor ownership red repro
on:
  push:
    branches: [patch/port190-pr7-delayed-probes-r5]
permissions:
  contents: read
jobs:
  predicate-red:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Existing source must fail the new owned-predicate controls
        run: node --test --test-concurrency=1 scripts/test/repair/selected-predicate-ownership.test.cjs > predicate-red.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: descriptor-predicate-red-${{ github.sha }}
          path: predicate-red.txt
          retention-days: 7

name: Parser inbox receipt diagnosis
on:
  push:
    branches: [patch/port190-pr7-inbox-detail-r14d]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Exact source generation and compile
        run: |
          node scripts/generate-ios-background-parser.cjs > generation.txt 2>&1
          node scripts/generate-ios-background-parser.cjs --check >> generation.txt 2>&1
          bash scripts/test/build.sh > compile.txt 2>&1
      - name: Read actual selected receipt predicates
        run: node --require ./.github/patch-probe/inbox-observer.cjs .github/patch-probe/inbox-diagnose.cjs > diagnosis-summary.txt
      - name: Existing inbox first-import test
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=1 scripts/test/repair/android396-first-import-balance.test.cjs > inbox.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-predicate-detail-${{ github.sha }}
          path: |
            generation.txt
            compile.txt
            inbox-diagnosis.json
            principal-diagnostics.json
            diagnosis-summary.txt
            inbox.txt
          retention-days: 7

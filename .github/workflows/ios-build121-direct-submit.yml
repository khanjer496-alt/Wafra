name: Direct-submit verified iOS build 121

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  submit-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: 1
      EXPECTED_SOURCE_SHA: d0726ccc4c58ead8d48bf2cb9361819221c7ca26
      EXPECTED_IPA_SHA256: 801a569bff00c93d944a3133a43a6f39511824e557c878d0430ccc278bb3a66c
      WAFRA_BETA_VERSION: '1.0.0'
      WAFRA_BETA_BUILD_NUMBER: '121'
      WAFRA_BETA_SOURCE_SHA: d0726ccc4c58ead8d48bf2cb9361819221c7ca26
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Download already-verified build 121 artifact
        uses: actions/download-artifact@v4
        with:
          name: wafra-ios-local-121
          path: verified-build
          repository: khanjer496-alt/Wafra
          run-id: 34750443708
          github-token: ${{ github.token }}

      - name: Refuse anything except the exact verified binary
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          IPA=$(find verified-build -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -n "$IPA" && test -f "$IPA"
          test "$(sha256sum "$IPA" | awk '{print $1}')" = "$EXPECTED_IPA_SHA256"
          node <<'NODE'
          const fs=require('fs'); const v=JSON.parse(fs.readFileSync('verified-build/verification.json','utf8'));
          if(v.sourceCommit!==process.env.EXPECTED_SOURCE_SHA || v.version!=='1.0.0' || String(v.buildNumber)!=='121' ||
             v.bundleIdentifier!=='app.wafra.ios' || v.sha256!==process.env.EXPECTED_IPA_SHA256 || v.storeSigningVerified!==true)
            throw new Error('Build 121 verification mismatch');
          NODE
          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Prepare App Store Connect key
        run: |
          KEY="$RUNNER_TEMP/wafra-121-asc.p8"; umask 077
          if printf '%s' "$EXPO_ASC_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$EXPO_ASC_API_KEY_P8" > "$KEY"; else printf '%s' "$EXPO_ASC_API_KEY_P8" | tr -d '[:space:]' | base64 -d > "$KEY"; fi
          echo "EXPO_ASC_API_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - run: npm install -g eas-cli@22.4.0
      - name: Upload exact verified IPA
        env:
          IPA_PATH: ${{ steps.artifact.outputs.ipa_path }}
        run: eas submit --platform ios --profile history-beta --path "$IPA_PATH" --non-interactive
      - name: Publish to existing public TestFlight group
        run: node scripts/release/ios-public-beta-publish.mjs --publish
      - name: Preserve publication evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build121-public-beta-${{ github.run_id }}
          path: ios-release-evidence/public-beta.json
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: rm -f "$RUNNER_TEMP/wafra-121-asc.p8"

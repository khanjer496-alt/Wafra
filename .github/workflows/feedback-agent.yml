name: Feedback agent

# Only exact, consented, redacted parser research may reach the model. Candidate
# code is untrusted. It never runs on a host that later receives a write token.
# No job shares a writable dependency cache. Raw input and logs are not artifacts.
on:
  repository_dispatch:
    types: [wafra-feedback]
  workflow_dispatch:
    inputs:
      feedback_id:
        description: 'Consented parser-research feedback UUID to process.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: feedback-agent-${{ github.event.client_payload.feedbackId || github.event.inputs.feedback_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FEEDBACK_ID: ${{ github.event.client_payload.feedbackId || github.event.inputs.feedback_id }}
  RELAY_URL: ${{ vars.WAFRA_RELAY_URL }}
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

jobs:
  generate:
    # A manual dispatch from a repair branch must not load different trusted code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream 2026-09-12
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream 2026-09-12
        with:
          node-version: 22.22.3
      - name: Prepare isolated generation image
        run: |
          set -euo pipefail
          docker build --tag wafra-feedback --file - . <<'DOCKERFILE'
          FROM node:22.22.3-bookworm@sha256:2d178f2785b96dfbf62a416ca2e40f50e30150b4ff3320d706f0d96e90600eb3 AS node-runtime
          FROM swift:6.2.4-bookworm@sha256:da5a812247285bddb8cf3a242f882a3affa156f34deb16df1b3267efe7129aff
          COPY --from=node-runtime /usr/local/bin/node /usr/local/bin/node
          COPY --from=node-runtime /usr/local/lib/node_modules/npm /usr/local/lib/node_modules/npm
          RUN ln -s ../lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm && \
              ln -s ../lib/node_modules/npm/bin/npx-cli.js /usr/local/bin/npx && \
              test "$(node --version)" = "v22.22.3" && \
              test "$(npm --version)" = "10.9.8" && swiftc --version
          RUN apt-get update && apt-get install -y --no-install-recommends default-jdk-headless sqlite3 make python3 && rm -rf /var/lib/apt/lists/*
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          WORKDIR /opt/wafra
          COPY package.json package-lock.json ./
          RUN npm ci
          COPY server/package.json server/package-lock.json ./server/
          RUN npm --prefix server ci
          # Exact npm registry version verified 2026-09-12; no floating latest.
          RUN npm install -g @anthropic-ai/claude-code@2.1.269
          WORKDIR /workspace
          DOCKERFILE
          mkdir -p "$RUNNER_TEMP/feedback" "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/handoff"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/candidate"
          ln -s /opt/wafra/node_modules "$RUNNER_TEMP/candidate/node_modules"
          ln -s /opt/wafra/server/node_modules "$RUNNER_TEMP/candidate/server/node_modules"

      - name: Verify explicit third-party AI consent and exact redaction schema
        env:
          FEEDBACK_READ_TOKEN: ${{ secrets.WAFRA_FEEDBACK_READ_TOKEN }}
        run: |
          set -euo pipefail
          node .github/scripts/feedback-input.mjs "$RUNNER_TEMP/feedback-item.json"
          node .github/scripts/feedback-prompt.mjs \
            "$RUNNER_TEMP/feedback-item.json" "$RUNNER_TEMP/feedback/PROMPT.md" /feedback

      - name: Run the agent inside its disposable container
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_ARGS: '--print --permission-mode acceptEdits --allowed-tools Bash Edit Write'
        run: |
          set -euo pipefail
          [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || { echo '::error::Agent authentication is not configured.'; exit 1; }
          # No runner environment, Docker socket, GitHub token, relay token,
          # trusted checkout, or original feedback input is mounted here.
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g \
            --env HOME=/tmp --env CLAUDE_CODE_OAUTH_TOKEN --env CLAUDE_ARGS \
            --env WORK=/feedback --env PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
            --mount "type=bind,src=$RUNNER_TEMP/candidate,dst=/workspace" \
            --mount "type=bind,src=$RUNNER_TEMP/feedback,dst=/feedback" \
            wafra-feedback bash -c '
              CI=1 EXPO_OFFLINE=1 node node_modules/expo/bin/cli prebuild --platform ios --no-install --template ./node_modules/expo/template.tgz &&
              claude $CLAUDE_ARGS --add-dir "$WORK" < "$WORK/PROMPT.md" > "$WORK/agent.log" 2>&1
            ' > "$RUNNER_TEMP/container.log" 2>&1 || {
              echo '::error::Agent execution failed. Diagnostic and agent output are withheld.'
              exit 1
            }

      - name: Package and scan with untouched host code before upload
        env:
          FEEDBACK_ITEM: ${{ runner.temp }}/feedback-item.json
          FEEDBACK_SUMMARY: ${{ runner.temp }}/feedback/SUMMARY.md
        run: |
          set -euo pipefail
          node .github/scripts/feedback-candidate.mjs collect \
            "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/handoff/candidate.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified upstream 2026-09-12
        with:
          name: feedback-candidate
          path: ${{ runner.temp }}/handoff/candidate.json
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream 2026-09-12
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream 2026-09-12
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, verified upstream 2026-09-12
        with:
          name: feedback-candidate
          path: ${{ runner.temp }}/handoff
      - name: Validate input and bind its digest before running candidate code
        id: candidate
        run: node .github/scripts/feedback-candidate.mjs digest "$RUNNER_TEMP/handoff/candidate.json"
      - name: Prepare clean baseline and independent test trees
        run: |
          set -euo pipefail
          docker build --tag wafra-feedback-tests --file - . <<'DOCKERFILE'
          FROM node:22.22.3-bookworm@sha256:2d178f2785b96dfbf62a416ca2e40f50e30150b4ff3320d706f0d96e90600eb3 AS node-runtime
          FROM swift:6.2.4-bookworm@sha256:da5a812247285bddb8cf3a242f882a3affa156f34deb16df1b3267efe7129aff
          COPY --from=node-runtime /usr/local/bin/node /usr/local/bin/node
          COPY --from=node-runtime /usr/local/lib/node_modules/npm /usr/local/lib/node_modules/npm
          RUN ln -s ../lib/node_modules/npm/bin/npm-cli.js /usr/local/bin/npm && \
              ln -s ../lib/node_modules/npm/bin/npx-cli.js /usr/local/bin/npx && \
              test "$(node --version)" = "v22.22.3" && \
              test "$(npm --version)" = "10.9.8" && swiftc --version
          RUN apt-get update && apt-get install -y --no-install-recommends default-jdk-headless sqlite3 make python3 && rm -rf /var/lib/apt/lists/*
          ENV PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          WORKDIR /opt/wafra
          COPY package.json package-lock.json ./
          RUN npm ci
          COPY server/package.json server/package-lock.json ./server/
          RUN npm --prefix server ci
          WORKDIR /workspace
          DOCKERFILE
          for tree in baseline red green; do
            mkdir -p "$RUNNER_TEMP/$tree"
            git archive HEAD | tar -x -C "$RUNNER_TEMP/$tree"
            ln -s /opt/wafra/node_modules "$RUNNER_TEMP/$tree/node_modules"
            ln -s /opt/wafra/server/node_modules "$RUNNER_TEMP/$tree/server/node_modules"
          done
          node .github/scripts/feedback-candidate.mjs tests "$RUNNER_TEMP/handoff/candidate.json" "$RUNNER_TEMP/red"
          node .github/scripts/feedback-candidate.mjs apply "$RUNNER_TEMP/handoff/candidate.json" "$RUNNER_TEMP/green"
      - name: Prove baseline green, reproduction red, and full change green offline
        run: |
          set -euo pipefail
          run_suite() {
            docker run --rm --read-only --network none --cap-drop ALL --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,exec,nosuid,nodev,size=1g \
              --env HOME=/tmp --env PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 \
              --mount "type=bind,src=$RUNNER_TEMP/$1,dst=/workspace" \
              wafra-feedback-tests bash -c 'CI=1 EXPO_OFFLINE=1 node node_modules/expo/bin/cli prebuild --platform ios --no-install --template ./node_modules/expo/template.tgz && npm test && npm --prefix server run typecheck && bash scripts/test/worker-gate.sh' \
              > "$RUNNER_TEMP/$1.log" 2>&1
          }
          # An existing broken baseline must not be counted as a reproduction.
          run_suite baseline || { echo '::error::The trusted baseline suite failed; no reproduction claim is possible.'; exit 1; }
          if run_suite red; then
            echo '::error::The proposed test passed without the fix; refusing publication.'
            exit 1
          else
            red_status=$?
            [ "$red_status" -eq 1 ] || { echo '::error::The reproduction failed abnormally; no test failure was established.'; exit 1; }
          fi
          run_suite green || { echo '::error::The proposed fix did not pass validation. Test output is withheld.'; exit 1; }
          echo 'The baseline passed, the proposed regression failed without its fix, and the complete candidate passed.'

  publish:
    needs: [generate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream 2026-09-12
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified upstream 2026-09-12
        with:
          node-version: 22.22.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, verified upstream 2026-09-12
        with:
          name: feedback-candidate
          path: ${{ runner.temp }}/handoff
      - name: Revalidate original consent and diagnostic then create a draft through the API
        env:
          GH_TOKEN: ${{ github.token }}
          FEEDBACK_READ_TOKEN: ${{ secrets.WAFRA_FEEDBACK_READ_TOKEN }}
          VALIDATED_DIGEST: ${{ needs.validate.outputs.digest }}
        run: node .github/scripts/feedback-publish.mjs "$RUNNER_TEMP/handoff/candidate.json"

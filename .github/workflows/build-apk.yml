name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Also build the Play Store AAB (not for previews)'
        type: boolean
        default: false
      corpus:
        description: 'Internal full-inbox parser corpus exporter'
        type: boolean
        default: false
      architecture:
        description: 'Android CPU architectures'
        type: choice
        options: [arm64, universal]
        default: arm64
      preview:
        description: 'Separate Wafra Preview installation; no production OTA'
        type: boolean
        default: false
      publish_preview:
        description: 'Explicitly publish this preview APK as a GitHub prerelease'
        type: boolean
        default: false
      expected_commit:
        description: 'Expected source commit; fail if the branch changed'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      EXPO_PUBLIC_WAFRA_E2E_DEMO: '0'
      EXPO_PUBLIC_WAFRA_RELAY_URL: ${{ vars.WAFRA_RELAY_URL || 'https://wafra-relay.khanjer496.workers.dev' }}
      EXPO_PUBLIC_WAFRA_SMS_CORPUS_EXPORT: ${{ inputs.corpus && '1' || '0' }}
      WAFRA_SMS_CORPUS_EXPORT: ${{ inputs.corpus && '1' || '0' }}
      EXPO_PUBLIC_WAFRA_FOUNDER_UNLOCK: ${{ inputs.preview && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify source and requested build scope
        env:
          EXPECTED: ${{ inputs.expected_commit }}
          PREVIEW: ${{ inputs.preview }}
          CORPUS: ${{ inputs.corpus }}
          BUNDLE: ${{ inputs.bundle }}
          PUBLISH: ${{ inputs.publish_preview }}
        run: |
          set -euo pipefail
          test -z "$EXPECTED" || test "$(git rev-parse HEAD)" = "$EXPECTED"
          test "$GITHUB_REF" = refs/heads/main || test "$PREVIEW" = true
          if [ "$PREVIEW" = true ]; then test "$CORPUS" = false; test "$BUNDLE" = false; fi
          test "$PUBLISH" = false || test "$PREVIEW" = true
          mkdir -p build-evidence
          git rev-parse HEAD > build-evidence/source-commit.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22.22.3', cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-
            gradle-redesign-preview-
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check application types before native compilation
        run: npx --no-install tsc --noEmit
      - name: Configure requested installation and version
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          node <<'JS'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('app.json','utf8'));
          c.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);
          const preview=process.env.PREVIEW==='true';
          if(preview){
            if(c.expo.android.package!=='app.wafra.android') throw new Error('Unexpected source package');
            c.expo.name='Wafra Preview'; c.expo.scheme='wafra-preview';
            c.expo.android.package='app.wafra.android.preview';
            c.expo.updates={...c.expo.updates,enabled:false,checkAutomatically:'NEVER',requestHeaders:{'expo-channel-name':'preview'}};
          }
          fs.writeFileSync('app.json',JSON.stringify(c,null,2)+'\n');
          fs.writeFileSync('build-evidence/config.json',JSON.stringify({preview,name:c.expo.name,package:c.expo.android.package,version:c.expo.version,versionCode:c.expo.android.versionCode,updatesEnabled:c.expo.updates?.enabled!==false,demoData:false},null,2));
          JS
      - name: Generate native Android project
        run: npx --no-install expo prebuild --platform android --no-install
      - name: Require SQLCipher and configure compiler memory
        run: |
          set -euo pipefail
          grep -qxE 'expo\.sqlite\.useSQLCipher=true' android/gradle.properties
          echo 'SQLCipher enabled in generated native build' > build-evidence/sqlcipher.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/gradle.properties');s=p.read_text()
          for k,v in {'org.gradle.jvmargs':'-Xmx3072m -XX:MaxMetaspaceSize=2048m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8','org.gradle.workers.max':'2','org.gradle.caching':'true'}.items():
              s='\n'.join(x for x in s.splitlines() if not x.startswith(k+'='))+'\n'+k+'='+v+'\n'
          p.write_text(s)
          PY
      - name: Sign with the existing upload key, never a replacement key
        env:
          KEYSTORE_B64: ${{ secrets.WAFRA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WAFRA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WAFRA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WAFRA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" || { echo '::error::Existing signing key required; refusing to create a non-upgradeable replacement.'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/wafra-upload.jks
          alias_name="${KEY_ALIAS:-wafra}"
          key_password="${KEY_PASSWORD:-$STORE_PASSWORD}"
          keytool -list -keystore android/app/wafra-upload.jks -storepass "$STORE_PASSWORD" -alias "$alias_name" >/dev/null 2>&1
          echo "::add-mask::$key_password"
          {
            echo "ORG_GRADLE_PROJECT_wafraStorePassword=$STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_wafraKeyPassword=$key_password"
            echo "ORG_GRADLE_PROJECT_wafraKeyAlias=$alias_name"
          } >> "$GITHUB_ENV"
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              upload {
                storeFile file('wafra-upload.jks')
                storePassword project.property('wafraStorePassword')
                keyPassword project.property('wafraKeyPassword')
                keyAlias project.property('wafraKeyAlias')
              }
            }
            buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE
      - name: Compile standalone release APK
        working-directory: android
        env:
          PREVIEW: ${{ inputs.preview }}
          CORPUS: ${{ inputs.corpus }}
          ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          set -euo pipefail
          if [ "$PREVIEW" = true ]; then
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon 2>&1 | tee ../build-evidence/gradle.log
          elif [ "$CORPUS" = true ] || [ "$ARCHITECTURE" = arm64 ]; then
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon 2>&1 | tee ../build-evidence/gradle.log
          else
            ./gradlew assembleRelease --no-daemon 2>&1 | tee ../build-evidence/gradle.log
          fi
      - name: Optional Play bundle
        if: inputs.bundle && !inputs.preview && !inputs.corpus
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Verify and prepare installer
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          set -euo pipefail
          mkdir -p installer
          if [ "$PREVIEW" = true ]; then NAME=Wafra-Ledger-Light-Preview.apk; else NAME=wafra.apk; fi
          cp android/app/build/outputs/apk/release/app-release.apk "installer/$NAME"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs "installer/$NAME" > installer/signature.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "installer/$NAME" > build-evidence/alignment.txt
          "$TOOLS/aapt" dump badging "installer/$NAME" > installer/badging.txt
          ! grep -q application-debuggable installer/badging.txt
          if [ "$PREVIEW" = true ]; then grep -q "package: name='app.wafra.android.preview'" installer/badging.txt; fi
          unzip -l "installer/$NAME" | grep 'assets/index.android.bundle' > build-evidence/bundle.txt
          cp build-evidence/config.json build-evidence/source-commit.txt build-evidence/sqlcipher.txt installer/
          (cd installer && sha256sum "$NAME" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.preview && 'wafra-ledger-light-preview' || inputs.corpus && 'wafra-sms-corpus-apk' || 'wafra-apk' }}
          path: installer/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: inputs.bundle && !inputs.preview && !inputs.corpus
        with:
          name: wafra-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: android-build-evidence, path: build-evidence/, retention-days: 7}

  preview-smoke:
    if: inputs.preview
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with: {name: wafra-ledger-light-preview, path: installer}
      - name: Verify installer checksum
        run: cd installer && sha256sum -c SHA256SUMS
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and inspect the standalone native app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            mkdir -p native-evidence
            adb install installer/Wafra-Ledger-Light-Preview.apk > native-evidence/install.txt
            adb logcat -c
            adb shell am start -W -n app.wafra.android.preview/.MainActivity > native-evidence/launch.txt
            sleep 20
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml native-evidence/onboarding.xml
            adb exec-out screencap -p > native-evidence/onboarding.png
            adb logcat -d > native-evidence/logcat.txt
            adb shell pidof app.wafra.android.preview > native-evidence/pid.txt
            grep -q 'Start tracking' native-evidence/onboarding.xml
            ! grep -E 'FATAL EXCEPTION|Fatal signal|ReactNativeJS:.*(TypeError:|ReferenceError:|Invariant Violation)' native-evidence/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ledger-light-native-smoke, path: native-evidence/, retention-days: 7}

  publish-preview:
    if: inputs.preview && inputs.publish_preview
    needs: [build, preview-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: wafra-ledger-light-preview, path: installer}
      - name: Publish the verified installer as a prerelease, not a store release
        env:
          REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
          NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          (cd installer && sha256sum -c SHA256SUMS)
          test "$(cat installer/source-commit.txt)" = "$SOURCE"
          TAG="android-ledger-light-preview-$NUMBER"
          printf '%s\n' '# Wafra Preview — Ledger & Light' '' 'Original Claude paper/charcoal design, W-arrow logo, monetary typography and clear SMS-import status.' 'Android tab springs removed; inactive tabs frozen; intermediate counters do not write the ledger.' '' 'Installs as Wafra Preview, separately from production Wafra. Existing preview data can update only when the signing certificate matches. Do not uninstall to resolve a signature error.' 'No demo data and no production OTA updates. Native release compilation, signing checks and initial emulator launch passed.' 'Internal preview only. Full physical-phone SMS throughput and extended native interactions are not certified. Existing broader browser and iOS baseline failures are recorded separately; no security check is waived.' '' "Source: $SOURCE" "Build: https://github.com/$REPO/actions/runs/$GITHUB_RUN_ID" > notes.md
          gh release create "$TAG" --repo "$REPO" --target "$SOURCE" --title "Wafra Preview $NUMBER — Ledger & Light" --notes-file notes.md --prerelease --draft --latest=false
          gh release upload "$TAG" --repo "$REPO" installer/Wafra-Ledger-Light-Preview.apk installer/SHA256SUMS installer/source-commit.txt installer/config.json installer/signature.txt
          gh release view "$TAG" --repo "$REPO" --json assets > assets.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('installer/Wafra-Ledger-Light-Preview.apk');d=hashlib.sha256(p.read_bytes()).hexdigest()
          assets=json.load(open('assets.json'))['assets'];a=next(a for a in assets if a['name']==p.name)
          assert a['size']==p.stat().st_size
          print('Verified uploaded installer size; local checksum',d)
          PY
          gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease --latest=false
          echo "https://github.com/$REPO/releases/download/$TAG/Wafra-Ledger-Light-Preview.apk" >> "$GITHUB_STEP_SUMMARY"

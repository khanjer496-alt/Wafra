name: Build Android APK

# A release build costs ~18 runner minutes; the free tier is 2,000 a month,
# and building on every push to the working branch burned the whole allowance
# in a month — after which nothing builds at all until the reset.
#
# CI guards every main push. Full APK/AAB builds are explicit manual requests,
# not a side effect of routine development or repository cleanup. The selected
# workflow ref is also the source ref: dispatching from `main` builds `main`,
# while an explicitly selected review branch can produce an isolated candidate
# without silently substituting `main` underneath it.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Also build the Play Store bundle (.aab) — adds ~5 min'
        type: boolean
        default: false
      corpus:
        description: 'Internal ARM64 APK with the temporary full-inbox parser corpus exporter'
        type: boolean
        default: false
      founder_unlock:
        description: 'Hidden Wafra logo Founder Pro unlock (on by default; forced off for a Play bundle)'
        type: boolean
        default: true
      auto_pro:
        description: 'Tester APK: automatically grant permanent device-local Founder Pro on first launch (never a Play bundle)'
        type: boolean
        default: false
      architecture:
        description: 'ARM64 for modern Android phones; universal for all supported CPUs'
        type: choice
        options:
          - arm64
          - universal
        default: arm64
      capture_trace:
        description: 'Internal test APK: local capture stage counts and timings only, no message content'
        type: boolean
        default: false
# A push during a build was already cancelling it, but only after the runner
# had burned 15 minutes on Gradle. Making it explicit kills the superseded run
# immediately instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # playwright is a devDependency for the e2e scripts; this build never
      # launches a browser, so skip the browser download during npm ci.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      # Expo INLINES every EXPO_PUBLIC_* value at bundle time, and Metro bundles
      # inside the Gradle release step below — so a value absent from this
      # environment is absent from the APK, with no build error to say so.
      #
      # eas.json sets this for EAS builds and nothing set it here, so every APK
      # this workflow has ever produced shipped with DEFAULT_RELAY_URL empty.
      # `relay.ts` deliberately has no fallback ("a release with no deployed
      # relay must fail setup visibly, not send financial messages to a domain
      # that merely looks plausible"), which is right, and the visible failure
      # is what nobody was looking at: iOS setup could not pair, and the
      # feedback screen reported that sending was not connected in this build.
      #
      # A repository VARIABLE with the eas.json value as the fallback, so a
      # fork or a renamed Worker overrides it without editing this file. Not a
      # secret: it is a public URL that ships inside the APK by definition.
      EXPO_PUBLIC_WAFRA_RELAY_URL: ${{ vars.WAFRA_RELAY_URL || 'https://wafra-relay.khanjer496.workers.dev' }}
      EXPO_PUBLIC_SUPERWALL_ANDROID_API_KEY: ${{ vars.EXPO_PUBLIC_SUPERWALL_ANDROID_API_KEY || 'pk_h206sECq-roxM9QdMvVBJ' }}
      # Both halves are required: Gradle compiles the raw native method closed,
      # while Expo inlines the public flag into the JavaScript bundle. A normal
      # push/manual build pins both off. Only an explicit manual corpus run can
      # enable them together.
      EXPO_PUBLIC_WAFRA_SMS_CORPUS_EXPORT: ${{ github.event.inputs.corpus == 'true' && '1' || '0' }}
      WAFRA_SMS_CORPUS_EXPORT: ${{ github.event.inputs.corpus == 'true' && '1' || '0' }}
      EXPO_PUBLIC_WAFRA_PARSER_RESEARCH: ${{ github.event.inputs.corpus == 'true' && '1' || '0' }}
      # The side-loaded APK this workflow exists to produce is an internal test
      # build, and its tester is the founder: the five-tap Wafra logo in
      # Settings is ON unless it is explicitly turned off, so a fresh APK never
      # lands without a way to activate Founder Pro. A Play bundle is the one
      # artifact that reaches strangers, so `bundle` forces the gesture closed
      # regardless of the input — Metro inlines this value into whichever
      # artifact the same job builds.
      EXPO_PUBLIC_WAFRA_FOUNDER_UNLOCK: ${{ (github.event.inputs.bundle != 'true' && github.event.inputs.founder_unlock != 'false') && '1' || '0' }}
      EXPO_PUBLIC_WAFRA_AUTO_FOUNDER_PRO: ${{ (github.event.inputs.auto_pro == 'true' && github.event.inputs.bundle != 'true' && github.event.inputs.founder_unlock != 'false') && '1' || '0' }}
      EXPO_PUBLIC_WAFRA_CAPTURE_TRACE: ${{ github.event.inputs.capture_trace == 'true' && '1' || '0' }}
      EXPO_PUBLIC_WAFRA_INTERNAL_DIAGNOSTICS: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Refuse research exports in a Play bundle
        if: inputs.bundle == true && inputs.corpus == true
        run: |
          echo '::error::Research corpus exports are internal APK-only tools and cannot enter a Play bundle.'
          exit 1

      - name: Refuse conflicting automatic tester Pro inputs
        if: inputs.auto_pro == true && (inputs.bundle == true || inputs.founder_unlock == false)
        run: |
          echo '::error::Automatic tester Pro requires founder access and an APK-only build. It cannot enter a Play bundle.'
          exit 1

      - name: Refuse diagnostic tracing in a Play bundle
        if: github.event.inputs.capture_trace == 'true' && github.event.inputs.bundle == 'true'
        run: |
          echo '::error::Capture tracing is for a local device test APK, not a Play bundle.'
          exit 1

      - name: Record tester Pro policy
        run: |
          if [ "$EXPO_PUBLIC_WAFRA_AUTO_FOUNDER_PRO" = "1" ]; then
            echo "### Automatic tester Pro enabled" >> "$GITHUB_STEP_SUMMARY"
            echo "First native launch grants device-local Founder Pro without a store purchase. The grant survives ledger erase and later production upgrades on this installation; backups do not transfer it." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EXPO_PUBLIC_WAFRA_FOUNDER_UNLOCK" = "1" ]; then
            echo "### 🔓 Founder Pro gesture enabled" >> "$GITHUB_STEP_SUMMARY"
            echo "Tap the Wafra logo at the bottom of Settings five times to activate Founder Pro." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 🔒 Founder Pro gesture disabled" >> "$GITHUB_STEP_SUMMARY"
            echo "This artifact compiles the hidden logo unlock closed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require the approved Claude design baseline
        run: node scripts/check-design-baseline.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Play rejects a versionCode it has seen before, and app.json pins it at
      # 1 forever. The run number only ever increases, so every build is
      # uploadable without anyone remembering to bump a file.
      - name: Stamp versionCode from the run number
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.android = app.expo.android || {};
            app.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
            console.log('versionCode =', app.expo.android.versionCode);
          "

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Play bundle update channel
        if: inputs.bundle && !inputs.corpus
        run: node scripts/play-update-channel.cjs configure android/app/src/main/AndroidManifest.xml

      # Expo's generated 512 MiB metaspace cap exhausted during
      # :expo-updates:kspReleaseKotlin. Give class metadata room and fail
      # immediately on OOM instead of hanging until the job timeout.
      - name: Configure Android compiler memory
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'android/gradle.properties';
          let contents = fs.readFileSync(file, 'utf8');
          const properties = {
            'org.gradle.jvmargs': '-Xmx3072m -XX:MaxMetaspaceSize=2048m -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8',
            'org.gradle.workers.max': '2',
          };
          for (const [key, value] of Object.entries(properties)) {
            contents = contents.split('\n').filter(line => !line.startsWith(key + '=')).join('\n').trimEnd();
            contents += '\n' + key + '=' + value + '\n';
          }
          fs.writeFileSync(file, contents);
          console.log('Android compiler memory: 3 GiB heap, 2 GiB metaspace, 2 workers; OOM exits immediately.');
          NODE

      # The one build setting that fails SILENTLY and INVISIBLY.
      #
      # `PRAGMA key` on a plain SQLite build is an unrecognised pragma, and
      # SQLite ignores unrecognised pragmas WITHOUT ERROR. So a build without
      # SQLCipher does not crash, does not warn, and does not fail a single
      # test — it writes the user's entire bank ledger to disk in plaintext
      # while every layer above believes it is encrypted. There is nothing at
      # runtime that would tell us, and nothing in the JS tests that can.
      #
      # `android/` is gitignored and regenerated here, so the checked-in tree
      # has no answer to check; this step runs immediately after prebuild
      # because that is the first moment the real, generated value exists —
      # and before Gradle, so a plaintext build is never produced at all.
      # `expo.sqlite.useSQLCipher` is written by expo-sqlite's config plugin
      # from the `useSQLCipher` prop in app.json.
      - name: Verify SQLCipher survived prebuild
        run: |
          set -euo pipefail
          if [ ! -f android/gradle.properties ]; then
            echo "::error::android/gradle.properties is missing after prebuild."
            exit 1
          fi
          if ! grep -qxE 'expo\.sqlite\.useSQLCipher=true' android/gradle.properties; then
            echo "::error::expo.sqlite.useSQLCipher=true is not in android/gradle.properties after prebuild. SQLCipher would not be compiled in, PRAGMA key would be silently ignored, and the ledger would be written in PLAINTEXT. Check the expo-sqlite plugin entry in app.json."
            exit 1
          fi
          echo "### 🔐 SQLCipher enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "\`expo.sqlite.useSQLCipher=true\` present in the generated Gradle properties." >> "$GITHUB_STEP_SUMMARY"

      # Sign releases with the Play upload key. Required repo secrets:
      #
      #   WAFRA_KEYSTORE_B64        base64 of wafra-upload.jks (base64 -w0)
      #   WAFRA_KEYSTORE_PASSWORD   its store password
      #   WAFRA_KEY_PASSWORD        key password (optional; defaults to store)
      #   WAFRA_KEY_ALIAS           key alias   (optional; defaults to wafra)
      #
      # Credentials reach Gradle as ORG_GRADLE_PROJECT_* properties, so they
      # are never written into build.gradle or any other file in the
      # workspace. Only sideloaded test APKs may use a disposable key.
      - name: Configure release signing
        env:
          PLAY_BUNDLE: ${{ inputs.bundle }}
          KEYSTORE_B64: ${{ secrets.WAFRA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WAFRA_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WAFRA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WAFRA_KEY_ALIAS }}
        run: |
          set -euo pipefail
          alias_name="${KEY_ALIAS:-wafra}"

          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::WAFRA_KEYSTORE_B64 is set but WAFRA_KEYSTORE_PASSWORD is not."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/app/wafra-upload.jks
            store_password="$KEYSTORE_PASSWORD"
            key_password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            # Fail here with something actionable rather than deep inside Gradle.
            if ! keytool -list -keystore android/app/wafra-upload.jks \
                 -storepass "$store_password" -alias "$alias_name" >/dev/null 2>&1; then
              echo "::error::Keystore did not open with WAFRA_KEYSTORE_PASSWORD, or it has no '$alias_name' alias. Check the secrets (WAFRA_KEY_ALIAS overrides the alias)."
              exit 1
            fi
            echo "Signing with the upload keystore from secrets (alias: $alias_name)."
            # Same fingerprint every run means every APK installs over the last.
            # "|| true" matters: set -o pipefail turns a grep that matches
            # nothing into a failed pipeline, which killed the whole build on
            # a purely cosmetic line. keytool prints "Certificate fingerprint
            # (SHA-256):", not "SHA256:", so the original grep never matched.
            fp="$(keytool -list -v -keystore android/app/wafra-upload.jks -storepass "$store_password" -alias "$alias_name" 2>/dev/null | grep -i 'SHA256' | head -1 || true)"
            echo "### ✅ Signed with the upload key" >> "$GITHUB_STEP_SUMMARY"
            echo "Installs over the previous build. \`$fp\`" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PLAY_BUNDLE" = "true" ]; then
            echo "::error::A Play bundle requires the existing WAFRA_KEYSTORE_B64 upload key."
            exit 1
          else
            store_password="$(openssl rand -base64 24)"
            key_password="$store_password"
            echo "::add-mask::$store_password"
            keytool -genkeypair -v -keystore android/app/wafra-upload.jks \
              -alias "$alias_name" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$store_password" -keypass "$key_password" \
              -dname "CN=Wafra, OU=Wafra, O=Wafra, L=Dubai, C=AE"
            echo "::warning::WAFRA_KEYSTORE_B64 not set - signed with a throwaway key."
            # A log line is easy to miss, and missing it costs a reinstall on
            # every single build: Android refuses an update whose signature
            # changed, and this branch mints a new key each run.
            {
              echo "### ⚠️ Signed with a throwaway key"
              echo
              echo "\`WAFRA_KEYSTORE_B64\` is not set, so this run generated a new"
              echo "signing key. **This APK cannot install over a previous one** —"
              echo "Android will ask you to uninstall first — and it cannot be"
              echo "uploaded to Play."
              echo
              echo "Fix once: set the \`WAFRA_KEYSTORE_B64\` and"
              echo "\`WAFRA_KEYSTORE_PASSWORD\` repository secrets."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Gradle reads ORG_GRADLE_PROJECT_<name> as project property <name>.
          echo "::add-mask::$key_password"
          {
            echo "ORG_GRADLE_PROJECT_wafraStorePassword=$store_password"
            echo "ORG_GRADLE_PROJECT_wafraKeyPassword=$key_password"
            echo "ORG_GRADLE_PROJECT_wafraKeyAlias=$alias_name"
          } >> "$GITHUB_ENV"

          cat >> android/app/build.gradle <<'EOG'

          android {
              signingConfigs {
                  upload {
                      storeFile file('wafra-upload.jks')
                      storePassword project.property('wafraStorePassword')
                      keyAlias project.property('wafraKeyAlias')
                      keyPassword project.property('wafraKeyPassword')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          EOG

      - name: Build release APK
        working-directory: android
        env:
          CORPUS_BUILD: ${{ github.event.inputs.corpus == 'true' && 'true' || 'false' }}
          APK_ARCHITECTURE: ${{ github.event.inputs.architecture || 'universal' }}
        run: |
          if [ "$CORPUS_BUILD" = "true" ] || [ "$APK_ARCHITECTURE" = "arm64" ]; then
            ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      # Only needed to upload to Play, which is not what most builds are for.
      #
      # The Play bundle ships ARM only (arm64-v8a, armeabi-v7a). With all four
      # ABIs it was 113 MB (396: x86 + x86_64 libraries 20.8 MB, plus their
      # share of the native debug symbols), over the 100 MiB browser upload
      # limit. x86 Android phones are essentially extinct, ChromeOS on x86 runs
      # ARM apps through translation, and arm64 meets Play's 64-bit rule. Native
      # debug symbols stay in the bundle, so crash reports stay symbolicated.
      # The APK step above keeps its own ABI choice (universal by default), so
      # QA can still install on an x86_64 emulator.
      - name: Build Play Store bundle (AAB)
        if: github.event.inputs.bundle == 'true' && github.event.inputs.corpus != 'true'
        working-directory: android
        run: ./gradlew :wafra-complimentary-transport:testReleaseUnitTest bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Verify the Play bundle is ARM only and under the upload limit
        if: github.event.inputs.bundle == 'true' && github.event.inputs.corpus != 'true'
        run: |
          set -euo pipefail
          aab="${WAFRA_AAB:-android/app/build/outputs/bundle/release/app-release.aab}"
          size=$(wc -c < "$aab" | tr -d ' ')
          echo "Play bundle size: $size bytes"
          if [ "$size" -gt 100000000 ]; then
            echo "::error::The Play bundle is $size bytes, over 100,000,000 (the browser upload limit is 104,857,600)."
            exit 1
          fi
          entries=$(unzip -Z1 "$aab")
          # Allow-list: every ABI directory, of native libraries in any module
          # (<module>/lib/<abi>/, or <module>/root/lib/<abi>/, which lands at the
          # APK root) and of the native debug symbols, must be arm64-v8a or
          # armeabi-v7a. Anchored to the module root, so a lib/ folder inside
          # assets or Java resources is not mistaken for an ABI.
          abis=$(printf '%s\n' "$entries" | sed -n -E \
            -e 's#^[^/]+/(root/)?lib/([^/]+)/.*#\2#p' \
            -e 's#^BUNDLE-METADATA/com\.android\.tools\.build\.debugsymbols/([^/]+)/.*#\1#p' | sort -u)
          unexpected=$(printf '%s\n' "$abis" | grep -v -x -E 'arm64-v8a|armeabi-v7a' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::The Play bundle contains native code or symbols for $(echo $unexpected); it must ship arm64-v8a and armeabi-v7a only."
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a; do
            if ! printf '%s\n' "$entries" | grep -E "^base/lib/$abi/[^/]+\.so$" >/dev/null; then
              echo "::error::The Play bundle has no base/lib/$abi libraries."
              exit 1
            fi
          done
          printf '%s\n' "$entries" | grep -E '^base/lib/[^/]+/' | cut -d/ -f3 | sort | uniq -c

      - name: Verify update channel in the packaged Play bundle
        if: inputs.bundle && !inputs.corpus
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/wafra-bundletool.jar"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$tool"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $tool" | sha256sum --check
          java -jar "$tool" dump manifest --module=base \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/wafra-play-manifest.xml"
          node scripts/play-update-channel.cjs verify "$RUNNER_TEMP/wafra-play-manifest.xml"

      - name: Rename outputs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk wafra.apk
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab wafra.aab
          fi

      # The environment above already forces these off for a Play bundle. This
      # reads what was actually COMPILED: the Founder Pro unlock, automatic
      # tester Pro and the full-inbox SMS exporter's JavaScript gate each leave
      # a "wafra-build-flag:<flag>=on|off" string in the Hermes bundle
      # (src/lib/founder-pro.ts, src/lib/sms-corpus-export.ts). Any "=on", a
      # missing marker, or both states at once fails the run before anything
      # is sealed. The same-job APK is checked too, because it is the build App
      # QA installs to clear this exact versionCode.
      - name: Verify production build flags in the packaged Play bundle and APK
        if: github.event.inputs.bundle == 'true' && github.event.inputs.corpus != 'true'
        run: |
          set -euo pipefail
          if [ "$WAFRA_SMS_CORPUS_EXPORT" != "0" ]; then
            echo "::error::WAFRA_SMS_CORPUS_EXPORT is '$WAFRA_SMS_CORPUS_EXPORT'; the native exporter must be compiled closed in a Play build."
            exit 1
          fi
          node scripts/android-build-flags.cjs verify-production wafra.aab
          node scripts/android-build-flags.cjs verify-production wafra.apk
          echo "### 🔒 Production build flags verified in the AAB and APK" >> "$GITHUB_STEP_SUMMARY"

      # The repository is PUBLIC: any signed-in GitHub user can download any
      # Actions artifact. Signed APKs and AABs therefore never leave the runner
      # in plaintext. They are encrypted to .github/android-artifact-recipient.pem,
      # whose private key exists only on the release Mac, and kept for one day:
      # long enough to download, decrypt and hash-check with
      # `node scripts/android-artifact-seal.cjs open` (docs/play-release.md).
      - name: Seal outputs for the public artifact store
        env:
          APK_LABEL: ${{ github.event.inputs.corpus == 'true' && 'wafra-sms-corpus-apk' || 'wafra-apk' }}
        run: |
          set -euo pipefail
          inputs=("$APK_LABEL=wafra.apk")
          if [ -f wafra.aab ]; then inputs+=("wafra-aab=wafra.aab"); fi
          node scripts/android-artifact-seal.cjs seal \
            --recipient .github/android-artifact-recipient.pem --out sealed \
            --meta "sourceCommit=$GITHUB_SHA" --meta "ref=$GITHUB_REF_NAME" \
            --meta "runId=$GITHUB_RUN_ID" --meta "versionCode=$GITHUB_RUN_NUMBER" \
            "${inputs[@]}"
          rm -f wafra.apk wafra.aab
          {
            echo "### 📦 Sealed artifact"
            echo "Encrypted to the release Mac's key; plaintext SHA-256 values are in verification.json."
            echo '```json'
            cat sealed/verification.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sealed artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafra-android-sealed-${{ github.run_number }}
          path: |
            sealed/*.enc
            sealed/verification.json
          if-no-files-found: error
          retention-days: 1

name: Unified Claude design native release
on:
  push:
    branches: [release/claude-unified-20260907]
    paths: [.github/workflows/claude-unified-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claude-unified-${{ github.sha }}
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned app source and reconcile only the two reviewed test fixtures
        id: source
        env:
          BRANCH: release/claude-unified-20260907
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib,pathlib
          expected={
            '.github/workflows/build-apk.yml':'0b39aeb1b49620a3df1133bdf43de77a5ad43682',
            '.github/workflows/ci.yml':'a5bb7e991c654b0666745587740abd8828a75c55',
            '.github/workflows/ios-testflight.yml':'321217ec18a27cafb6773b21364abbee4d3c2226',
            'config/design-baseline.json':'a4252ed350536ed960458c8280b3bd810f14a6f0',
            'scripts/check-design-baseline.mjs':'d63b46b46485035a0dea3d1f362e7ec85c308ea0',
            'scripts/e2e/e2e-period.mjs':'a089c1f7a845ef144e72dd6ad51db09de2342300',
            'scripts/e2e/e2e-smoke.mjs':'f3c150e1345ad3f47f7ecd851c3f88f3b0a5e76b',
            'scripts/test/contracts.test.js':'a96702910162b98932c69b8fd7f04598c9b4741c',
            'scripts/test/repair/journal-ui.test.cjs':'5c56b4066110d21c6961b0f67bafc608b393aa5f',
            'src/components/bills/payment-agenda.tsx':'d38c8ee5b034e6feb88707b13bcfbcacd05e2437',
            'src/components/reference-home-summary.tsx':'460db42f19cb66496613cfb4b9496e6beec21a24',
            'src/components/spending/spending-overview.tsx':'1bb6619c9c0198dda310be9d410401b6bb38945b',
            'src/components/spending/spending-trends.tsx':'bcbcbebda88b7323f51351e2d2928de2611e9011',
            'src/components/tab-bar.tsx':'80bb1f1cc046c1ee5543965942484c93af53faad',
            'src/screens/journal-home-screen.tsx':'243dbb11410967590d4ed93629182bcffeded514'
          }
          def blob(data):
            return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for path,sha in expected.items():
            actual=blob(pathlib.Path(path).read_bytes())
            assert actual==sha,(path,actual,sha)
          fixes=[
            ('scripts/e2e/e2e-navigation.mjs',
             '528c975257131069fb565b8ea569e9795a22ac29',
             '389fad8755e48dddf2a943c532f7d5821d353956',
             "  const tapped = await tapKey(page, name, 8000);\n  if (tapped !== true) throw new Error(`Could not hit-test tab: ${name}`);",
             '  // Home now has a visible "Spending" label as well as the navigation tab.\n  // Click the actionable tab, not an arbitrary matching text node. Playwright\n  // verifies visibility, hit-testing and enabled state before clicking.\n  await page.getByRole(\'tab\', { name, exact: true }).click({ timeout: 8000 });'),
            ('scripts/test/workflows/workflow-harness.cjs',
             'f92a445aaf0b824ca54c3ac324bacfb36814a0d7',
             '295bf07b40ece0c741395ae0a46285f0bff2d15a',
             "   h.local('@/lib/ios-capture-setup','src/lib/ios-capture-setup.ts');",
             "   // Execute the new, pure capture-health/journey modules too. Only native\n   // services remain substituted; UI and completion logic are never mocked.\n   d['./ios-capture-health']=h.local('@/lib/ios-capture-health','src/lib/ios-capture-health.ts');\n   h.local('@/lib/ios-setup-journey','src/lib/ios-setup-journey.ts');\n   d['./capture-health']=h.local('@/components/ios-message-setup/capture-health');\n   h.local('@/components/ios-message-setup/setup-journey');\n   h.local('@/lib/ios-capture-setup','src/lib/ios-capture-setup.ts');")
          ]
          for path,before,after,old,new in fixes:
            p=pathlib.Path(path);data=p.read_bytes()
            if blob(data)==after:continue
            assert blob(data)==before,(path,'unexpected source')
            text=data.decode();assert text.count(old)==1
            result=text.replace(old,new).encode()
            assert blob(result)==after,(path,'unexpected result',blob(result))
            p.write_bytes(result)
          print('Pinned app and exact test reconciliation verified; no shipping source or workflow is rewritten.')
          PY
          node scripts/check-design-baseline.mjs
          git add scripts/e2e/e2e-navigation.mjs scripts/test/workflows/workflow-harness.cjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Use explicit navigation tabs and execute new iOS health modules in test harness'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Unified source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  source:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
          sudo apt-get update && sudo apt-get install -y sqlite3
          npx --no-install expo prebuild --platform ios --no-install
      - name: Full source, design and behaviour gates
        run: |
          set -euo pipefail
          mkdir -p evidence
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
          printf '%s\n' '${{ needs.integrate.outputs.source }}' > evidence/source.txt
          node scripts/check-design-baseline.mjs | tee evidence/design.log
          npm run typecheck 2>&1 | tee evidence/typecheck.log
          npm run lint 2>&1 | tee evidence/lint.log
          npm test 2>&1 | tee evidence/tests.log
          node --test scripts/test/ios-journey/*.test.cjs 2>&1 | tee evidence/ios-journey.log
          npm --prefix server run build:check 2>&1 | tee evidence/relay-dry-run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-unified-source-validation
          path: evidence/
          retention-days: 7
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Full real-browser navigation and UI checks
        run: |
          set -o pipefail
          mkdir -p evidence
          GITHUB_SHA='${{ needs.integrate.outputs.source }}' npm run test:e2e 2>&1 | tee evidence/browser.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-unified-browser-validation
          path: |
            evidence/
            artifacts/
          retention-days: 7
  native:
    needs: integrate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - name: Select stable Apple toolchain
        run: |
          set -euo pipefail
          BEST=$(ls -d /Applications/Xcode*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$BEST/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: |
          npm ci --no-audit --no-fund
          npx --no-install expo prebuild --platform ios --no-install
          npx pod-install
      - name: Native protected storage, capture receipts and compiled App Intents
        run: |
          set -euo pipefail
          mkdir -p evidence
          swiftc -warnings-as-errors -parse-as-library modules/wafra-message-history/ios/WafraMessageHistoryStore.swift scripts/test/native-history-protection-probe.swift -o "$RUNNER_TEMP/protection-probe"
          "$RUNNER_TEMP/protection-probe" 2>&1 | tee evidence/protection.log
          bash scripts/test/native-live-capture-receipts.sh 2>&1 | tee evidence/capture-receipts.log
          bash scripts/test/native-history-store.sh 2>&1 | tee evidence/history-native.log
          bash scripts/test/native-live-capture-store.sh 2>&1 | tee evidence/live-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-unified-native-validation
          path: evidence/
          retention-days: 7
  # Candidate compilation runs in parallel. Nothing is published or approved
  # unless every independent gate and both signed builds succeed below.
  android:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.integrate.outputs.source }}
      BRANCH: release/claude-unified-20260907
    steps:
      - name: Build and inspect an isolated signed Android candidate
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)" = "$SOURCE_SHA"
          gh workflow run build-apk.yml --ref "$BRANCH" -f architecture=arm64 -f corpus=false -f bundle=false
          RUN=''
          for i in $(seq 1 30); do
            RUN=$(gh api "repos/$GH_REPO/actions/workflows/build-apk.yml/runs?head_sha=$SOURCE_SHA&event=workflow_dispatch" --jq '.workflow_runs[0].id // empty')
            [ -n "$RUN" ] && break
            sleep 2
          done
          test -n "$RUN"
          gh run watch "$RUN" --exit-status --interval 30
          mkdir -p evidence
          gh run download "$RUN" -n wafra-apk -D evidence
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs evidence/wafra.apk | tee evidence/signature.txt
          grep -q '782b21c38c20f60425b171255718df54629c2909f3273c53e81d31fdbe3b446b' evidence/signature.txt
          "$TOOLS/aapt" dump badging evidence/wafra.apk > evidence/badging.txt
          grep -q "package: name='app.wafra.android'" evidence/badging.txt
          sha256sum evidence/wafra.apk > evidence/sha256.txt
          printf 'source=%s\nrun=%s\nrelease_approved=false\n' "$SOURCE_SHA" "$RUN" > evidence/source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafra-unified-android-candidate
          path: evidence/
          retention-days: 14
          compression-level: 0
  ios:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ needs.integrate.outputs.source }}
      BRANCH: release/claude-unified-20260907
    steps:
      - name: Build an isolated store-signed iOS beta without submission
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/git/ref/heads/$BRANCH" --jq .object.sha)" = "$SOURCE_SHA"
          gh workflow run ios-testflight.yml --ref "$BRANCH" -f profile=history-beta -f submit=false -f wait=true
          RUN=''
          for i in $(seq 1 30); do
            RUN=$(gh api "repos/$GH_REPO/actions/workflows/ios-testflight.yml/runs?head_sha=$SOURCE_SHA&event=workflow_dispatch" --jq '.workflow_runs[0].id // empty')
            [ -n "$RUN" ] && break
            sleep 2
          done
          test -n "$RUN"
          gh run watch "$RUN" --exit-status --interval 30
          mkdir -p evidence
          gh run download "$RUN" -n wafra-ios-build-report -D evidence
          printf 'source=%s\nrun=%s\nsubmitted=false\nrelease_approved=false\n' "$SOURCE_SHA" "$RUN" > evidence/source.txt
          cat evidence/build.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafra-unified-ios-candidate
          path: evidence/
          retention-days: 14
  verified:
    needs: [integrate, source, browser, native, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record complete validation without publishing
        env:
          SOURCE_SHA: ${{ needs.integrate.outputs.source }}
        run: |
          echo "All source, browser, native and signed-candidate gates passed for $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "No store submission, public download update, OTA, phone installation or main merge was performed by this workflow." >> "$GITHUB_STEP_SUMMARY"

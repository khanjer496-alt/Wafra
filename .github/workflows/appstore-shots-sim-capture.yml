name: App Store screenshot simulator capture (capture-only)

# Capture-only. Installs the Release simulator .app of build 195 source made by
# appstore-shots-sim-build.yml (run 45806130728), restores a synthetic USD
# sample backup through the app's own "Restore from a backup" flow, and takes
# raw 1206x2622 screenshots on an iPhone 16 Pro simulator with Maestro.
# Nothing is signed, submitted or uploaded to App Store Connect.
on:
  push:
    branches: [capture/appstore-sim-build-195]
    paths:
      - '.github/workflows/appstore-shots-sim-capture.yml'
      - '.maestro/appstore-195/**'

permissions:
  contents: read
  actions: read

env:
  BUILD_RUN_ID: '45806130728'

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wafra-195-sim-release
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
          path: build

      - name: Unpack and verify the Release simulator app
        run: |
          echo "3c52e25fa8dde4d40bced72d1981667678d20a4c2071ce8601e7074546fe4765  build/Wafra-sim-Release.app.zip" | shasum -a 256 -c
          ditto -x -k build/Wafra-sim-Release.app.zip app
          shasum -a 256 app/Wafra.app/main.jsbundle

      - name: Select stable Xcode
        run: |
          BEST=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$BEST/Contents/Developer"
          xcodebuild -version

      - name: Boot iPhone 16 Pro and stage the sample backup
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[]|select(.platform=="iOS" and .isAvailable)]|sort_by(.version)|last|.identifier')
          UDID=$(xcrun simctl create appstore-shots "iPhone 16 Pro" "$RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale en_US
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array en-US
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          FILES=$(xcrun simctl get_app_container "$UDID" com.apple.DocumentsApp groups | awk -F'\t' '/FileProvider.LocalStorage/{print $2}')
          mkdir -p "$FILES/File Provider Storage"
          cp .maestro/appstore-195/wafra-sample-backup-usd.json "$FILES/File Provider Storage/"
          xcrun simctl install "$UDID" app/Wafra.app
          xcrun simctl list devices | grep "$UDID"

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Capture
        run: |
          set -uo pipefail
          U='${{ steps.sim.outputs.udid }}'
          mkdir -p shots
          maestro --device "$U" test --test-output-dir shots/1 .maestro/appstore-195/1-light.yaml || echo "::warning::light pass 1 failed"
          xcrun simctl ui "$U" appearance dark; sleep 3
          maestro --device "$U" test --test-output-dir shots/2 .maestro/appstore-195/2-dark.yaml || echo "::warning::dark pass failed"
          xcrun simctl ui "$U" appearance light; sleep 3
          maestro --device "$U" test --test-output-dir shots/3 .maestro/appstore-195/3-light.yaml || echo "::warning::light pass 2 failed"
          xcrun simctl io "$U" screenshot shots/99-final.png || true
          mkdir -p raw
          find shots -path '*takeScreenshot*' -name '*.png' -exec cp -f {} raw/ \;
          {
            echo "runtime=${{ steps.sim.outputs.runtime }}"
            echo "device=iPhone 16 Pro (simulator)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "runnerImage=$ImageOS $ImageVersion"
            echo "maestro=$(maestro --version 2>/dev/null | tail -1)"
            echo "runId=$GITHUB_RUN_ID"
          } | tee raw/capture-environment.txt
          shasum -a 256 raw/*.png | tee raw/SHA256SUMS
          ls raw | grep -c '^0[1-8]-' | xargs -I{} echo "captured {} of 8 frames"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafra-195-appstore-raw
          path: |
            raw/
            shots/
          retention-days: 14

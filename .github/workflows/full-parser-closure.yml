name: Full parser closure evidence
on:
  push:
    branches: ['patch/full-closure-**']
permissions:
  contents: read
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Generate and compile exact source
        run: |
          mkdir -p out
          node scripts/generate-ios-background-parser.cjs > out/generate.txt 2>&1
          bash scripts/test/build.sh > out/compile.txt 2>&1
      - name: Full repair suite
        if: ${{ !cancelled() }}
        run: node --test --test-concurrency=2 --test-reporter=spec scripts/test/repair/*.test.cjs > out/repair.txt 2>&1
      - name: Application parser suites
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for file in scripts/test/*.test.js; do
            name="${file##*/}"
            node "$file" > "out/$name.txt" 2>&1 || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-closure-${{ github.sha }}
          path: out/
          retention-days: 7

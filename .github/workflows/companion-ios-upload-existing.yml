name: Temporary Companion upload existing signed IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  upload-public-beta:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      COMPANION_APP_ID: '6814258840'
      WAFRA_APP_ID: '6799171482'
      SOURCE_RUN_ID: '35532632660'
      ARTIFACT_NAME: 'companion-ios-signed-14-35532632660'
      EXPECTED_SOURCE_SHA: '74f1804c59f9198206ce34421c570aab7628f009'
      EXPECTED_BUILD: '14'
      EXPECTED_VERSION: '1.1.0'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3

      - name: Download exact signed Companion IPA from successful build run
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/companion-signed"
          mkdir -p "$OUT"
          gh run download "$SOURCE_RUN_ID" --repo khanjer496-alt/Wafra --name "$ARTIFACT_NAME" --dir "$OUT"
          find "$OUT" -maxdepth 2 -type f -print
          IPA=$(find "$OUT" -type f -name 'Companion-*.ipa' -print -quit)
          VERIFY=$(find "$OUT" -type f -name verification.json -print -quit)
          test -n "$IPA" && test -n "$VERIFY"
          node - <<'NODE'
          const fs=require('fs'); const path=require('path');
          const root=process.env.RUNNER_TEMP+'/companion-signed';
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
          const f=walk(root).find(x=>x.endsWith('verification.json')); const j=JSON.parse(fs.readFileSync(f));
          if(j.sourceCommit!==process.env.EXPECTED_SOURCE_SHA||String(j.buildNumber)!==process.env.EXPECTED_BUILD||j.version!==process.env.EXPECTED_VERSION||j.bundleIdentifier!=='app.companion.productivity'||j.storeSigningVerified!==true) throw new Error('signed IPA evidence mismatch');
          console.log(JSON.stringify(j,null,2));
          NODE
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key for altool and API
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_ASC_API_KEY_P8" && test -n "$EXPO_ASC_KEY_ID" && test -n "$EXPO_ASC_ISSUER_ID"
          DIR="$HOME/.appstoreconnect/private_keys"; mkdir -p "$DIR"; chmod 700 "$DIR"
          KEY="$DIR/AuthKey_${EXPO_ASC_KEY_ID}.p8"
          if printf '%s' "$EXPO_ASC_API_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$EXPO_ASC_API_KEY_P8" > "$KEY"; else printf '%s' "$EXPO_ASC_API_KEY_P8" | tr -d '[:space:]' | base64 -d > "$KEY"; fi
          chmod 600 "$KEY"; grep -q 'BEGIN PRIVATE KEY' "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Upload verified build 14 to Companion App Store Connect app
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$EXPO_ASC_KEY_ID" --apiIssuer "$EXPO_ASC_ISSUER_ID"

      - name: Configure Companion TestFlight and submit external beta review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/companion-public"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createPrivateKey, sign } from 'node:crypto';
          const APP=process.env.COMPANION_APP_ID, SOURCE_APP=process.env.WAFRA_APP_ID;
          const VERSION=process.env.EXPECTED_VERSION, NUMBER=process.env.EXPECTED_BUILD;
          const raw=process.env.EXPO_ASC_API_KEY_P8||'', kid=process.env.EXPO_ASC_KEY_ID||'', iss=process.env.EXPO_ASC_ISSUER_ID||'';
          const pem=raw.includes('BEGIN PRIVATE KEY')?raw:Buffer.from(raw.replace(/\s/g,''),'base64').toString('utf8');
          const key=createPrivateKey(pem), b64=v=>Buffer.from(JSON.stringify(v)).toString('base64url');
          const jwt=()=>{const now=Math.floor(Date.now()/1000); const u=`${b64({alg:'ES256',kid,typ:'JWT'})}.${b64({iss,iat:now,exp:now+600,aud:'appstoreconnect-v1'})}`; return `${u}.${sign('sha256',Buffer.from(u),{key,dsaEncoding:'ieee-p1363'}).toString('base64url')}`};
          async function api(path,{method='GET',body,allow=[]}={}){const r=await fetch(`https://api.appstoreconnect.apple.com/v1/${path}`,{method,headers:{Authorization:`Bearer ${jwt()}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});const t=await r.text();if(!r.ok&&!allow.includes(r.status)){const e=new Error(`${method} ${path.split('?')[0]}: ${r.status}`);e.body=t;throw e;}return t?JSON.parse(t):null;}
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));

          // Copy the proven beta-review contact details from Wafra without logging them.
          let sourceReview=null;
          try { sourceReview=(await api(`apps/${SOURCE_APP}/betaAppReviewDetail`)).data; } catch {}
          let targetReview=null;
          try { targetReview=(await api(`apps/${APP}/betaAppReviewDetail`)).data; } catch {}
          if(sourceReview){
            const a=sourceReview.attributes||{};
            const attrs={};
            for(const k of ['contactFirstName','contactLastName','contactPhone','contactEmail','demoAccountName','demoAccountPassword','demoAccountRequired','notes']) if(a[k]!==undefined&&a[k]!==null) attrs[k]=a[k];
            attrs.demoAccountRequired=false;
            if(targetReview) await api(`betaAppReviewDetails/${targetReview.id}`,{method:'PATCH',body:{data:{type:'betaAppReviewDetails',id:targetReview.id,attributes:attrs}}});
            else await api('betaAppReviewDetails',{method:'POST',body:{data:{type:'betaAppReviewDetails',attributes:attrs,relationships:{app:{data:{type:'apps',id:APP}}}}}});
          }

          // Ensure English beta-app information exists.
          let appLocs=[];
          try { appLocs=(await api(`apps/${APP}/betaAppLocalizations?limit=100`)).data||[]; } catch {}
          const en=appLocs.find(x=>x.attributes.locale==='en-US');
          const betaAttrs={description:'Companion is a productivity app with tasks, focus sessions, and an interactive pet companion.',feedbackEmail:'khanjer496@gmail.com'};
          if(en) await api(`betaAppLocalizations/${en.id}`,{method:'PATCH',body:{data:{type:'betaAppLocalizations',id:en.id,attributes:betaAttrs}}});
          else await api('betaAppLocalizations',{method:'POST',body:{data:{type:'betaAppLocalizations',attributes:{locale:'en-US',...betaAttrs},relationships:{app:{data:{type:'apps',id:APP}}}}}});

          let found=null;
          for(let i=0;i<121;i++){
            const r=await api(`builds?filter[app]=${APP}&filter[version]=${encodeURIComponent(NUMBER)}&include=preReleaseVersion,buildBetaDetail&limit=100`);
            const inc=new Map((r.included||[]).map(x=>[`${x.type}:${x.id}`,x]));
            const matches=(r.data||[]).filter(x=>{const ref=x.relationships?.preReleaseVersion?.data;return ref&&inc.get(`${ref.type}:${ref.id}`)?.attributes.version===VERSION});
            if(matches.length>1) throw new Error('ambiguous Companion build');
            if(matches.length){const b=matches[0],ref=b.relationships?.buildBetaDetail?.data;found={build:b,detail:ref?inc.get(`${ref.type}:${ref.id}`):null};console.log(JSON.stringify({attempt:i,processing:b.attributes.processingState,external:found.detail?.attributes?.externalBuildState||null}));if(b.attributes.processingState==='VALID')break;if(['INVALID','FAILED'].includes(b.attributes.processingState))throw new Error('Apple processing failed');}
            await sleep(15000);
          }
          if(!found||found.build.attributes.processingState!=='VALID') throw new Error('build did not become VALID');
          const id=found.build.id;
          if(found.build.attributes.usesNonExemptEncryption===null) await api(`builds/${id}`,{method:'PATCH',body:{data:{type:'builds',id,attributes:{usesNonExemptEncryption:false}}}});

          const notes='Please test onboarding, task creation/completion, focus sessions, Home interactions, pet reactions and audio, notifications, responsiveness, backup/restore, and report any crashes or visual regressions.';
          const locs=(await api(`builds/${id}/betaBuildLocalizations?limit=100`)).data||[]; const buildEn=locs.find(x=>x.attributes.locale==='en-US');
          if(buildEn) await api(`betaBuildLocalizations/${buildEn.id}`,{method:'PATCH',body:{data:{type:'betaBuildLocalizations',id:buildEn.id,attributes:{whatsNew:notes}}}});
          else await api('betaBuildLocalizations',{method:'POST',body:{data:{type:'betaBuildLocalizations',attributes:{locale:'en-US',whatsNew:notes},relationships:{build:{data:{type:'builds',id}}}}}});

          let groups=(await api(`apps/${APP}/betaGroups?limit=100`)).data||[];
          let group=groups.find(x=>!x.attributes.isInternalGroup&&x.attributes.publicLinkEnabled)||groups.find(x=>!x.attributes.isInternalGroup&&x.attributes.name==='Companion Public Beta')||groups.find(x=>!x.attributes.isInternalGroup);
          if(!group) group=(await api('betaGroups',{method:'POST',body:{data:{type:'betaGroups',attributes:{name:'Companion Public Beta',isInternalGroup:false},relationships:{app:{data:{type:'apps',id:APP}}}}}})).data;
          if(!group.attributes.publicLinkEnabled) group=(await api(`betaGroups/${group.id}`,{method:'PATCH',body:{data:{type:'betaGroups',id:group.id,attributes:{publicLinkEnabled:true}}}})).data;
          const members=(await api(`betaGroups/${group.id}/relationships/builds?limit=200`)).data||[];
          if(!members.some(x=>x.id===id)) await api(`betaGroups/${group.id}/relationships/builds`,{method:'POST',body:{data:[{type:'builds',id}]}});

          let current=await api(`builds/${id}?include=buildBetaDetail`); let detail=(current.included||[]).find(x=>x.type==='buildBetaDetails')||null;
          if(detail&&!detail.attributes.autoNotifyEnabled) await api(`buildBetaDetails/${detail.id}`,{method:'PATCH',body:{data:{type:'buildBetaDetails',id:detail.id,attributes:{autoNotifyEnabled:true}}}});
          let action='none', external=detail?.attributes?.externalBuildState||null;
          if(external==='READY_FOR_BETA_SUBMISSION'){
            try { await api('betaAppReviewSubmissions',{method:'POST',body:{data:{type:'betaAppReviewSubmissions',relationships:{build:{data:{type:'builds',id}}}}}}); action='submitted-for-beta-review'; }
            catch(e){ action=`beta-review-blocked:${e.message}`; fs.writeFileSync(`${process.env.RUNNER_TEMP}/companion-public/review-error.txt`,String(e.body||e.message)); }
          } else if(external==='READY_FOR_BETA_TESTING'){
            try { await api('buildBetaNotifications',{method:'POST',body:{data:{type:'buildBetaNotifications',relationships:{build:{data:{type:'builds',id}}}}}}); action='notified-testers'; } catch {}
          }
          group=(await api(`betaGroups/${group.id}`)).data; current=await api(`builds/${id}?include=buildBetaDetail`); detail=(current.included||[]).find(x=>x.type==='buildBetaDetails')||null;
          const report={appId:APP,version:VERSION,buildNumber:NUMBER,buildId:id,processingState:current.data.attributes.processingState,externalBuildState:detail?.attributes?.externalBuildState||null,groupId:group.id,groupName:group.attributes.name,publicLinkEnabled:group.attributes.publicLinkEnabled,publicLink:group.attributes.publicLink||null,action};
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/companion-public/result.json`,JSON.stringify(report,null,2)+'\n'); console.log(JSON.stringify(report,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-upload-public-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/companion-public/result.json
            ${{ runner.temp }}/companion-public/review-error.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary API key
        if: always()
        shell: bash
        run: rm -rf "$HOME/.appstoreconnect/private_keys"

name: Integrate latest onboarding localization once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/integrate-onboarding-localization-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  integrate-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply the still-missing PR 50 localization changes
        run: |
          python3 <<'PY'
          from pathlib import Path

          alerts = Path('src/lib/onboarding-alert-examples.ts')
          src = alerts.read_text()
          old = """const UTILITIES: Readonly<Record<string, OnboardingMerchantExample>> = {\n  AE: M('DEWA', 'bolt', 'dewa.gov.ae'),\n  SA: M('Saudi Electricity', 'bolt', 'se.com.sa'),\n  GB: M('Octopus Energy', 'bolt', 'octopus.energy'),\n  US: M('Con Edison', 'bolt', 'coned.com'),\n  QA: M('Kahramaa', 'bolt', 'km.qa'),\n};"""
          new = """/**\n * A recognisable local biller for every onboarding preview region.\n *\n * The domain is deliberately the provider's own site: the welcome poster can\n * render the real mark through the same reviewed Brandfetch-domain path as bank\n * logos. Keeping this table complete prevents a global user from seeing local\n * banks next to a generic \"Electricity\" example that still feels UAE-centric.\n */\nconst UTILITIES: Readonly<Record<string, OnboardingMerchantExample>> = {\n  AE: M('DEWA', 'bolt', 'dewa.gov.ae'),\n  SA: M('Saudi Electricity', 'bolt', 'se.com.sa'),\n  US: M('Con Edison', 'bolt', 'coned.com'),\n  GB: M('Octopus Energy', 'bolt', 'octopus.energy'),\n  FR: M('EDF', 'bolt', 'edf.fr'),\n  DE: M('E.ON', 'bolt', 'eon.de'),\n  ES: M('Iberdrola', 'bolt', 'iberdrola.es'),\n  IT: M('Enel Energia', 'bolt', 'enel.it'),\n  NL: M('Eneco', 'bolt', 'eneco.nl'),\n  IN: M('Tata Power', 'bolt', 'tatapower.com'),\n  QA: M('Kahramaa', 'bolt', 'km.qa'),\n  KW: M('MEW Kuwait', 'bolt', 'mew.gov.kw'),\n  BH: M('EWA Bahrain', 'bolt', 'ewa.bh'),\n  OM: M('Nama Supply', 'bolt', 'supply.nama.om'),\n  EG: M('Egyptian Electricity', 'bolt', 'eehc.gov.eg'),\n  JO: M('JEPCO', 'bolt', 'jepco.com.jo'),\n};"""
          if old not in src:
              if new not in src: raise SystemExit('utility table did not match current main')
          else:
              src = src.replace(old, new, 1)
          alerts.write_text(src)

          test_path = Path('scripts/test/bank-logo-resolver.test.js')
          test = test_path.read_text()
          old_return = "return { ...requireModule('@/lib/bank-logo-resolver'), marketBanks: requireModule('@/lib/markets').MARKETS.flatMap(market => market.banks) };"
          new_return = """return {\n    ...requireModule('@/lib/bank-logo-resolver'),\n    marketBanks: requireModule('@/lib/markets').MARKETS.flatMap(market => market.banks),\n    onboardingBanks: requireModule('@/lib/onboarding-bank-examples'),\n    onboardingAlerts: requireModule('@/lib/onboarding-alert-examples'),\n    verifiedLogoUrl: requireModule('@/lib/verified-logo-identities').verifiedLogoUrl,\n  };"""
          if old_return in test:
              test = test.replace(old_return, new_return, 1)
          elif 'onboardingBanks: requireModule' not in test:
              raise SystemExit('bank resolver load return did not match')

          anchor = "  assert.equal(calls.length, 0, 'known launch-market banks stay on the local fast path');\n\n"
          coverage = """  // The animated onboarding must never regress to UAE examples for global\n  // users. Every country Wafra currently carries as a first-class preview gets\n  // three real bank domains plus local grocery and utility artwork.\n  const onboardingRegions = ['AE', 'SA', 'US', 'GB', 'FR', 'DE', 'ES', 'IT', 'NL', 'IN', 'QA', 'KW', 'BH', 'OM', 'EG', 'JO'];\n  for (const regionId of onboardingRegions) {\n    const region = m.onboardingBanks.onboardingBankRegion(null, regionId);\n    assert.ok(region, `onboarding preview exists for ${regionId}`);\n    assert.equal(region.id, regionId);\n    assert.ok(region.currency, `onboarding currency exists for ${regionId}`);\n    assert.equal(region.banks.length, 3, `onboarding carries exactly three bank examples for ${regionId}`);\n    assert.equal(new Set(region.banks.map(bank => bank.domain)).size, 3, `onboarding bank domains stay distinct for ${regionId}`);\n    for (const bank of region.banks) {\n      assert.match(bank.domain, /^(?:[a-z0-9](?:[a-z0-9-]{0,62})\\.)+[a-z]{2,24}$/i, `valid bank domain for ${bank.name}`);\n      assert.ok(m.verifiedLogoUrl(bank.domain)?.startsWith('https://cdn.brandfetch.io/domain/'),\n        `bank logo has a verified Brandfetch path for ${bank.name}`);\n    }\n\n    const alerts = m.onboardingAlerts.onboardingAlertExamples(region, {\n      grocery: 'Grocery store', electricity: 'Electricity', salary: 'Salary',\n    });\n    assert.equal(alerts.length, 3);\n    assert.ok(alerts[0].merchant.domain, `local grocery artwork exists for ${regionId}`);\n    assert.ok(alerts[1].merchant.domain, `local utility artwork exists for ${regionId}`);\n    assert.ok(m.verifiedLogoUrl(alerts[0].merchant.domain), `grocery logo domain is safe for ${regionId}`);\n    assert.ok(m.verifiedLogoUrl(alerts[1].merchant.domain), `utility logo domain is safe for ${regionId}`);\n    assert.ok(alerts.every(alert => alert.amount.includes(region.currency)), `sample money uses ${region.currency}`);\n  }\n  assert.equal(m.onboardingBanks.onboardingBankRegion(null, 'ZZ'), null,\n    'an unsupported country stays neutral instead of borrowing another country’s banks');\n\n"""
          if 'const onboardingRegions =' not in test:
              if anchor not in test: raise SystemExit('bank resolver coverage anchor missing')
              test = test.replace(anchor, anchor + coverage, 1)
          test = test.replace(
              "console.log('✓ bank logos keep known local domains and search Brandfetch globally for other clean institution names');",
              "console.log('✓ bank logos keep known local domains and onboarding stays country-localized');",
          )
          test_path.write_text(test)
          PY

      - name: Remove this temporary workflow
        run: rm -f .github/workflows/integrate-onboarding-localization-once.yml

      - name: Smoke-test the localization before commit
        run: |
          npm ci --ignore-scripts
          node scripts/test/bank-logo-resolver.test.js
          node scripts/test/ios-shortcuts-config.test.js

      - name: Commit the complete latest app state
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/onboarding-alert-examples.ts scripts/test/bank-logo-resolver.test.js .github/workflows
          git commit -m 'feat(onboarding): complete country-localized preview visuals'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cancel superseded Baseline-200 iOS build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/35247511828/cancel" || true

      - name: Dispatch final latest iOS beta to TestFlight
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run ios-testflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f build_host=github-macos \
            -f source_commit="$SOURCE_COMMIT" \
            -f profile=history-beta \
            -f submit=true \
            -f wait=false

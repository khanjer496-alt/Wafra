name: One-shot release dispatch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android APK from this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f bundle=false \
            -f corpus=false \
            -f founder_unlock=false \
            -f architecture=arm64 \
            -f capture_trace=false

      - name: Dispatch signed iOS production build and TestFlight submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ios-testflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f build_host=github-macos \
            -f source_commit="$GITHUB_SHA" \
            -f profile=production \
            -f submit=true \
            -f wait=false

name: One-time onboarding contract migration

# Added only to migrate the stale first-run ownership assertion, then removed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-onboarding-contract.yml'

permissions:
  contents: write

jobs:
  patch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update first-run ownership contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/test/contracts.test.js')
          text = path.read_text()
          start_marker = "  ok('first-run value onboarding is a Superwall flow with a native recovery fallback',"
          end_marker = "      /onboardingFlowStatus === 'dismissed'/.test(remoteOnboarding));"
          start = text.find(start_marker)
          end_start = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end_start < 0:
              raise SystemExit('Expected stale Superwall onboarding contract markers were not found')
          end = end_start + len(end_marker)
          replacement = """  ok('native Wafra onboarding owns first run while Superwall stays mounted for billing',
            /SuperwallOnboarding/.test(layout) &&
              /<OnboardingGate>\\{children\\}<\\/OnboardingGate>/.test(remoteOnboarding) &&
              !/presentOnboardingFlow/.test(remoteOnboarding));"""
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit contract migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test/contracts.test.js
          git diff --cached --check
          git commit -m 'test(onboarding): lock native first-run ownership'
          git push origin HEAD:main

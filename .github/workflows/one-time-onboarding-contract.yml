name: One-time onboarding contract migration

# Added only to migrate the stale first-run ownership assertion, then removed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-onboarding-contract.yml'

permissions:
  contents: write

jobs:
  patch-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update first-run ownership contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/test/contracts.test.js')
          text = path.read_text()
          old = """  ok('first-run value onboarding is a Superwall flow with a native recovery fallback',
            /SuperwallOnboarding/.test(layout) &&
              /presentOnboardingFlow/.test(remoteOnboarding) &&
              /<OnboardingGate>\\{children\\}<\\/OnboardingGate>/.test(remoteOnboarding) &&
              /onboardingFlowStatus === 'error'/.test(remoteOnboarding) &&
              /onboardingFlowStatus === 'skipped'/.test(remoteOnboarding) &&
              /onboardingFlowStatus === 'dismissed'/.test(remoteOnboarding));
          """
          new = """  ok('native Wafra onboarding owns first run while Superwall stays mounted for billing',
            /SuperwallOnboarding/.test(layout) &&
              /<OnboardingGate>\\{children\\}<\\/OnboardingGate>/.test(remoteOnboarding) &&
              !/presentOnboardingFlow/.test(remoteOnboarding));
          """
          if old not in text:
              raise SystemExit('Expected stale Superwall onboarding contract block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit contract migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test/contracts.test.js
          git diff --cached --check
          git commit -m 'test(onboarding): lock native first-run ownership'
          git push origin HEAD:main

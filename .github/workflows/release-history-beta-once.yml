name: One-shot iOS history beta dispatch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-history-beta-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch latest verified iOS history beta to TestFlight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ios-testflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f build_host=github-macos \
            -f source_commit=f7b3ef15260269e47b7b7b6197e2d085f20231de \
            -f profile=history-beta \
            -f submit=true \
            -f wait=false

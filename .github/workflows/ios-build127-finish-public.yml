name: Finish Wafra iOS build 127 public TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build127-finish-public.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WAFRA_BETA_VERSION: '1.0.0'
      WAFRA_BETA_BUILD_NUMBER: '127'
      WAFRA_BETA_SOURCE_SHA: 9979ef1a1b52711e2c150e2ce9f16de412669c8d
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply export-compliance declaration to build 127
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, sign } from 'node:crypto';
          const buildId='6e22a60a-526f-4b34-99cf-dd33fa3b3de9';
          const raw=process.env.EXPO_ASC_API_KEY_P8||'';
          const pem=raw.includes('BEGIN PRIVATE KEY')?raw:Buffer.from(raw.replace(/\s/g,''),'base64').toString('utf8');
          const key=createPrivateKey(pem), kid=process.env.EXPO_ASC_KEY_ID, iss=process.env.EXPO_ASC_ISSUER_ID;
          const b64=d=>Buffer.from(JSON.stringify(d)).toString('base64url');
          const token=()=>{const now=Math.floor(Date.now()/1000),signed=`${b64({alg:'ES256',kid,typ:'JWT'})}.${b64({iss,iat:now,exp:now+600,aud:'appstoreconnect-v1'})}`;return `${signed}.${sign('sha256',Buffer.from(signed),{key,dsaEncoding:'ieee-p1363'}).toString('base64url')}`};
          async function api(path,{method='GET',body}={}){const r=await fetch(`https://api.appstoreconnect.apple.com/v1/${path}`,{method,headers:{Authorization:`Bearer ${token()}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const text=await r.text();if(!r.ok)throw new Error(`${method} ${path}: ${r.status} ${text}`);return text?JSON.parse(text):null;}
          const before=await api(`builds/${buildId}`);
          if(before.data?.attributes?.version!=='127') throw new Error(`Refusing unexpected Apple build ${before.data?.attributes?.version}`);
          if(before.data.attributes.usesNonExemptEncryption === null) {
            await api(`builds/${buildId}`,{method:'PATCH',body:{data:{type:'builds',id:buildId,attributes:{usesNonExemptEncryption:false}}}});
          } else if(before.data.attributes.usesNonExemptEncryption !== false) {
            throw new Error('Build already has a conflicting export-compliance declaration');
          }
          const after=await api(`builds/${buildId}?include=buildBetaDetail`);
          console.log(JSON.stringify({build:after.data.attributes.version,usesNonExemptEncryption:after.data.attributes.usesNonExemptEncryption,processingState:after.data.attributes.processingState},null,2));
          if(after.data.attributes.usesNonExemptEncryption !== false) throw new Error('Export-compliance declaration was not accepted');
          NODE

      - name: Publish build 127 to existing public TestFlight group
        run: node scripts/release/ios-public-beta-publish.mjs --publish

      - name: Commit publication evidence for diagnosis
        if: always()
        run: |
          if [ -f ios-release-evidence/public-beta.json ]; then
            mkdir -p docs/release-evidence
            cp ios-release-evidence/public-beta.json docs/release-evidence/ios-build127-public.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/release-evidence/ios-build127-public.json
            git commit -m 'chore: record iOS build 127 public beta evidence' || true
            git push origin HEAD:main
          fi

      - name: Preserve publication evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build127-final-public-${{ github.run_id }}
          path: ios-release-evidence/public-beta.json
          if-no-files-found: ignore
          retention-days: 14

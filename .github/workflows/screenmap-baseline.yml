name: screenmap · launch baseline

on:
  workflow_dispatch:

concurrency:
  group: screenmap-baseline-main
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  baseline:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Build local iOS simulator app
        env:
          EXPO_PUBLIC_WAFRA_SCREENMAP_DEMO: '1'
          EXPO_PUBLIC_WAFRA_FOUNDER_UNLOCK: '1'
        run: |
          npm ci
          npx expo prebuild --platform ios --no-install
          npx pod-install
          xcodebuild \
            -workspace ios/Wafra.xcworkspace \
            -scheme Wafra \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/wafra-screenmap-derived" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build
      - uses: aleqsio/screenmap@v1
        with:
          mode: baseline
          app_path: ${{ runner.temp }}/wafra-screenmap-derived/Build/Products/Release-iphonesimulator/Wafra.app
          simulator: iPhone 17 Pro
          agent_provider: codex
          # Wafra is reviewed privately: keep screenshots in the workflow
          # artifact and open the .scrmap locally in app.screenmap.dev.
          publish: 'false'
          flows_pr: 'false'

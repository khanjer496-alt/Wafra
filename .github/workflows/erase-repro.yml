# TEMPORARY, NEVER MERGED. Reproduces "Erase all data" on the iOS simulator for two release commits and uploads
# ONLY the JS-exception / crash lines. Push trigger limited to this one branch.
name: erase-repro
on:
  push:
    branches: [test/erase-repro-hosted]

permissions:
  contents: read

concurrency:
  group: erase-repro
  cancel-in-progress: true

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: diag-6c4e78f7
            sha: 6c4e78f7ea2a750142c2f5d51c086c3020e678b7
    name: erase on ${{ matrix.label }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
      EXPO_PUBLIC_WAFRA_FOUNDER_UNLOCK: "0"
      EXPO_PUBLIC_WAFRA_AUTO_FOUNDER_PRO: "0"
      EXPO_PUBLIC_WAFRA_PARSER_RESEARCH: "0"
      EXPO_PUBLIC_WAFRA_SMS_CORPUS_EXPORT: "0"
      WAFRA_SMS_CORPUS_EXPORT: "0"
      EXPO_PUBLIC_WAFRA_RELAY_URL: ${{ vars.WAFRA_RELAY_URL || 'https://wafra-relay.khanjer496.workers.dev' }}
    steps:
      - name: Harness (this branch)
        uses: actions/checkout@v4
        with:
          path: harness

      - name: App source at the commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: app

      - name: Select Xcode 26.2 or newer
        run: |
          set -euo pipefail
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$BEST/Contents/Developer"
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "::notice::runner image ${ImageOS:-?} ${ImageVersion:-?}; Xcode installs: $(ls -d /Applications/Xcode*.app | tr '\n' ' '); selected $VER"
          [ "${VER%%.*}" -ge 26 ] || { echo "::error::need Xcode 26+; this runner (image ${ImageVersion:-?}) offers $VER; installs: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"; exit 1; }

      - name: Restore cached Release simulator build
        id: appcache
        uses: actions/cache/restore@v4
        with:
          path: app/build/app
          key: erase-repro-app-v1-${{ matrix.sha }}

      - uses: actions/setup-node@v4
        if: steps.appcache.outputs.cache-hit != 'true'
        with:
          node-version-file: app/.nvmrc

      - name: Build the Release app for the simulator
        if: steps.appcache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        working-directory: app
        run: |
          set -euo pipefail
          KEY=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPERWALL_IOS_API_KEY' eas.json)
          case "$KEY" in pk_*) ;; *) echo "::error::no production Superwall iOS key in eas.json"; exit 1;; esac
          export EXPO_PUBLIC_SUPERWALL_IOS_API_KEY="$KEY"
          npm ci
          npx expo prebuild --platform ios --no-install
          npx pod-install ios
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set +e
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd -quiet build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            mkdir -p ../shots
            grep -E 'error:' "$RUNNER_TEMP/xcodebuild.log" | cut -c1-400 | head -60 > ../shots/build-errors.txt || true
            exit "$RC"
          fi
          APP=$(find build/dd/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || { echo "no .app produced"; exit 1; }
          mkdir -p build/app && rm -rf build/app/* && cp -R "$APP" build/app/
          test -f build/app/*.app/main.jsbundle && ls -l build/app/*.app/main.jsbundle

      - name: Upload compiler error lines (build failures only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erase-repro-build-errors-${{ matrix.label }}
          path: shots/build-errors.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Save the build to cache
        if: steps.appcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/build/app
          key: erase-repro-app-v1-${{ matrix.sha }}

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl create erase-repro "iPhone 16 Pro Max" 2>/dev/null || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available -j | jq -r '.devices[][] | select(.name|startswith("iPhone")) | .udid' | tail -1)
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" sw_vers || true
          xcrun simctl ui "$UDID" appearance light || true

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Reproduce Erase all data
        id: repro
        continue-on-error: true
        timeout-minutes: 50
        run: |
          mkdir -p shots
          echo "commit under test: ${{ matrix.sha }}  (${{ matrix.label }})" > shots/commit.txt
          harness/.github/erase-repro/run.sh '${{ steps.sim.outputs.udid }}' shots "$PWD/app/build/app" "$PWD/harness" 2>&1 | tee shots/run.log | tail -80

      - name: Summary
        if: always()
        run: |
          { echo "## Erase all data on ${{ matrix.label }}"; echo '```'; cat shots/status.txt 2>/dev/null; echo '```'
            echo "### JS exception / fatal lines"; echo '```'; head -60 shots/js-exception-lines.txt 2>/dev/null; echo '```'
            echo "### crash report summary"; echo '```'; head -60 shots/crash-summary.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only the exception lines, status and screenshots (3-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erase-repro-${{ matrix.label }}
          path: |
            shots/commit.txt
            shots/status.txt
            shots/js-exception-lines.txt
            shots/crash-summary.txt
            shots/js-fatal-stack.txt
            shots/js-breadcrumbs-before-fatal.txt
            shots/app-wafra-lines.txt
            shots/erase-diag-lines.txt
            shots/app-entitlements.txt
            shots/*.png
            shots/maestro/*.log
          retention-days: 3
          if-no-files-found: warn

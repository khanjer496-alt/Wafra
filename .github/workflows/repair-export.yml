name: Repair web export evidence

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/test/repair/capture-real-preview.cjs'
      - '.github/workflows/repair-export.yml'

permissions:
  contents: read

jobs:
  export:
    if: startsWith(github.head_ref, 'repair/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Export real app with synthetic demo ledger
        env:
          EXPO_PUBLIC_WAFRA_E2E_DEMO: '1'
        run: npx expo export --clear --platform web --output-dir repair-web
      - name: Package source revision
        run: |
          set -euo pipefail
          mkdir -p repair-evidence
          git rev-parse HEAD > repair-evidence/revision.txt
          git archive --format=tar HEAD src scripts modules package.json package-lock.json app.json tsconfig.json | gzip > repair-evidence/source.tar.gz
          printf '%s\n' 'Real Expo web export, synthetic demo ledger. Not an Android APK or physical-device result.' > repair-evidence/SCOPE.txt
      - name: Capture actual rendered app
        run: |
          set -euo pipefail
          node scripts/e2e/serve.mjs repair-web 8126 > repair-evidence/server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8126 >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8126 >/dev/null
          node scripts/test/repair/capture-real-preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafra-repair-web-${{ github.sha }}
          path: repair-evidence/
          retention-days: 7

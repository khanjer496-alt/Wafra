name: Mocked iOS signing proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mocked-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5619698b8b14f36ad6d90c923ef9e62a19ae7ea7
          persist-credentials: false
      - name: Run both exact-head mocked suites without signing or builds
        run: |
          python3 -I - <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          expected = '5619698b8b14f36ad6d90c923ef9e62a19ae7ea7'
          actual = subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert actual == expected
          results = []
          for script, count in [('scripts/test/ios-device-signing.test.py',30),
                                ('scripts/test/ios-device-local-sign.test.py',7)]:
              process = subprocess.run([sys.executable,'-I',script],capture_output=True,text=True,timeout=90)
              found = re.search(r'Ran (\d+) tests?',process.stderr)
              tests_run = int(found.group(1)) if found else None
              results.append({'script':script,'sha256':hashlib.sha256(pathlib.Path(script).read_bytes()).hexdigest(),
                              'exitCode':process.returncode,'testsRun':tests_run,'expectedTests':count,
                              'passed':process.returncode == 0 and tests_run == count,
                              'stdout':process.stdout,'stderr':process.stderr})
          report = {'commit':actual,'mockedOnly':True,'suites':results,'passed':all(r['passed'] for r in results)}
          pathlib.Path('mocked-signing-result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'commit':actual,'passed':report['passed'],
                            'counts':[r['testsRun'] for r in results]}))
          sys.exit(0 if report['passed'] else 1)
          PY
      - name: Preserve exact-head mocked test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-mocked-signing-5619698b-${{ github.run_id }}
          path: mocked-signing-result.json
          if-no-files-found: error
          retention-days: 7

name: Pinned sealed ciphertext verification (never merge)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sealed-verify:
    if: github.repository == 'khanjer496-alt/Wafra' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/test/ios-sealed-artifact-check-f8'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3a7fdb1f93526942940ec3b7a2e0c7ecd492d552
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/ios-sealed-artifact-verify.py
            /scripts/ci/ios-sealed-artifact-check.schema.json
            /scripts/test/ios-sealed-artifact-verify.test.py
      - name: Assert exact independently reviewed verifier source
        run: test "$(git rev-parse HEAD)" = 3a7fdb1f93526942940ec3b7a2e0c7ecd492d552
      - name: Ten tiny fake data-boundary cases (no network or keys)
        run: python3 -I -B scripts/test/ios-sealed-artifact-verify.test.py
      - name: Verify only original pinned encrypted artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/ci/ios-sealed-artifact-verify.py --verify
      - name: Upload only bounded fixed candidate JSON
        id: publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wafra-sealed-check-${{ github.run_id }}
          path: ${{ runner.temp }}/sealed-verifier-report/result.json
          if-no-files-found: error
          retention-days: 1
      - name: Gate actual provider artifact size and identity before accepted success
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ARTIFACT_ID: ${{ steps.publish.outputs.artifact-id }}
          REPORT_ARTIFACT_DIGEST: ${{ steps.publish.outputs.artifact-digest }}
        run: python3 -I -B scripts/ci/ios-sealed-artifact-verify.py --provider-gate

name: CI

# Kept separate from build-apk.yml so logic regressions surface in a couple of
# minutes instead of waiting on a full Gradle release build.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - work/ledger-light-restore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review-source:
    if: github.ref == 'refs/heads/work/ledger-light-restore'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Archive only tracked source from this exact checkout
        run: |
          mkdir -p review-source
          git archive --format=tar.gz HEAD -o review-source/source.tar.gz
          git rev-parse HEAD > review-source/commit.txt
          git remote get-url origin > review-source/remote.txt
          sha256sum review-source/source.tar.gz > review-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: wafra-review-source
          path: review-source
          retention-days: 2

  native-paths:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'app.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'modules/wafra-message-history/**'
              - 'modules/wafra-live-capture/**'
              - 'scripts/test/native-live-capture-store.*'
              - 'src/app/import-sms.tsx'
              - 'src/lib/historical-import.ts'
              - 'scripts/test/run.sh'
              - 'scripts/test/ios-history-native-contract.test.js'
              - 'scripts/test/native-history-store.*'

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install relay dependencies
        working-directory: server
        run: npm ci
      - name: Install the SQLite CLI required by schema tests
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Generate native iOS contract fixtures
        run: npx expo prebuild --platform ios --no-install
      - name: Test
        run: npm test
      - name: Relay typecheck
        working-directory: server
        run: npm run typecheck
      - name: Relay tests
        working-directory: server
        run: npm test
      - name: Relay Worker dry run
        working-directory: server
        run: npm run build:check

  native-ios:
    needs: native-paths
    if: needs.native-paths.outputs.ios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.2 or newer
        run: |
          set -euo pipefail
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          test -n "$BEST"
          sudo xcode-select -s "$BEST/Contents/Developer"
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          MAJOR=${VER%%.*}
          MINOR=$(printf '%s' "$VER" | cut -d. -f2)
          if [ "$MAJOR" -lt 26 ] || { [ "$MAJOR" -eq 26 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "::error::Expo SDK 55 requires Xcode 26.2+; selected $VER"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: npx pod-install
      - name: Build and verify the protected history bridge and extracted App Intent metadata
        run: |
          bash scripts/test/native-history-store.sh
          bash scripts/test/native-live-capture-store.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run test:e2e

name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, work/ledger-light-restore]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  native-paths:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'app.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - 'modules/wafra-message-history/**'
              - 'modules/wafra-live-capture/**'
              - 'scripts/test/native-live-capture-store.*'
              - 'src/app/import-sms.tsx'
              - 'src/lib/historical-import.ts'
              - 'scripts/test/run.sh'
              - 'scripts/test/ios-history-native-contract.test.js'
              - 'scripts/test/native-history-store.*'
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: {PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install relay dependencies
        working-directory: server
        run: npm ci
      - name: Install schema-test SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Generate native iOS contract fixtures
        run: npx expo prebuild --platform ios --no-install
      - name: Test
        run: npm test
      - name: Relay typecheck
        working-directory: server
        run: npm run typecheck
      - name: Relay tests
        working-directory: server
        run: npm test
      - name: Relay Worker dry run
        working-directory: server
        run: npm run build:check
  native-ios:
    needs: native-paths
    if: needs.native-paths.outputs.ios == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Select Xcode 26.2 or newer
        run: |
          set -euo pipefail
          BEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          test -n "$BEST"
          sudo xcode-select -s "$BEST/Contents/Developer"
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          MAJOR=${VER%%.*}
          MINOR=$(printf '%s' "$VER" | cut -d. -f2)
          if [ "$MAJOR" -lt 26 ] || { [ "$MAJOR" -eq 26 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "::error::Expo SDK 55 requires Xcode 26.2+; selected $VER"; exit 1
          fi
      - uses: actions/setup-node@v4
        with: {node-version: 22.22.3, cache: npm}
      - name: Install dependencies
        run: npm ci
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: npx pod-install
      - name: Verify protected history bridge and App Intent metadata
        run: |
          bash scripts/test/native-history-store.sh
          bash scripts/test/native-live-capture-store.sh
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.22.3, cache: npm}
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run test:e2e
      - name: Capture browser evidence independently
        if: always()
        env: {EXPO_PUBLIC_WAFRA_E2E_DEMO: '1'}
        run: |
          set -euo pipefail
          test -f dist/index.html || npx --no-install expo export --clear --platform web
          node scripts/e2e/serve.mjs dist 8136 > /tmp/wafra-browser.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:8136/ >/dev/null && break || sleep 1; done
          BASE=http://127.0.0.1:8136 node scripts/e2e/e2e-redesign.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: ledger-light-browser-evidence, path: artifacts/e2e-redesign/, retention-days: 7}
  requested-preview:
    needs: check
    if: github.ref == 'refs/heads/work/ledger-light-restore' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Restore Ledger & Light source')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the explicitly requested preview from the validated source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run build-apk.yml --repo "$REPO" --ref work/ledger-light-restore -f preview=true -f publish_preview=true -f expected_commit="$SOURCE" -f architecture=arm64 -f bundle=false -f corpus=false

name: Canonical iOS packaging fixture (no app build)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  producer-fixture:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7656dce45edef4b64ed64c3e847fad79c1e3f6f
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact reviewed producer source
        run: test "$(git rev-parse HEAD)" = b7656dce45edef4b64ed64c3e847fad79c1e3f6f
      - name: Fetch immutable baseline production recipe for comparison
        run: git fetch --no-tags --depth=1 origin ab62f9c02d32e34f6c0240feaf9011861dbbe3ca
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tiny actual-recipe preservation and refusal fixtures (no crypto)
        env:
          PACKAGE_FIXTURE_REPORT: ${{ runner.temp }}/ios-producer-fixture.json
        run: python3 -I scripts/test/ios-device-package.test.py
      - name: Preserve only fixed-field producer fixture result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-producer-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/ios-producer-fixture.json
          if-no-files-found: error
          retention-days: 1

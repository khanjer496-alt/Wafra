name: CI

# Kept separate from build-apk.yml so logic regressions surface in a couple of
# minutes instead of waiting on a full Gradle release build.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      # The integration branch is where the work actually lands, and it had no
      # push trigger — so a failing suite sat on it undetected. Anything that
      # is a working line long enough to accumulate commits belongs here.
      - integration/combine-prs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Chromium is pre-installed on the runner image used for the e2e job
      # below; npm postinstall must not re-fetch it.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # kotlin-regex.test.js compiles the receiver's regexes with javac and
      # runs them, which is the only check that the Kotlin and the JS agree.
      # Without this it depends on whatever JDK the runner image ships, and it
      # silently degrades to "the generated check compiles" failing.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install relay dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Relay typecheck
        working-directory: server
        run: npm run typecheck

      - name: Relay tests
        working-directory: server
        run: npm test

      - name: Relay Worker dry run
        working-directory: server
        run: npm run build:check

  # The browser suites catch what unit tests structurally cannot: a route that
  # resolves to nothing, a screen that renders blank, a total that disagrees
  # with the rows under it. They existed for weeks and ran only when someone
  # remembered to — which is the same "nothing checks it" problem the contracts
  # suite is about, one level up.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

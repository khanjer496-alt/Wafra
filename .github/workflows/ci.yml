name: CI

# Kept separate from build-apk.yml so logic regressions surface in a couple of
# minutes instead of waiting on a full Gradle release build.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - claude/uae-android-app-ui-muatsu

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The e2e scripts drive a browser, but typecheck/lint/test never launch
      # one — skip the ~300MB download on every run.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

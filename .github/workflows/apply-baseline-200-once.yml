name: Apply Baseline 200 iOS test config once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-baseline-200-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin Baseline 200 history Shortcut and beta configuration
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          baseline = 'https://github.com/khanjer496-alt/Wafra/releases/download/ios-history-baseline-200-20260917/Wafra-History-Baseline-200.signed.shortcut'
          live = 'https://www.icloud.com/shortcuts/822bcc1dd2964b9f887ef9b93601441d'

          path = Path('src/lib/ios-history-setup.ts')
          src = path.read_text()
          marker = 'export const IOS_HISTORY_HANDOFF_TTL_MS = 60 * 60_000;\n'
          constant = "export const IOS_HISTORY_BASELINE_200_URL =\n  '" + baseline + "';\n"
          if 'IOS_HISTORY_BASELINE_200_URL' not in src:
              if marker not in src:
                  raise SystemExit('history TTL marker not found')
              src = src.replace(marker, marker + constant, 1)

          old_record = """const iosHistoryShortcutRecord = (installUrl: unknown): IosHistoryShortcutRecord | null => {\n  const id = typeof installUrl === 'string'\n    ? /^https:\\/\\/www\\.icloud\\.com\\/shortcuts\\/([0-9A-Fa-f]{32})$/.exec(installUrl)?.[1]?.toLowerCase()\n    : undefined;\n  return (id && IOS_HISTORY_SHORTCUT_INSTALLED_RECORDS[id]) || null;\n};"""
          new_record = """const iosHistoryShortcutRecord = (installUrl: unknown): IosHistoryShortcutRecord | null => {\n  if (installUrl === IOS_HISTORY_BASELINE_200_URL) {\n    return { name: IOS_HISTORY_SHORTCUT_DEFAULT_NAME, resumesOnRerun: false };\n  }\n  const id = typeof installUrl === 'string'\n    ? /^https:\\/\\/www\\.icloud\\.com\\/shortcuts\\/([0-9A-Fa-f]{32})$/.exec(installUrl)?.[1]?.toLowerCase()\n    : undefined;\n  return (id && IOS_HISTORY_SHORTCUT_INSTALLED_RECORDS[id]) || null;\n};"""
          if old_record in src:
              src = src.replace(old_record, new_record, 1)
          elif new_record not in src:
              raise SystemExit('history shortcut record block not found')

          old_normalize = """export const normalizeIosHistoryShortcutUrl = (value: unknown): string | null => {\n  if (typeof value !== 'string') return null;\n  const match = /^https:\\/\\/www\\.icloud\\.com\\/shortcuts\\/([0-9A-Fa-f]{32})$/.exec(value);\n  if (!match) return null;\n  const id = match[1].toLowerCase();\n  if (RETIRED_HISTORY_SHORTCUT_IDS.has(id)) return null;\n  return `https://www.icloud.com/shortcuts/${id}`;\n};"""
          new_normalize = """export const normalizeIosHistoryShortcutUrl = (value: unknown): string | null => {\n  if (value === IOS_HISTORY_BASELINE_200_URL) return IOS_HISTORY_BASELINE_200_URL;\n  if (typeof value !== 'string') return null;\n  const match = /^https:\\/\\/www\\.icloud\\.com\\/shortcuts\\/([0-9A-Fa-f]{32})$/.exec(value);\n  if (!match) return null;\n  const id = match[1].toLowerCase();\n  if (RETIRED_HISTORY_SHORTCUT_IDS.has(id)) return null;\n  return `https://www.icloud.com/shortcuts/${id}`;\n};"""
          if old_normalize in src:
              src = src.replace(old_normalize, new_normalize, 1)
          elif new_normalize not in src:
              raise SystemExit('history shortcut normalize block not found')
          path.write_text(src)

          eas_path = Path('eas.json')
          eas = json.loads(eas_path.read_text())
          env = eas['build']['history-beta']['env']
          prod = eas['build']['production']['env']
          env['EXPO_PUBLIC_WAFRA_SHORTCUT_URL'] = live
          env['EXPO_PUBLIC_WAFRA_HISTORY_SHORTCUT_URL'] = baseline
          env['WAFRA_PAGED_HISTORY_BETA'] = '0'
          env['EXPO_PUBLIC_WAFRA_PAGED_HISTORY_BETA'] = '0'
          env['EXPO_PUBLIC_WAFRA_SHORTCUT_SETUP_CHECK_VERSION'] = '1'
          env['EXPO_PUBLIC_SUPERWALL_IOS_API_KEY'] = prod['EXPO_PUBLIC_SUPERWALL_IOS_API_KEY']
          eas_path.write_text(json.dumps(eas, indent=2) + '\n')

          test_path = Path('scripts/test/ios-shortcuts-config.test.js')
          test = test_path.read_text()
          old = """console.log('ios-shortcuts-config.test.js: 1 passed');\n"""
          new = """const eas = JSON.parse(readFileSync(path.join(__dirname, '../../eas.json'), 'utf8'));\nconst historyBeta = eas.build?.['history-beta']?.env ?? {};\nconst expectedBaseline = 'https://github.com/khanjer496-alt/Wafra/releases/download/ios-history-baseline-200-20260917/Wafra-History-Baseline-200.signed.shortcut';\nconst expectedLive = 'https://www.icloud.com/shortcuts/822bcc1dd2964b9f887ef9b93601441d';\nif (historyBeta.EXPO_PUBLIC_WAFRA_HISTORY_SHORTCUT_URL !== expectedBaseline) {\n  throw new Error('history-beta must install the physically proven Baseline-200 signed Shortcut');\n}\nif (historyBeta.EXPO_PUBLIC_WAFRA_SHORTCUT_URL !== expectedLive) {\n  throw new Error('history-beta must keep the current Wafra Capture v2 Shortcut');\n}\nif (historyBeta.WAFRA_PAGED_HISTORY_BETA !== '0' || historyBeta.EXPO_PUBLIC_WAFRA_PAGED_HISTORY_BETA !== '0') {\n  throw new Error('Baseline-200 testing must keep paged history disabled');\n}\nconst historySetup = readFileSync(path.join(__dirname, '../../src/lib/ios-history-setup.ts'), 'utf8');\nif (!historySetup.includes('IOS_HISTORY_BASELINE_200_URL') || !historySetup.includes(expectedBaseline)) {\n  throw new Error('the app must explicitly whitelist the exact signed Baseline-200 release asset');\n}\n\nconsole.log('ios-shortcuts-config.test.js: 5 passed');\n"""
          if old in test:
              test = test.replace(old, new, 1)
          elif 'history-beta must install the physically proven Baseline-200 signed Shortcut' not in test:
              raise SystemExit('ios shortcuts config test marker not found')
          test_path.write_text(test)
          PY

      - name: Remove temporary orchestration workflows
        run: |
          rm -f .github/workflows/cancel-stale-ios-once.yml
          rm -f .github/workflows/apply-baseline-200-once.yml

      - name: Verify pinned config before commit
        run: |
          node scripts/test/ios-shortcuts-config.test.js
          node -e "const e=require('./eas.json'); const h=e.build['history-beta'].env; if(h.EXPO_PUBLIC_WAFRA_PAGED_HISTORY_BETA!=='0') process.exit(1)"
          grep -F "Wafra-History-Baseline-200.signed.shortcut" src/lib/ios-history-setup.ts

      - name: Commit canonical Baseline 200 beta config
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/ios-history-setup.ts eas.json scripts/test/ios-shortcuts-config.test.js .github/workflows
          git commit -m 'test(ios): pin Baseline 200 history shortcut'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch corrected signed iOS beta to TestFlight
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run ios-testflight.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f build_host=github-macos \
            -f source_commit="$SOURCE_COMMIT" \
            -f profile=history-beta \
            -f submit=true \
            -f wait=false

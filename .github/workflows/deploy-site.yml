name: Deploy website

# Builds the public website (landing, privacy, terms, support) from the branch
# it runs on and deploys it to the Cloudflare Pages project serving SITE_URL.
# Manual only: publishing stays an explicit action. Before deploying it adds
# the SITE_EVENTS Analytics Engine binding and sets Functions to fail open
# (scripts/pages-site-config.mjs); afterwards it checks the live site.
# docs/seo-geo-audit.md explains the measurement and the shared request limit.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Public HTTPS origin of the website'
        required: true
        default: 'https://wafra-app-azg.pages.dev'

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPO_PUBLIC_WAFRA_SITE_URL: ${{ inputs.site_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Check the two Cloudflare secrets exist
        run: |
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## Cannot start: repository secrets are missing"
              echo
              for name in "${missing[@]}"; do echo "- \`$name\` is not set"; done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci

      - name: Build and check the website
        run: |
          npm run web:export
          npm run check:web-seo

      - name: Bind SITE_EVENTS and set fail open
        id: pages
        run: node scripts/pages-site-config.mjs "$EXPO_PUBLIC_WAFRA_SITE_URL" >> "$GITHUB_OUTPUT"

      # From the repository root: Wrangler only uploads ./functions from the
      # current directory, and the counting lives there.
      - name: Deploy to Cloudflare Pages
        run: |
          server/node_modules/.bin/wrangler pages deploy dist \
            --project-name "${{ steps.pages.outputs.project }}" \
            --branch "${{ steps.pages.outputs.branch }}" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=false

      - name: Check the live site
        run: |
          site="$EXPO_PUBLIC_WAFRA_SITE_URL"
          fail=0
          expect() {
            local path="$1" want="$2" got
            for attempt in 1 2 3 4 5 6; do
              got=$(curl -s -o /dev/null -w '%{http_code}' "$site$path")
              [ "$got" = "$want" ] && break
              sleep 10
            done
            echo "$path → $got (want $want)"
            [ "$got" = "$want" ] || fail=1
          }
          expect / 200
          expect /privacy/ 200
          expect /wafra-history-import.shortcut 200
          expect /transactions 404
          expect /settings 404
          expect /get/iphone 302
          expect /get/android 404
          # Only the Function sends this header; _redirects does not.
          if curl -sI "$site/get/iphone" | grep -qi '^referrer-policy: no-referrer'; then
            echo "/get/iphone is served by the counting Function"
          else
            echo "/get/iphone is not served by the Function: counting is off"; fail=1
          fi
          if curl -s "$site/" | grep -q '<script src'; then
            echo "The landing page ships JavaScript"; fail=1
          fi
          {
            echo "## Website deployed"
            echo
            echo "Project \`${{ steps.pages.outputs.project }}\`, branch \`${{ steps.pages.outputs.branch }}\`, commit \`$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit $fail

name: screenmap · PR changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: screenmap-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  changes:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Build local iOS simulator app
        env:
          EXPO_PUBLIC_WAFRA_SCREENMAP_DEMO: '1'
          EXPO_PUBLIC_WAFRA_FOUNDER_UNLOCK: '1'
        run: |
          npm ci
          npx expo prebuild --platform ios --no-install
          npx pod-install
          xcodebuild \
            -workspace ios/Wafra.xcworkspace \
            -scheme Wafra \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/wafra-screenmap-derived" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            build
      - uses: aleqsio/screenmap@v1
        with:
          mode: pr
          app_path: ${{ runner.temp }}/wafra-screenmap-derived/Build/Products/Release-iphonesimulator/Wafra.app
          simulator: iPhone 17 Pro
          agent_provider: codex
          # Private review: artifact link rather than anonymous raw-GitHub URLs.
          publish: 'false'
          auto_baseline: 'false'

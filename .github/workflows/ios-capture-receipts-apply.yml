name: Validate iOS capture receipts
on:
  push:
    branches: [work/ios-guided-onboarding]
    paths:
      - 'scripts/changes/apply-capture-receipts.py'
      - '.github/workflows/ios-capture-receipts-apply.yml'
permissions:
  contents: read
concurrency:
  group: ios-capture-receipts-apply
  cancel-in-progress: false
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
      - run: python3 scripts/changes/apply-capture-receipts.py
      - name: Add the real health module to the explicit test-fixture compile list
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('scripts/test/build.sh')
          data = p.read_bytes()
          assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == 'af07c140a8d67992fdf9c201024a3320bc00af7f'
          before = 'ios-bank-senders.generated ios-bank-senders local-message-record ios-local-capture; do'
          text = data.decode()
          assert text.count(before) == 1
          p.write_text(text.replace(before, 'ios-bank-senders.generated ios-bank-senders local-message-record ios-capture-health ios-local-capture; do'))
          PY
      - run: npm ci
      - run: npm --prefix server ci
      - run: npx expo prebuild --platform ios --no-install
      - run: npm run typecheck
      - run: npm run lint
      - name: Source and component regressions
        run: |
          set -euo pipefail
          mkdir -p receipt-evidence
          node scripts/test/ios-setup-ux.test.js | tee receipt-evidence/setup.txt
          node --test scripts/test/ios-journey/*.test.cjs | tee receipt-evidence/health.txt
      - name: Full existing application and server regression suite
        run: |
          set -euo pipefail
          npm test > receipt-evidence/regressions.txt 2>&1
          tail -20 receipt-evidence/regressions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-capture-app-checks
          path: receipt-evidence/
          retention-days: 7
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/changes/apply-capture-receipts.py
      - name: Build and run real bridge with explicit store boundary stub
        run: |
          set -euo pipefail
          mkdir -p receipt-evidence
          T="$RUNNER_TEMP/receipt-bridge"
          mkdir -p "$T"
          swiftc -parse-as-library -emit-module -emit-object -module-name ExpoModulesCore -emit-module-path "$T/ExpoModulesCore.swiftmodule" modules/wafra-live-capture/ios/Tests/ExpoModulesCoreStub.swift -o "$T/ExpoModulesCore.o"
          swiftc -I "$T" "$T/ExpoModulesCore.o" modules/wafra-live-capture/ios/Tests/WafraLiveCaptureStoreStub.swift modules/wafra-live-capture/ios/WafraLiveCaptureModule.swift modules/wafra-live-capture/ios/Tests/WafraLiveCaptureBridgeBehaviorTests.swift -o "$T/bridge-tests"
          "$T/bridge-tests" | tee receipt-evidence/bridge.txt
      - name: Execute actual queue persistence tests in an iOS simulator, not the macOS filesystem API
        run: |
          set -euo pipefail
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          runtime=$(python3 -c 'import json,os; a=[r for r in json.load(open(os.environ["RUNNER_TEMP"]+"/runtimes.json"))["runtimes"] if r.get("isAvailable") and ".iOS-" in r["identifier"]]; print(sorted(a,key=lambda r:tuple(int(v) for v in r["version"].split(".")))[-1]["identifier"])')
          device=$(xcrun simctl create WafraCaptureReceiptTests com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          trap 'xcrun simctl shutdown "$device" >/dev/null 2>&1 || true; xcrun simctl delete "$device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun swiftc -D DEBUG -target arm64-apple-ios18.0-simulator -sdk "$sdk" modules/wafra-live-capture/ios/WafraLiveCaptureStore.swift scripts/test/native-live-capture-receipts.swift -o "$RUNNER_TEMP/native-receipt-tests"
          codesign --force --sign - "$RUNNER_TEMP/native-receipt-tests"
          printf '%s\n' "runtime=$runtime; scope=synthetic native queue persistence, not real incoming SMS or locked-device protection" | tee receipt-evidence/scope.txt
          xcrun simctl spawn "$device" "$RUNNER_TEMP/native-receipt-tests" | tee receipt-evidence/native-store.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-capture-native-checks
          path: receipt-evidence/
          retention-days: 7
  save:
    needs: [app, native]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit the validated normal source without overwriting concurrent work
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/ios-guided-onboarding'
          test "$(git ls-remote origin refs/heads/work/ios-guided-onboarding | cut -f1)" = "$GITHUB_SHA"
          python3 scripts/changes/apply-capture-receipts.py
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('scripts/test/build.sh')
          data = p.read_bytes()
          assert hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest() == 'af07c140a8d67992fdf9c201024a3320bc00af7f'
          before = 'ios-bank-senders.generated ios-bank-senders local-message-record ios-local-capture; do'
          text = data.decode()
          assert text.count(before) == 1
          p.write_text(text.replace(before, 'ios-bank-senders.generated ios-bank-senders local-message-record ios-capture-health ios-local-capture; do'))
          PY
          git diff --check
          git add modules/wafra-live-capture/ios/Tests/WafraLiveCaptureBridgeBehaviorTests.swift modules/wafra-live-capture/ios/Tests/WafraLiveCaptureStoreStub.swift modules/wafra-live-capture/ios/WafraLiveCaptureModule.swift modules/wafra-live-capture/ios/WafraLiveCaptureStore.swift modules/wafra-live-capture/src/WafraLiveCapture.types.ts scripts/test/build.sh scripts/test/ios-capture-setup.test.js scripts/test/ios-setup-ux.test.js src/app/ios-setup.tsx src/components/ios-message-setup/setup-journey.tsx src/hooks/use-auto-import.ts src/lib/ios-capture-setup.ts src/lib/ios-local-capture.ts
          git rm scripts/changes/apply-capture-receipts.py .github/workflows/ios-capture-receipts-apply.yml .github/workflows/ios-guided-source-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ios): persist capture receipts and show honest queue status during setup'
          mkdir -p receipt-evidence
          git rev-parse HEAD | tee receipt-evidence/revision.txt
          git push origin HEAD:refs/heads/work/ios-guided-onboarding
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-capture-final-source
          path: receipt-evidence/
          retention-days: 7

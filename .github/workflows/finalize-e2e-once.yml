name: One-time finalize browser contracts

on:
  push:
    branches:
      - repair/android-journal-redesign
    paths:
      - .github/workflows/finalize-e2e-once.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Add one-time E2E finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/android-journal-redesign
          fetch-depth: 0

      - name: Install the corrected smoke contract
        shell: bash
        run: |
          cat <<'PAYLOAD' | base64 -d | gunzip > scripts/e2e/e2e-smoke.mjs
          
          PAYLOAD
          node --check scripts/e2e/e2e-smoke.mjs
          git diff --check

      - name: Commit the corrected smoke contract
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/e2e/e2e-smoke.mjs
          git commit -m 'Make browser checks follow the rendered contracts'
          git push origin HEAD:repair/android-journal-redesign

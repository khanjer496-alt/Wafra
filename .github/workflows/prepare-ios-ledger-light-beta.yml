name: Prepare updated iOS beta

# Owner-requested integration only; no Apple upload or main modification.
on:
  push:
    branches: [release/ios-ledger-light-beta]
    paths: [.github/workflows/prepare-ios-ledger-light-beta.yml]
permissions:
  contents: write
concurrency:
  group: prepare-ios-ledger-light-beta
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Integrate exact reviewed sources without overwriting a working tree
        run: |
          set -euo pipefail
          mkdir -p evidence
          test -z "$(git status --porcelain)"
          git remote get-url origin > evidence/remote.txt
          git config user.name 'Wafra release preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main restore/ledger-light-20260907 work/ios-guided-onboarding
          test "$(git rev-parse origin/main)" = 3d390633a72d665f74e6b27e6f13f2176087431a
          test "$(git rev-parse origin/restore/ledger-light-20260907)" = fc3bf248bc4e8a844a527e35119c73c2f26c1163
          test "$(git rev-parse origin/work/ios-guided-onboarding)" = fb15f98a30a8d0c25faa9ccd3424fe2d5aa12abc
          git merge-tree --write-tree "$GITHUB_SHA" fc3bf248bc4e8a844a527e35119c73c2f26c1163 > evidence/merge-restoration.txt
          TREE=$(head -1 evidence/merge-restoration.txt)
          FIRST=$(printf '%s\n' 'Integrate reviewed Ledger & Light and persistence fix' | git commit-tree "$TREE" -p "$GITHUB_SHA" -p fc3bf248bc4e8a844a527e35119c73c2f26c1163)
          git merge-tree --write-tree "$FIRST" fb15f98a30a8d0c25faa9ccd3424fe2d5aa12abc > evidence/merge-ios.txt
          TREE=$(head -1 evidence/merge-ios.txt)
          CANDIDATE=$(printf '%s\n' 'Integrate history-first iOS setup and native capture receipts for requested beta' | git commit-tree "$TREE" -p "$FIRST" -p fb15f98a30a8d0c25faa9ccd3424fe2d5aa12abc)
          git worktree add --detach ../wafra-ios-candidate "$CANDIDATE"
          printf '%s\n' "$CANDIDATE" > evidence/candidate-before-integration-fix.txt
      - name: Resolve duplicate imports and expose existing history-beta profile
        working-directory: ../wafra-ios-candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          for filename,line in [
            ('src/app/ios-setup.tsx', "import { useLanguage } from '@/hooks/use-language';\n"),
            ('scripts/test/ios-setup-recovery.helpers.js', "      '@/hooks/use-language': { useLanguage: () => 'en' },\n")]:
            p=Path(filename);s=p.read_text();assert s.count(line)==2,filename
            p.write_text(s.replace(line,'',1))
          p=Path('.github/workflows/ios-testflight.yml')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='d996b573b01bc51ca693385bc298640e4915f2f7'
          s=p.read_text()
          changes=[
            ('          - production-candidate\n', '          - production-candidate\n          - history-beta\n'),
            ('Supported by production and production-candidate;', 'Supported by production, production-candidate and history-beta;'),
            ('if [ "$PROFILE" = "preview" ]; then\n            node "${args[@]}"', 'if [ "$PROFILE" = "preview" ] || [ "$PROFILE" = "history-beta" ]; then\n            node "${args[@]}"'),
            ('args=(build --platform ios --profile "$PROFILE" --non-interactive --json)', 'args=(build --platform ios --profile "$PROFILE" --non-interactive --freeze-credentials --json)')]
          for before,after in changes:
            assert s.count(before)==1,before;s=s.replace(before,after)
          anchor='      # The key is in RUNNER_TEMP, which GitHub clears anyway, but a private\n'
          assert s.count(anchor)==1
          addition='''      - name: Record exact completed beta build
                  if: always() && inputs.profile == 'history-beta' && inputs.submit_build_id == ''
                  run: |
                    mkdir -p ios-build-evidence
                    node <<'NODE'
                    const fs=require('fs');
                    let raw; try {raw=JSON.parse(fs.readFileSync('build.json','utf8'));} catch {raw=[];}
                    const list=Array.isArray(raw)?raw:[raw];
                    const builds=list.map(b=>({id:b.id,status:b.status,platform:b.platform,distribution:b.distribution,version:b.appVersion,buildNumber:b.appBuildVersion,gitCommitHash:b.gitCommitHash??null}));
                    const report={sourceCommit:process.env.GITHUB_SHA,profile:'history-beta',builds};
                    fs.writeFileSync('ios-build-evidence/build.json',JSON.stringify(report,null,2));
                    console.log(JSON.stringify(report,null,2));
                    NODE
                - uses: actions/upload-artifact@v4
                  if: always() && inputs.profile == 'history-beta' && inputs.submit_build_id == ''
                  with:
                    name: wafra-ios-build-report
                    path: ios-build-evidence/
                    retention-days: 14

          '''
          addition='\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines())+'\n'
          s=s.replace(anchor,addition+anchor)
          p.write_text(s)
          PY
          git diff --check
          git diff > "$GITHUB_WORKSPACE/evidence/integration-fix.diff"
      - name: Install exact dependencies and generate native contract fixtures
        working-directory: ../wafra-ios-candidate
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
          sudo apt-get install -y sqlite3
          npx --no-install expo prebuild --platform ios --no-install
      - name: Typecheck, lint and all application/server regression suites
        working-directory: ../wafra-ios-candidate
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/evidence"
          npm run typecheck 2>&1 | tee "$OUT/typecheck.log"
          npm run lint 2>&1 | tee "$OUT/lint.log"
          npm test 2>&1 | tee "$OUT/tests.log"
          node --test scripts/test/ios-journey/*.test.cjs 2>&1 | tee "$OUT/ios-journey.log"
          npm run update:check 2>&1 | tee "$OUT/update-config.log"
          node scripts/check-release-config.mjs --intent build --platform ios --profile history-beta --submit true 2>&1 | tee "$OUT/beta-config.log"
          node scripts/release/ios-public-shortcut-check.mjs 2>&1 | tee "$OUT/published-shortcuts.log"
      - name: Commit and push only this validated candidate
        working-directory: ../wafra-ios-candidate
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/release/ios-ledger-light-beta | cut -f1)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual=={'src/app/ios-setup.tsx','scripts/test/ios-setup-recovery.helpers.js','.github/workflows/ios-testflight.yml'},actual
          PY
          git add -- src/app/ios-setup.tsx scripts/test/ios-setup-recovery.helpers.js .github/workflows/ios-testflight.yml
          git commit -m 'Resolve merged setup imports and support feature beta in canonical iOS build workflow'
          CANDIDATE=$(git rev-parse HEAD)
          git diff --stat origin/main HEAD > "$GITHUB_WORKSPACE/evidence/changes.txt"
          git archive --format=tar.gz HEAD > "$GITHUB_WORKSPACE/evidence/source.tar.gz"
          git push origin "$CANDIDATE:refs/heads/release/ios-ledger-light-beta"
          printf '%s\n' "$CANDIDATE" > "$GITHUB_WORKSPACE/evidence/published-source.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wafra-ios-beta-preparation
          path: evidence/
          retention-days: 14

name: Temporary Companion TestFlight status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query Companion TestFlight builds
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {createPrivateKey,sign} from 'node:crypto';
          const raw=process.env.EXPO_ASC_API_KEY_P8||'',kid=process.env.EXPO_ASC_KEY_ID,iss=process.env.EXPO_ASC_ISSUER_ID;
          const pem=raw.includes('BEGIN PRIVATE KEY')?raw:Buffer.from(raw.replace(/\s/g,''),'base64').toString('utf8');
          const key=createPrivateKey(pem),b64=d=>Buffer.from(JSON.stringify(d)).toString('base64url');
          const now=Math.floor(Date.now()/1000),u=`${b64({alg:'ES256',kid,typ:'JWT'})}.${b64({iss,iat:now,exp:now+600,aud:'appstoreconnect-v1'})}`;
          const token=`${u}.${sign('sha256',Buffer.from(u),{key,dsaEncoding:'ieee-p1363'}).toString('base64url')}`;
          const res=await fetch('https://api.appstoreconnect.apple.com/v1/builds?filter[app]=6814258840&sort=-uploadedDate&limit=10&include=preReleaseVersion,buildBetaDetail',{headers:{Authorization:`Bearer ${token}`}});
          const text=await res.text(); if(!res.ok) throw new Error(`${res.status} ${text}`); const j=JSON.parse(text);
          const inc=new Map((j.included||[]).map(x=>[`${x.type}:${x.id}`,x]));
          const out=j.data.map(b=>{const pr=b.relationships?.preReleaseVersion?.data,bd=b.relationships?.buildBetaDetail?.data;return {id:b.id,buildNumber:b.attributes.version,processingState:b.attributes.processingState,uploadedDate:b.attributes.uploadedDate,version:pr?inc.get(`${pr.type}:${pr.id}`)?.attributes?.version:null,externalBuildState:bd?inc.get(`${bd.type}:${bd.id}`)?.attributes?.externalBuildState:null,internalBuildState:bd?inc.get(`${bd.type}:${bd.id}`)?.attributes?.internalBuildState:null};});
          console.log(JSON.stringify(out,null,2));
          NODE

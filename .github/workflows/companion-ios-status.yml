name: Temporary Companion App Store Connect audit
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/companion-ios-status.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Companion app and beta groups
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, sign } from 'node:crypto';

          const raw = process.env.EXPO_ASC_API_KEY_P8 || '';
          const kid = process.env.EXPO_ASC_KEY_ID;
          const iss = process.env.EXPO_ASC_ISSUER_ID;
          const pem = raw.includes('BEGIN PRIVATE KEY')
            ? raw
            : Buffer.from(raw.replace(/\s/g, ''), 'base64').toString('utf8');
          const key = createPrivateKey(pem);
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64({ alg: 'ES256', kid, typ: 'JWT' })}.${b64({ iss, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' })}`;
          const token = `${unsigned}.${sign('sha256', Buffer.from(unsigned), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url')}`;

          async function asc(path) {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              headers: { Authorization: `Bearer ${token}` },
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${response.status} ${path} ${text}`);
            return JSON.parse(text);
          }

          const appId = '6814258840';
          const app = await asc(`/v1/apps/${appId}`);
          const groups = await asc(`/v1/betaGroups?filter[app]=${appId}&limit=200`);
          console.log('ASC_AUDIT=' + JSON.stringify({
            app: { id: app.data.id, ...app.data.attributes },
            groups: groups.data.map(group => ({ id: group.id, ...group.attributes })),
          }, null, 2));
          NODE

name: Temporary Companion public TestFlight setup
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/companion-ios-status.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPO_ASC_API_KEY_P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create and inspect Companion public beta group
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, sign } from 'node:crypto';

          const raw = process.env.EXPO_ASC_API_KEY_P8 || '';
          const kid = process.env.EXPO_ASC_KEY_ID;
          const iss = process.env.EXPO_ASC_ISSUER_ID;
          const pem = raw.includes('BEGIN PRIVATE KEY')
            ? raw
            : Buffer.from(raw.replace(/\s/g, ''), 'base64').toString('utf8');
          const key = createPrivateKey(pem);
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const unsigned = `${b64({ alg: 'ES256', kid, typ: 'JWT' })}.${b64({ iss, iat: now, exp: now + 600, aud: 'appstoreconnect-v1' })}`;
          const token = `${unsigned}.${sign('sha256', Buffer.from(unsigned), { key, dsaEncoding: 'ieee-p1363' }).toString('base64url')}`;

          async function request(method, path, body) {
            const response = await fetch(`https://api.appstoreconnect.apple.com${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${token}`,
                ...(body ? { 'Content-Type': 'application/json' } : {}),
              },
              ...(body ? { body: JSON.stringify(body) } : {}),
            });
            const text = await response.text();
            let json = null;
            if (text) {
              try { json = JSON.parse(text); } catch { json = { raw: text }; }
            }
            return { ok: response.ok, status: response.status, json };
          }

          async function required(method, path, body) {
            const result = await request(method, path, body);
            if (!result.ok) {
              throw new Error(`${method} ${path} failed with ${result.status}: ${JSON.stringify(result.json)}`);
            }
            return result.json;
          }

          const appId = '6814258840';
          const groupName = 'Companion Public Beta';
          const app = await required('GET', `/v1/apps/${appId}`);
          const groups = await required('GET', `/v1/betaGroups?filter[app]=${appId}&limit=200`);
          let group = groups.data.find(item => item.attributes?.name === groupName);
          let created = false;

          if (!group) {
            const createdResponse = await required('POST', '/v1/betaGroups', {
              data: {
                type: 'betaGroups',
                attributes: {
                  name: groupName,
                  isInternalGroup: false,
                },
                relationships: {
                  app: {
                    data: { type: 'apps', id: appId },
                  },
                },
              },
            });
            group = createdResponse.data;
            created = true;
          }

          const publicLinkAttempt = await request('PATCH', `/v1/betaGroups/${group.id}`, {
            data: {
              type: 'betaGroups',
              id: group.id,
              attributes: { publicLinkEnabled: true },
            },
          });

          const refreshedGroup = await required('GET', `/v1/betaGroups/${group.id}`);
          const buildResponse = await required('GET', `/v1/builds?filter[app]=${appId}&limit=1`);
          const reviewResponse = await request('GET', `/v1/apps/${appId}/betaAppReviewDetail`);
          const localizationResponse = await request('GET', `/v1/apps/${appId}/betaAppLocalizations?limit=200`);

          const reviewAttributes = reviewResponse.ok ? (reviewResponse.json?.data?.attributes || {}) : null;
          const reviewFieldPresence = reviewAttributes ? {
            contactFirstName: Boolean(reviewAttributes.contactFirstName),
            contactLastName: Boolean(reviewAttributes.contactLastName),
            contactPhone: Boolean(reviewAttributes.contactPhone),
            contactEmail: Boolean(reviewAttributes.contactEmail),
            demoAccountRequired: Boolean(reviewAttributes.demoAccountRequired),
            demoAccountName: Boolean(reviewAttributes.demoAccountName),
            demoAccountPassword: Boolean(reviewAttributes.demoAccountPassword),
            notes: Boolean(reviewAttributes.notes),
          } : null;

          const localizations = localizationResponse.ok
            ? (localizationResponse.json?.data || []).map(item => ({
                id: item.id,
                locale: item.attributes?.locale,
                descriptionPresent: Boolean(item.attributes?.description),
                feedbackEmailPresent: Boolean(item.attributes?.feedbackEmail),
                marketingUrlPresent: Boolean(item.attributes?.marketingUrl),
                privacyPolicyUrlPresent: Boolean(item.attributes?.privacyPolicyUrl),
              }))
            : [];

          console.log('ASC_PUBLIC_BETA_RESULT=' + JSON.stringify({
            app: {
              id: app.data.id,
              name: app.data.attributes?.name,
              bundleId: app.data.attributes?.bundleId,
              sku: app.data.attributes?.sku,
              primaryLocale: app.data.attributes?.primaryLocale,
            },
            group: {
              id: refreshedGroup.data.id,
              created,
              ...refreshedGroup.data.attributes,
            },
            publicLinkAttempt: {
              ok: publicLinkAttempt.ok,
              status: publicLinkAttempt.status,
              errors: publicLinkAttempt.ok ? [] : (publicLinkAttempt.json?.errors || publicLinkAttempt.json),
            },
            buildCountAtLeast: buildResponse.data.length,
            betaAppReviewDetail: {
              readable: reviewResponse.ok,
              status: reviewResponse.status,
              fieldPresence: reviewFieldPresence,
              errors: reviewResponse.ok ? [] : (reviewResponse.json?.errors || reviewResponse.json),
            },
            betaAppLocalizations: {
              readable: localizationResponse.ok,
              status: localizationResponse.status,
              entries: localizations,
              errors: localizationResponse.ok ? [] : (localizationResponse.json?.errors || localizationResponse.json),
            },
          }, null, 2));
          NODE

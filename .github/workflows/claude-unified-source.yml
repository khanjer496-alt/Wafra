name: Claude unified source workspace
on:
  push:
    branches: [release/claude-unified-20260907]
    paths: [.github/workflows/claude-unified-source.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Archive pinned inputs and history without credentials
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git archive --format=tar.gz a2dbc0d8b9cc9c1a218dfa43e6f920d8df4921c1 > "$RUNNER_TEMP/source/main.tar.gz"
          git archive --format=tar.gz fc3bf248bc4e8a844a527e35119c73c2f26c1163 > "$RUNNER_TEMP/source/restoration.tar.gz"
          git archive --format=tar.gz 934e5cb14bfaf8dedd1b6adb0a7bcbd87d10267f > "$RUNNER_TEMP/source/claude-reference.tar.gz"
          BASE=$(git merge-base a2dbc0d8b9cc9c1a218dfa43e6f920d8df4921c1 fc3bf248bc4e8a844a527e35119c73c2f26c1163)
          git archive --format=tar.gz "$BASE" > "$RUNNER_TEMP/source/merge-base.tar.gz"
          git log --all -100 --oneline --decorate > "$RUNNER_TEMP/source/history.txt"
          git diff --stat "$BASE" a2dbc0d8b9cc9c1a218dfa43e6f920d8df4921c1 > "$RUNNER_TEMP/source/main-changes.txt"
          git diff --binary "$BASE" fc3bf248bc4e8a844a527e35119c73c2f26c1163 > "$RUNNER_TEMP/source/restoration.patch"
          git diff --binary "$BASE" a2dbc0d8b9cc9c1a218dfa43e6f920d8df4921c1 > "$RUNNER_TEMP/source/main.patch"
          printf 'main=a2dbc0d8b9cc9c1a218dfa43e6f920d8df4921c1\nrestoration=fc3bf248bc4e8a844a527e35119c73c2f26c1163\nreference=934e5cb14bfaf8dedd1b6adb0a7bcbd87d10267f\nbase=%s\n' "$BASE" > "$RUNNER_TEMP/source/inputs.txt"
          git log --oneline origin/main..origin/release/ios-shortcuts-review-20260907 > "$RUNNER_TEMP/source/ios-unmerged.txt"
          git log --oneline origin/main..origin/work/ios-guided-onboarding >> "$RUNNER_TEMP/source/ios-unmerged.txt"
          git diff --stat origin/main...origin/work/ios-guided-onboarding >> "$RUNNER_TEMP/source/ios-unmerged.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-unified-source-inputs
          path: ${{ runner.temp }}/source/
          retention-days: 7
          compression-level: 0
      - name: Install locked dependencies for isolated validation
        run: |
          npm ci --no-audit --no-fund
          npm --prefix server ci --no-audit --no-fund
          npx --no-install expo prebuild --platform ios --no-install
      - name: Package credential-free validation dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/dependencies"
          tar -czf "$RUNNER_TEMP/dependencies/dependencies.tar.gz" node_modules server/node_modules
          tar -czf "$RUNNER_TEMP/dependencies/generated-ios.tar.gz" ios
          NODE_ROOT="$(dirname "$(dirname "$(command -v node)")")"
          tar -czf "$RUNNER_TEMP/dependencies/toolchain.tar.gz" -C "$NODE_ROOT" bin/node bin/npm bin/npx lib/node_modules/npm
          sha256sum package-lock.json server/package-lock.json > "$RUNNER_TEMP/dependencies/lockfiles.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: claude-unified-validation-dependencies
          path: ${{ runner.temp }}/dependencies/
          retention-days: 3
          compression-level: 0

appId: ${APP_ID}
---
- launchApp:
    stopApp: true
# The StoreKit sign-in sheet can come up a few seconds after launch and covers Home (keyboard up); clear it BEFORE the
# first assertion, then wait for Settings.
- extendedWaitUntil:
    visible: 'Sign in to Apple.Account'
    timeout: 10000
    optional: true
- runFlow: dismiss.yaml
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 60000
- runFlow: dismiss.yaml
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      id: 'settings-data-and-help'
    direction: DOWN
    timeout: 60000
- tapOn:
    id: 'settings-data-and-help'
- extendedWaitUntil:
    visible:
      id: 'settings-data-screen'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: 'Erase all data'
    direction: DOWN
    timeout: 60000
- runFlow: dismiss.yaml
- tapOn: 'Erase all data'
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: 'Erase'

appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: 'Sign in to Apple.Account'
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: 'Sign in to Apple.Account'
    commands:
      - tapOn: 'Cancel'
- tapOn:
    text: 'Settings'
- scrollUntilVisible:
    element:
      text: 'Language'
    direction: DOWN
    timeout: 30000
- tapOn:
    text: 'Language'
- tapOn:
    text: 'العربية'
- waitForAnimationToEnd:
    timeout: 5000

appId: ${APP_ID}
---
- runFlow:
    when:
      visible: 'Open in .Wafra.\?'
    commands:
      - tapOn:
          point: '33%,54%'
- runFlow:
    when:
      visible: 'Add manually'
    commands:
      - tapOn: 'Add manually'
- runFlow:
    when:
      notVisible:
        id: 'add-transaction-screen'
    commands:
      - tapOn:
          point: '79%,10%'
- extendedWaitUntil:
    visible:
      id: 'add-transaction-screen'
    timeout: 30000
- takeScreenshot: row1-screen-open
- tapOn:
    id: 'amount-keypad-1'
- runFlow:
    when:
      visible: 'Ledger currency'
    commands:
      - tapOn:
          point: '50%,34%'
      - waitForAnimationToEnd:
          timeout: 4000
- takeScreenshot: row1-after-currency
- tapOn:
    id: 'amount-keypad-4'
- tapOn:
    id: 'amount-keypad-2'
- tapOn:
    id: 'add-merchant-field'
- inputText: 'LULU HYPERMARKET'
- hideKeyboard
- takeScreenshot: row1-typed
- tapOn:
    id: 'suggested-category-.*'
    optional: true
- tapOn:
    id: 'add-save'
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 30000
- runFlow:

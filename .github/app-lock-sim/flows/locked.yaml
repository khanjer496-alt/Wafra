appId: ${APP_ID}
---
- runFlow:
    when:
      visible: 'Open in .Wafra.\?'
    commands:
      - tapOn: 'Cancel'
- extendedWaitUntil:
    visible: 'Sign in to Apple.Account'
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: 'Sign in to Apple.Account'
    commands:
      - tapOn: 'Cancel'
- extendedWaitUntil:
    visible: 'Wafra is locked'
    timeout: 15000
- assertNotVisible: 'Settings'

appId: ${APP_ID}
---
- runFlow:
    when:
      visible: 'Open in .Wafra.\?'
    commands:
      - tapOn:
          point: '33%,54%'
- extendedWaitUntil:
    visible: 'Sign in to Apple.Account'
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: 'Sign in to Apple.Account'
    commands:
      - tapOn: 'Cancel'
- tapOn:
    text: 'Unlock with Face ID'
    optional: true

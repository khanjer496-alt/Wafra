appId: ${APP_ID}
---
- runFlow:
    when:
      visible: 'Open in .Wafra.\?'
    commands:
      - tapOn: 'Cancel'
- extendedWaitUntil:
    visible: 'Sign in to Apple.Account'
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: 'Sign in to Apple.Account'
    commands:
      - tapOn: 'Cancel'
- tapOn:
    text: 'Cancel'
    optional: true
- tapOn:
    text: 'Settings'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'settings-screen'
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      id: 'settings-app-lock'
    direction: DOWN
    timeout: 30000
- tapOn:
    id: 'settings-app-lock'
- tapOn:
    text: '(?i)(allow|ok)'
    optional: true

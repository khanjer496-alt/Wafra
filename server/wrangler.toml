name = "wafra-relay"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# The parser is imported from the app's own src/lib, so esbuild must be able to
# see outside this directory.
[build]
command = ""

[[d1_databases]]
binding = "DB"
database_name = "wafra"
# Replace with the id printed by: npx wrangler d1 create wafra
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Retry wake-only delivery twice an hour; the same job also sweeps expired rows.
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
# Message text is never logged, but keeping sampling explicit means nobody
# later assumes logs are a place to debug parsing from.
head_sampling_rate = 0.1

# Required production secrets/config (never commit values):
#   npx wrangler secret put PUSH_TOKEN_KEY    # base64 of 32 random bytes
#   npx wrangler secret put EXPO_ACCESS_TOKEN # EAS enhanced push security
# Set EXPO_PROJECT_ID and EMAIL_DOMAIN as non-secret production variables.
# Route EMAIL_DOMAIN to this Worker with Cloudflare Email Routing.

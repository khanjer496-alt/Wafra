name = "wafra-relay"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# The parser is imported from the app's own src/lib, so esbuild must be able to
# see outside this directory.
[build]
command = ""

[[d1_databases]]
binding = "DB"
database_name = "wafra"
# Written by `npm run setup`, which find-or-creates the database by name. Safe
# to commit: this identifies a database, it does not grant access to one.
database_id = "e0fcaf90-5eb3-4e5f-9b31-c4ed59803154"

# Nightly sweep of expired queue rows and long-dead devices.
[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true
# Message text is never logged, but keeping sampling explicit means nobody
# later assumes logs are a place to debug parsing from.
head_sampling_rate = 0.1

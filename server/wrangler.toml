name = "wafra-relay"
main = "src/index.ts"
compatibility_date = "2026-07-01"
# csv-parse and the statement/PDF import stack use Node's Buffer API. This
# compatibility date predates Cloudflare's 2026-08-04 Node-default cutoff, so
# opt in explicitly rather than changing every runtime behavior during a
# release deploy.
compatibility_flags = ["nodejs_compat"]

# The parser is imported from the app's own src/lib, so esbuild must be able to
# see outside this directory.
[build]
command = ""

[[d1_databases]]
binding = "DB"
database_name = "wafra"
# A D1 binding is resolved at build time and there is no environment-variable
# substitution for it, so the id has to live in this file. It is written by
# `npm run setup` (scripts/d1.mjs), which creates or finds the database and
# applies schema.sql. `npm run deploy` refuses to run while this is still the
# placeholder, so the failure is a sentence rather than a Cloudflare API error.
database_id = "e0fcaf90-5eb3-4e5f-9b31-c4ed59803154"

# Retry wake-only delivery twice an hour; the same job also sweeps expired rows.
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true
# Message text is never logged, but keeping sampling explicit means nobody
# later assumes logs are a place to debug parsing from.
head_sampling_rate = 0.1

# Required production secrets (never commit values). server/DEPLOY.md is the
# ordered sequence; this is the reminder of what has to exist:
#   npx wrangler secret put PUSH_TOKEN_KEY    # base64 of 32 random bytes
#   npx wrangler secret put EXPO_ACCESS_TOKEN # EAS enhanced push security
#
# The feedback → agent → PR loop needs two more. BOTH ARE OPTIONAL: without
# them the feedback endpoint still accepts and stores reports, it just never
# wakes an agent and never serves the read route. Nothing 500s.
#
#   npx wrangler secret put GITHUB_DISPATCH_TOKEN
#     A GitHub PAT used for exactly one call: POST /repos/{owner}/{repo}/dispatches.
#     Fine-grained PAT (preferred): scoped to THIS REPOSITORY ONLY, with the
#       single repository permission `Contents: Read and write`. That is what
#       the dispatch endpoint requires; it grants no access to Actions secrets,
#       to other repositories, or to the account.
#     Classic PAT (fallback): `repo` on a private repository, `public_repo` on
#       a public one. Strictly broader than the fine-grained equivalent — use it
#       only if fine-grained tokens are unavailable for the org.
#     Set an expiry and rotate it. Nothing depends on the token surviving: a
#     dead token records dispatch_status = 'failed' on the row and the feedback
#     is still there to re-fire by hand.
#
#   npx wrangler secret put FEEDBACK_READ_TOKEN
#     Any high-entropy string (`openssl rand -base64 32`). The Actions job
#     presents it as a bearer to GET /v1/feedback/:id. It reads ONE feedback
#     item and can do nothing else on this service — it is not a device
#     credential and cannot ingest, sync, acknowledge or administer anything.
#     The SAME value must be set as the repository secret
#     WAFRA_FEEDBACK_READ_TOKEN (Settings → Secrets and variables → Actions),
#     which is where .github/workflows/feedback-agent.yml reads it from.
#     Whoever owns the Cloudflare account sets both halves; they are the only
#     person who can, since the Worker secret is write-only after it is set.
#
# EXPO_PROJECT_ID, EMAIL_DOMAIN and GITHUB_REPOSITORY are not secret — they
# belong in the [vars] block at the end of this file, which is where the
# Worker reads them from. An empty string is worse than an absent key for all
# three: it deploys a Worker that looks configured and silently does nothing.
#
# EXPO_PROJECT_ID and GITHUB_REPOSITORY are now set there. EMAIL_DOMAIN stays
# commented out until Email Routing is actually configured:
#
# EMAIL_DOMAIN = "mail.example.com"   # only once Email Routing points here
#
# Without EXPO_PROJECT_ID (or PUSH_TOKEN_KEY) the Worker refuses push
# registration and sends no wakes; capture still works on foreground and
# background sync. Without EMAIL_DOMAIN the email supplement reports itself as
# disabled and /v1/email-token returns 503. Without GITHUB_REPOSITORY or
# GITHUB_DISPATCH_TOKEN feedback is stored with dispatch_status =
# 'skipped_unconfigured' and no agent runs. Without FEEDBACK_READ_TOKEN the
# agent read route is 503. All of these are deliberate degradations, not
# failures. Route EMAIL_DOMAIN to this Worker with Cloudflare Email Routing.
#
# ONE THING TO SET AT THE EDGE, not here. /v1/feedback is the only write path
# with no bearer token in front of it. The Worker's own global fixed window is
# a backstop, exactly as it is for /v1/pair; the production first line should
# be a Cloudflare rate-limiting rule on `http.request.uri.path eq
# "/v1/feedback"`, which is the only layer that can see a client IP without
# this service ever storing one.

# Set, because feedback dispatch is configured. The Worker holds the token as a
# secret; this says which repository to call. Not secret — it is the same
# owner/name that is on every clone URL — and it has to live here rather than
# beside the token because a `wrangler secret` is write-only once set, so a
# value anyone may need to read back belongs in the config that is committed.
#
# Without it the Worker stores feedback with dispatch_status
# 'skipped_unconfigured' and answers `dispatched: false`, which is what the
# first live POST reported: storage worked, the token was there, and the Worker
# had nothing to point at.
[vars]
GITHUB_REPOSITORY = "khanjer496-alt/Wafra"
# The EAS project the app is built against — the same UUID as
# expo.extra.eas.projectId in app.json, and it must stay the same as it:
# Expo's push service scopes a token to a project, so two values here and
# there means every wake is addressed to a project the device is not
# registered under, and nothing arrives.
#
# It was commented out until now, which is why the block above describes what
# happens without it. That was the live state: the deployed Worker refused
# push registration and sent no wakes at all. Nothing errored — capture kept
# working on foreground and background sync, so the only symptom was alerts
# arriving later than they should have, on a schedule nobody had chosen.
EXPO_PROJECT_ID = "fa920e7b-c661-4517-917d-26e8b4878721"

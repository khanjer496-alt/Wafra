plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notificationreader'
version = '0.1.0'

android {
  namespace "expo.modules.notificationreader"
  buildFeatures {
    buildConfig true
  }
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    // The listener ships in normal Android builds. Android notification access
    // and the exact Play-installed bank package allowlist still gate capture.
    buildConfigField 'boolean', 'WAFRA_ANDROID_NOTIFICATION_CAPTURE_ENABLED', 'true'
  }
}

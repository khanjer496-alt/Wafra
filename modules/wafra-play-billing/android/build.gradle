plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.wafraplaybilling'
version = '0.1.0'

android {
  namespace "expo.modules.wafraplaybilling"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Match the billing API already used by the shipped Superwall integration.
  implementation 'com.android.billingclient:billing:8.0.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
}

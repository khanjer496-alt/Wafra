plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.wafragrant'
version = '0.1.0'

android {
  namespace "expo.modules.wafragrant"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Already resolved in Wafra's Android release; this client owns its cookie policy.
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20250517'
}

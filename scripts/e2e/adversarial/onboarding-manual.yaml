appId: ${APP_ID}
---
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible: "Set up Wafra"
    timeout: 20000
- tapOn: "Set up Wafra"
- assertVisible: "Choose your message access."
- assertVisible: "Maximum privacy · no SMS access"
- tapOn: "Maximum privacy · no SMS access"
- assertVisible: "Ready when you are."
- assertVisible: "Open Wafra"
- tapOn: "Open Wafra"
- extendedWaitUntil:
    visible: "Home"
    timeout: 20000
- assertNotVisible: "Watching bank alerts"
- assertNotVisible: "Adversarial Opt Out"
- assertVisible: "Turn on automatic tracking"
- assertVisible: "Add manually"
- takeScreenshot: "manual-home-${PLATFORM}"

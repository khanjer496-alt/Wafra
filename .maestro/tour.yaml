appId: ${APP_ID}
---
- launchApp:
    clearState: true

- tapOn:
    text: '(?i)(allow|ok)'
    optional: true

- extendedWaitUntil:
    visible: 'Your money.*clearer picture.*'
    timeout: 120000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-01-onboarding-welcome

- tapOn:
    text: 'Build my money picture'
- extendedWaitUntil:
    visible: 'What do you want to understand first.*'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-02-onboarding-focus

- tapOn:
    text: 'Where my money goes'
    optional: true
- tapOn:
    text: 'Continue'
- extendedWaitUntil:
    visible: 'How do you track money today.*'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-03-onboarding-tracking

- tapOn:
    text: 'I check my bank apps'
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-04-onboarding-tracking-banks

- tapOn:
    text: 'Continue'
- extendedWaitUntil:
    visible: 'Your starting view is ready.*'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-05-onboarding-personalized

- tapOn:
    text: 'Connect my money'
- extendedWaitUntil:
    visible: 'Start your way'
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SHOT_PREFIX}-06-onboarding-connect

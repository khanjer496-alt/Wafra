# Intentionally tiny: this gate catches "builds but does not launch" regressions
# before spending time on a signed TestFlight archive.
appId: app.wafra.ios
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: onboarding-welcome
    timeout: 240000
- assertVisible:
    id: onboarding-welcome
- takeScreenshot: testflight-preflight-onboarding
